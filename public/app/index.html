<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunch Sorted</title>
<meta name="description" content="Plan a week of packed school lunches in about a minute. Cold-lunch ideas matched into balanced boxes, with the shopping list built for you.">
<meta name="theme-color" content="#E9EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lunch Sorted">
<style>
:root{color-scheme:light dark}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  /* how much room the phone keeps for the clock and the home indicator. Safari and a
     home-screen web app report it here; the iPhone shell runs full-bleed, where the
     web view reports nothing, so it sets these two on <html> from UIKit instead. */
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --ground:#E9EEE6; --surface:#FBFCF9; --surface-2:#F1F5EE; --sunk:#DFE7DB;
  --ink:#16241E; --ink-2:#4A5C53; --ink-3:#6E7F75;
  --line:#CFDACB; --line-strong:#1E3329;
  --c-main:#2E5A48; --c-side:#8A5309; --c-fruit:#A2304C; --c-sweet:#57448A; --c-snack:#6B7A1F; --c-drink:#2B6B85;
  --scrim:rgba(8,16,13,.5); --shadow-1:0 1px 2px rgba(0,0,0,.25); --shadow-lift:0 4px 0 rgba(0,0,0,.06);
  --accent:#2E5A48; --accent-fg:#FBFCF9; --accent-soft:#DCE8DF;
  --warn:#8A5A06; --warn-soft:#F6E9CE; --hot:#B4460F; --hot-soft:#FDE3D0;
  --toast-bg:#1E3329; --toast-fg:#F4F8F3;
  --r-lg:20px; --r-md:12px; --r-sm:8px;
  --f-display:"Familjen Grotesk","Trebuchet MS",sans-serif;
  --f-body:"Karla","Helvetica Neue",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1815; --surface:#17251F; --surface-2:#1E2F28; --sunk:#111C18;
    --ink:#E6EEE7; --ink-2:#A6BAAE; --ink-3:#7A8E84;
    --line:#2B3E36; --line-strong:#4E7263;
    --c-main:#79C8A2; --c-side:#E0A253; --c-fruit:#EA8299; --c-sweet:#A793DC; --c-snack:#C3CF6E; --c-drink:#7FC3DE;
    --scrim:rgba(0,0,0,.62); --shadow-1:0 0 0 1px rgba(255,255,255,.14); --shadow-lift:0 4px 0 rgba(255,255,255,.08);
    --accent:#79C8A2; --accent-fg:#0E1815; --accent-soft:#1F332A;
    --warn:#E0A253; --warn-soft:#2C2415; --hot:#F2A26E; --hot-soft:#3A2114;
    --toast-bg:#E6EEE7; --toast-fg:#0E1815;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1815; --surface:#17251F; --surface-2:#1E2F28; --sunk:#111C18;
  --ink:#E6EEE7; --ink-2:#A6BAAE; --ink-3:#7A8E84;
  --line:#2B3E36; --line-strong:#4E7263;
  --c-main:#79C8A2; --c-side:#E0A253; --c-fruit:#EA8299; --c-sweet:#A793DC; --c-snack:#C3CF6E; --c-drink:#7FC3DE;
  --scrim:rgba(0,0,0,.62); --shadow-1:0 0 0 1px rgba(255,255,255,.14); --shadow-lift:0 4px 0 rgba(255,255,255,.08);
  --accent:#79C8A2; --accent-fg:#0E1815; --accent-soft:#1F332A;
  --warn:#E0A253; --warn-soft:#2C2415; --hot:#F2A26E; --hot-soft:#3A2114;
  --toast-bg:#E6EEE7; --toast-fg:#0E1815;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
/* Under 16px iOS zooms the page when a field takes focus and never zooms back,
   which leaves every screen slightly enlarged and scrolling sideways. */
input,select,textarea{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:600px;margin:0 auto;
  padding:calc(18px + var(--sat)) 16px calc(96px + var(--sab))}
/* The web view runs under the status bar, so the clock needs its own strip of ground to
   sit on; without it a scrolled line of text runs straight through the time. */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:var(--sat);
  background:var(--ground);z-index:29;pointer-events:none}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-0.01em;white-space:nowrap}
.brand span{color:var(--c-side)}
.kid{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
h2.view-title{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;margin:0;text-wrap:balance}
.view-sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.titlerow{display:flex;align-items:center;column-gap:4px;row-gap:10px;flex-wrap:wrap}
@media (max-width:519px){.titlerow h2.view-title{font-size:22px}}
.titlerow .btn{flex:none}
.titlerow .btn:last-child{margin-left:auto}
.muted{color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-3)}
.hint.muted{color:var(--ink-2)}
.hint a{color:var(--accent)}

/* ---- the tin ---- */
.tin{border:2px solid var(--line-strong);border-radius:var(--r-lg);background:var(--line-strong);
  display:grid;grid-template-columns:1fr 1fr;gap:2px;overflow:hidden}
.cmp{background:var(--surface);border:0;padding:12px 12px 13px;min-height:104px;display:flex;flex-direction:column;
  gap:7px;text-align:left;align-items:stretch;transition:background .12s ease}
.cmp[data-act]:active{background:var(--surface-2)}
.cmp .lab{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;gap:6px}
.cmp .nm{font-family:var(--f-display);font-size:15.5px;font-weight:600;line-height:1.22;letter-spacing:-0.01em;color:var(--ink)}
.cmp .tr{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:6px}
.cmp .tr i{font-style:normal;font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;line-height:1;
  padding:4px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.cmp .tr i.care{background:transparent;color:var(--ink-3);padding-left:0}
.cmp.empty .nm{color:var(--ink-3);font-weight:500}
.c-main .lab{color:var(--c-main)} .c-side .lab{color:var(--c-side)}
.c-fruit .lab{color:var(--c-fruit)} .c-sweet .lab{color:var(--c-sweet)}
.c-snack .lab{color:var(--c-snack)} .c-drink .lab{color:var(--c-drink)}
.cmp.minor{min-height:76px}
.tin .cmp.minor:nth-child(5):last-child{grid-column:1/-1}
.tick{width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;flex:none}
.tick svg{width:9px;height:9px;opacity:0}
.tin.packed{border-color:var(--line);background:var(--line)}
.tin.packed .cmp>*{opacity:.55}
.packbox{gap:8px;font-weight:600}
.packbox[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.packbox[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.packbox[aria-pressed="true"] .tick svg{opacity:1}
.lock{opacity:.85}
.marks{display:inline-flex;align-items:center;gap:5px;flex:none}
.linkbtn{background:none;border:0;padding:10px 2px;margin:-10px -2px;font:inherit;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.over{width:15px;height:15px;border-radius:50%;background:var(--warn-soft);color:var(--warn);flex:none;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;line-height:1}
.swap{color:var(--ink-3);opacity:.9}
.cmp:active .swap{opacity:1}

.daycard{display:flex;flex-direction:column;gap:9px}
.daycard.past{opacity:.55}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:2px}
.dayname{font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:-0.01em}
.dayname em{font-family:var(--f-mono);font-style:normal;font-size:11px;font-weight:500;color:var(--ink-3);
  letter-spacing:.08em;margin-left:7px;text-transform:uppercase}
.note{font-size:13.5px;color:var(--ink-2);padding:0 2px;line-height:1.45}
.note b{font-weight:600;color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:5px}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.good{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.lock{background:var(--warn-soft);color:var(--warn);border-color:transparent;opacity:1}
.chip.picked{background:var(--accent-soft);color:var(--accent);border-color:transparent;margin-left:6px;vertical-align:middle}
.chip{white-space:nowrap}
.chip.lock svg{stroke-width:2.2}
.banner.wrap{flex-wrap:wrap}
.banner .btn{white-space:nowrap}

.btn{border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-md);
  padding:0 16px;min-height:44px;font-family:var(--f-display);font-weight:600;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
a.btn{text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--ink-2);font-weight:500}
.btn.wide{width:100%}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px;border-radius:var(--r-sm)}
.dayhead .btn.sm{font-size:12px;padding:0 10px;gap:6px}
.btn.danger{border-color:var(--line);color:var(--c-fruit);background:transparent}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card h3{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0 0 3px}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3);letter-spacing:.05em}

.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;padding-left:2px}
.sect-head h3{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.item{display:flex;align-items:center;gap:11px;padding:11px 13px;min-height:52px;border-top:1px solid var(--line);
  width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item button.grow{align-self:stretch;justify-content:center;text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.item .nm{display:block;font-size:14.5px;line-height:1.3}
.item .meta{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.05em}
.item .go{flex:none;display:inline-flex;align-items:center;color:var(--ink-3)}
.item.done .nm{text-decoration:line-through;color:var(--ink-2)}
.box{width:22px;height:22px;flex:none;border:1.5px solid var(--line-strong);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:transparent}
.item.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.box svg{width:12px;height:12px}
.x{flex:none;width:44px;height:44px;margin-right:-8px;border-radius:var(--r-sm);border:0;background:none;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center}
.qty{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=email],input[type=time],select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);
  padding:11px 12px;min-height:44px;width:100%}   /* the 16px above stands: under it iOS zooms */
textarea{min-height:70px;resize:vertical}
input[type=text]:focus,input[type=email]:focus,input[type=time]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.btn:disabled{cursor:default;background:var(--surface-2);border-color:var(--line-strong);color:var(--ink-3);box-shadow:none}
.btn:disabled svg{opacity:.6}
.item .nm,.item .meta,.kv span{overflow-wrap:anywhere}
.toggles{display:flex;flex-wrap:wrap;gap:7px}
.tg{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:0 13px;min-height:44px;
  font-size:13.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 -6px}
.dow .tg{min-width:0;min-height:44px;padding:0;justify-content:center;font-family:var(--f-mono);font-size:13px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch .t{font-size:14.5px}
.switch .d{font-size:12.5px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.sw{flex:none;width:50px;height:30px;border-radius:999px;border:1.5px solid var(--line);background:var(--sunk);position:relative;transition:background .15s}
.sw::before{content:"";position:absolute;inset:-8px -12px}   /* a 44px hit area around a 30px pill */
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);
  box-shadow:var(--shadow-1);transition:transform .15s ease}
.sw[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}

.empty{border:2px dashed var(--line);border-radius:var(--r-lg);padding:26px 20px;text-align:center;display:flex;
  flex-direction:column;gap:12px;align-items:center;background:var(--surface)}
.empty p{margin:0;color:var(--ink-2);font-size:14px;max-width:38ch}
.banner.good{background:var(--accent-soft);color:var(--accent)}
.banner.hot{background:var(--hot-soft);color:var(--hot);border:1.5px solid var(--hot)}
.banner.hot b{display:block;margin-bottom:2px}
.betabar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;padding:6px 6px 6px 13px;border-radius:var(--r-md);background:var(--hot-soft);color:var(--hot);font-size:13px;font-weight:600}
.betabar .btn{min-height:40px;padding:0 12px;font-size:13px;border-color:var(--hot);color:var(--hot);background:transparent}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-md);padding:11px 13px;font-size:13.5px;
  display:flex;gap:10px;align-items:center;justify-content:space-between}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--ground);background:color-mix(in srgb,var(--ground) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;
  padding:4px 4px calc(4px + var(--sab));z-index:20}
nav.tabs button{flex:1;border:0;background:none;min-height:48px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--ink-3);border-radius:var(--r-md)}
nav.tabs button span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
@media (max-width:359px){ nav.tabs button span{font-size:9px;letter-spacing:.04em} }
nav.tabs button[aria-current="true"]{color:var(--accent)}
nav.tabs button{position:relative}
nav.tabs .due{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--hot);border:2px solid var(--ground)}
nav.tabs svg{width:21px;height:21px}

.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none;transition:opacity .18s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--ground);border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);max-height:86vh;display:flex;flex-direction:column;visibility:hidden;
  transform:translateY(102%);transition:transform .22s cubic-bezier(.32,.72,0,1),visibility 0s .22s}
.sheet.open{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.32,.72,0,1),visibility 0s}
.sheet header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line)}
.sheet header h3{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0}
.sheet .body{overflow-y:auto;padding:14px 16px calc(20px + var(--sab));
  display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:8px auto 0}
.toast{position:fixed;left:50%;bottom:calc(78px + var(--sab));transform:translate(-50%,14px);
  background:var(--toast-bg);color:var(--toast-fg);padding:10px 16px;border-radius:16px;font-size:13.5px;z-index:40;max-width:min(92vw,420px);text-align:center;
  opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{min-height:44px;margin:-10px -8px -10px 8px;padding:0 8px;background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px}
@media (min-width:520px){
  .cmp{min-height:112px}
  h2.view-title{font-size:30px}
}

/* --- first run --- */
.ob{min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:22px;
  max-width:600px;margin:0 auto;
  padding:calc(34px + var(--sat)) 20px calc(34px + var(--sab))}
.ob h1{font-family:var(--f-display);font-size:clamp(30px,8.5vw,40px);font-weight:700;letter-spacing:-0.025em;
  line-height:1.08;margin:0;text-wrap:balance}
.ob .lede{font-size:16.5px;color:var(--ink-2);margin:8px 0 0;max-width:38ch}
.ob .q{display:flex;flex-direction:column;gap:9px}
.ob .q > span,.ob .q > label{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.ob .go{margin-top:4px}
.ob .skip{background:none;border:0;color:var(--ink-3);font-size:13.5px;text-decoration:underline;
  text-underline-offset:3px;min-height:44px}
.ob .skip.top{align-self:flex-start;padding:0;margin-top:-6px}
.oblogo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:64px;height:64px;border-radius:14px;
  border:2px solid var(--line-strong);background:var(--line-strong);overflow:hidden;margin-bottom:4px}

<script>
/* Merge rules for one household edited on two phones. Pure: two account
   documents in, one out; nothing else in the app knows how to merge, and the
   test suite runs this block on its own. Per record the newer updatedAt wins,
   a deletion beats an older edit, and per-event rows (packed ticks, eat
   answers, pantry ticks) merge by their own "at" stamps, so nobody's tick is
   lost and an un-tick (a row marked off) travels too. Lists come out in a
   fixed order so both phones compute the same document. A day that has gone
   keeps the plan that existed on it. The local copy wins every tie. */
window.LSMerge = (function(){
  "use strict";
  function stamp(r){ return (r && (r.updatedAt || r.at)) || ''; }
  function plusDays(isoDay, n){ var p = String(isoDay).split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function newer(a, b){ return stamp(b) > stamp(a) ? b : a; }
  function rowStamp(row){                              /* a review row's own stamp is its latest answer */
    if(!row) return '';
    if(row.skipped) return row.at || '';
    var m = ''; Object.keys(row).forEach(function(k){ var e = row[k]; if(e && e.at && e.at > m) m = e.at; }); return m;
  }
  function byId(list){ var m = Object.create(null); (Array.isArray(list) ? list : []).forEach(function(r){ if(r && r.id) m[r.id] = r; }); return m; }
  function sortIds(out){ return out.sort(function(x, y){ return (x.createdAt || '') < (y.createdAt || '') ? -1 : (x.createdAt || '') > (y.createdAt || '') ? 1 : x.id < y.id ? -1 : x.id > y.id ? 1 : 0; }); }
  function unionById(la, lb, mergeOne){
    var b = byId(lb), out = [], seen = Object.create(null);
    (Array.isArray(la) ? la : []).forEach(function(r){ if(!r || !r.id || seen[r.id]) return; seen[r.id] = 1; out.push(b[r.id] ? mergeOne(r, b[r.id]) : r); });
    (Array.isArray(lb) ? lb : []).forEach(function(r){ if(!r || !r.id || seen[r.id]) return; seen[r.id] = 1; out.push(r); });
    return sortIds(out);
  }
  function mergeRows(ra, rb){                          /* {date: {cat: {at,...}}} or {date:{skipped,at}} */
    var out = Object.create(null), keys = Object.create(null);
    Object.keys(ra || {}).forEach(function(k){ keys[k] = 1; }); Object.keys(rb || {}).forEach(function(k){ keys[k] = 1; });
    Object.keys(keys).sort().forEach(function(d){
      var x = (ra || {})[d], y = (rb || {})[d];
      if(!x || !y){ out[d] = x || y; return; }
      if(x.skipped || y.skipped){ out[d] = rowStamp(y) > rowStamp(x) ? y : x; return; }
      var row = Object.create(null), cats = Object.create(null);
      Object.keys(x).forEach(function(c){ cats[c] = 1; }); Object.keys(y).forEach(function(c){ cats[c] = 1; });
      Object.keys(cats).sort().forEach(function(c){ row[c] = (x[c] && y[c]) ? newer(x[c], y[c]) : (x[c] || y[c]); });
      out[d] = row;
    });
    return out;
  }
  function mergeMap(ma, mb){                           /* {key: {at,...}} */
    var out = Object.create(null), keys = Object.create(null);
    Object.keys(ma || {}).forEach(function(k){ keys[k] = 1; }); Object.keys(mb || {}).forEach(function(k){ keys[k] = 1; });
    Object.keys(keys).sort().forEach(function(k){ var x = (ma || {})[k], y = (mb || {})[k]; out[k] = (x && y) ? newer(x, y) : (x || y); });
    return out;
  }
  function mergePast(pa, pb){
    var seen = Object.create(null), out = [];
    (pa || []).concat(pb || []).forEach(function(d){ if(d && d.d && !seen[d.d]){ seen[d.d] = 1; out.push(d); } });
    return out.sort(function(x, y){ return x.d < y.d ? -1 : x.d > y.d ? 1 : 0; }).slice(-40);
  }
  /* the newer plan wins, day by day, except that a day already gone keeps the plan
     that existed on it (the older week), so what was packed stays as it was */
  function mergeWeek(wa, wb, today){
    if(!wa || !wb) return wa || wb;
    var lead = newer(wa, wb), lag = lead === wa ? wb : wa;
    var older = (wa.createdAt || '') <= (wb.createdAt || '') ? wa : wb;
    var days = Object.create(null);
    (lag.days || []).forEach(function(d){ if(d && d.d) days[d.d] = d; });
    (lead.days || []).forEach(function(d){ if(d && d.d) days[d.d] = d; });
    (older.days || []).forEach(function(d){ if(d && d.d && today && d.d < today && days[d.d]) days[d.d] = d; });
    return {id:lead.id, kidId:lead.kidId, start:lead.start, createdAt:older.createdAt || lead.createdAt, updatedAt:lead.updatedAt,
      days:Object.keys(days).sort().filter(function(k){ return k >= lead.start && k <= plusDays(lead.start, 6); }).map(function(k){ return days[k]; })};   /* one week's worth: a phone that rolled over must not union with the week it replaced */
  }
  function mergeKid(a, b, today){
    var head = newer(a, b);
    var settings = newer(a.settings || {}, b.settings || {});
    return {
      id:a.id, name:head.name, hue:head.hue, createdAt:(a.createdAt || '') < (b.createdAt || '') ? a.createdAt : b.createdAt,
      updatedAt:stamp(a) > stamp(b) ? a.updatedAt : b.updatedAt,
      deletedAt:(a.deletedAt || b.deletedAt) ? (head === a ? a.deletedAt : b.deletedAt) : null,
      settings:settings, foods:unionById(a.foods, b.foods, newer), week:mergeWeek(a.week, b.week, today), next:mergeWeek(a.next, b.next, today),
      packed:mergeRows(a.packed, b.packed), eaten:mergeRows(a.eaten, b.eaten), past:mergePast(a.past, b.past)
    };
  }
  function merge(a, b, today){
    if(!a) return b; if(!b) return a;
    var head = newer(a, b);
    return {
      schema:a.schema || b.schema || 2, id:a.id, name:head.name,
      createdAt:(a.createdAt || '') < (b.createdAt || '') ? a.createdAt : b.createdAt,
      updatedAt:stamp(a) > stamp(b) ? a.updatedAt : b.updatedAt,
      onboardedAt:a.onboardedAt || b.onboardedAt || null,
      tz:b.tz || a.tz || null,                               /* the copy already on the server (b) set it first; a joining phone (a) never moves it */
      members:unionById(a.members, b.members, newer),
      kids:unionById(a.kids, b.kids, function(x, y){ return mergeKid(x, y, today); }),
      activeKidId:a.activeKidId || b.activeKidId,
      align:(a.align && b.align) ? newer(a.align, b.align) : (a.align || b.align),
      reviewReminder:(a.reviewReminder && b.reviewReminder) ? newer(a.reviewReminder, b.reviewReminder) : (a.reviewReminder || b.reviewReminder),
      packWhen:(a.packWhen && b.packWhen) ? newer(a.packWhen, b.packWhen) : (a.packWhen || b.packWhen),
      recipes:unionById(a.recipes, b.recipes, newer),
      pantry:mergeMap(a.pantry, b.pantry)
    };
  }
  /* what two phones must agree on: everything but which lunchbox is open on screen */
  function same(a, b){
    var x = Object.assign({}, a, {activeKidId:null, updatedAt:null}), y = Object.assign({}, b, {activeKidId:null, updatedAt:null});
    return JSON.stringify(x) === JSON.stringify(y);
  }
  return {merge:merge, newer:newer, mergeRows:mergeRows, mergeWeek:mergeWeek, same:same};
})();
</script>

(function(){
"use strict";

/* =================================================================
   DATA MODEL — account > members > lunchboxes (profiles) > foods
   -----------------------------------------------------------------
   Shaped for more than one user from the start, even though today it
   runs on one device with no server:

     account   one household. Everything hangs off it, so a server only
               ever has to filter by account id.
     members   the adults who use the app. One is the owner. Actions
               that could differ per person (packing, pantry ticks)
               record `by: memberId`.
     kids      lunchbox profiles. Each has its OWN school rules, food
               list, week and pack state — two kids can attend two
               schools with two allergy policies.
     records   every row carries id / createdAt / updatedAt, and delete
               is a `deletedAt` tombstone rather than a splice, so a
               future sync can merge and propagate removals.

   Persistence goes through Store (below) and nothing else. Swapping
   localStorage for `fetch('/api/account')` is a change to that one
   object; the app already awaits it.
   ================================================================= */

/* ============================================================== recipes
   A food may carry a recipe, so a parent who planned a quinoa salad never has
   to leave the app to find out how to make it. The idea bank's cooked dishes
   carry one built in; a food a parent wrote or imported carries its own on the
   record (food.recipe), and the bank's is the fallback, exactly as `buy` works.
   Amounts are written the way a recipe is written, as text; parseIng reads the
   number and the unit off the front, which is all cook mode needs to halve
   them, double them, or say them in grams.
   R(minutes, lunches it makes, ingredients, steps) — both split on |. */
function R(m, y, ing, steps){ return {m:m, y:y, l:1, ing:ing.split('|'), steps:steps.split('|')}; }
var RECIPE = {
  /* ---- mains */
  'quinoa salad cup': R(25, 4, '1 cup quinoa|2 cups water|1/2 tsp salt|1 cucumber, diced small|1 cup cherry tomatoes, halved|3 tbsp olive oil|2 tbsp lemon juice|1/4 cup crumbled feta',
    'Rinse the quinoa in a sieve under cold water for half a minute — this is what keeps it from tasting bitter.|Bring the quinoa, water and salt to a boil, then cover and turn the heat right down for 15 minutes.|Take it off the heat, leave the lid on for 5 more minutes, then fluff it with a fork and spread it on a plate to cool.|Stir the cooled quinoa together with the cucumber, tomatoes, oil, lemon juice and feta.|Spoon into cups. It keeps for four days in the fridge, and it is better on day two.'),
  'pasta salad cup': R(20, 4, '8 oz small pasta|1 cup cherry tomatoes, halved|1/2 cup diced mozzarella|1/3 cup Italian dressing|1/4 tsp salt',
    'Boil the pasta in well-salted water until just tender, then drain and rinse it under cold water to stop it cooking.|Toss the cold pasta with the dressing while it is still slightly damp — it soaks it up better.|Fold through the tomatoes and mozzarella and taste for salt.|Pack into cups. Keeps four days; add a splash more dressing before packing on the last day.'),
  'chicken salad in a pita': R(15, 4, '2 cups cooked chicken, chopped|1/3 cup mayonnaise|1 stalk celery, diced small|1 tbsp lemon juice|1/4 tsp salt|4 pita breads',
    'Chop the chicken small enough to eat one-handed — this is a lunch, not a plate.|Stir it together with the mayonnaise, celery, lemon juice and salt.|Chill it for at least half an hour so it holds together.|Fill the pitas in the morning, not the night before, or the bread goes soft.'),
  'egg salad sandwich': R(20, 4, '6 eggs|1/4 cup mayonnaise|1 tsp mustard|1/4 tsp salt|8 slices sandwich bread',
    'Lower the eggs into already-boiling water and cook them for 10 minutes.|Move them straight into cold water and leave them 5 minutes; they peel far more easily cold.|Peel and mash with a fork, then stir in the mayonnaise, mustard and salt.|Spread on the bread. Pack with an ice pack — egg needs to stay cold.'),
  'tuna salad with crackers': R(10, 4, '2 cans tuna, drained|1/4 cup mayonnaise|1 tbsp lemon juice|1 stalk celery, diced small|1/4 tsp black pepper',
    'Drain the tuna properly, pressing the lid down hard, or the salad goes watery by Wednesday.|Flake it with a fork and stir in the mayonnaise, lemon juice, celery and pepper.|Pack in a sealed container with the crackers in their own bag, so they stay crisp.'),
  'hummus & veggie wrap': R(10, 4, '4 large tortillas|1 cup hummus|1 cucumber, cut into strips|1 cup shredded carrots|1 cup baby spinach',
    'Spread a quarter of the hummus over each tortilla, leaving a clear inch at the far edge.|Lay the cucumber, carrot and spinach in a line across the near third.|Roll it up tight, tucking the sides in as you go.|Cut in half on the diagonal and wrap each half, or it unrolls in the bag.'),
  'bean & cheese roll-up': R(10, 4, '1 can refried beans|1 cup shredded cheese|4 large tortillas|1/2 tsp cumin',
    'Warm the beans with the cumin in a pan until they spread easily.|Spread them over the tortillas and scatter the cheese on while the beans are still warm, so it softens.|Roll up tight and let them cool before packing, or they steam and go soggy.'),
  'yogurt & granola parfait': R(5, 4, '3 cups plain yogurt|1 cup granola|1 cup berries|2 tbsp honey',
    'Stir the honey through the yogurt.|Spoon it into four cups and top with berries.|Send the granola in its own little pot or bag — granola in yogurt since morning is granola no longer.'),
  'chicken & cheese skewers': R(15, 4, '2 cups cooked chicken, cubed|8 oz cheese, cubed|1/2 cup cherry tomatoes|8 short skewers',
    'Use short, blunt skewers, or cut long ones down so they fit the box flat.|Thread chicken, cheese and tomato, three or four pieces to a skewer.|Chill before packing, and pack with an ice pack.'),
  'cucumber sushi rolls': R(30, 4, '1 cup sushi rice|1 1/4 cups water|2 tbsp rice vinegar|1 tsp sugar|4 nori sheets|1 cucumber, cut into long strips',
    'Rinse the rice until the water runs clear, then cook it with the water, covered, for 15 minutes.|Stir the vinegar and sugar through the hot rice and let it cool to room temperature.|Spread a thin layer of rice over each nori sheet, leaving a clear strip at the far edge.|Lay the cucumber across and roll tightly, wetting the clear strip to seal it.|Cut into six with a wet knife, wiping the blade between cuts.'),
  'cold grilled chicken strips': R(20, 4, '1 1/2 lb chicken breast|2 tbsp olive oil|1 tsp paprika|1/2 tsp salt|1/2 tsp garlic powder',
    'Rub the chicken with the oil, paprika, salt and garlic powder.|Grill or pan-fry over medium heat, about 6 minutes a side, until it is 165F in the middle.|Rest it 5 minutes, then slice it across the grain into strips.|Cool completely before packing, and pack with an ice pack.'),
  'turkey & cheese pinwheels': R(10, 4, '4 large tortillas|3 tbsp cream cheese|8 slices deli turkey|4 slices cheese',
    'Spread the cream cheese thinly right to the edges of each tortilla — that is the glue.|Lay on the turkey and cheese, covering the whole tortilla.|Roll up as tightly as you can and wrap each roll; chill for 20 minutes.|Trim the ends and cut each roll into four rounds. Pack them cut-side up.'),
  'mac & cheese thermos': R(20, 4, '8 oz macaroni|2 tbsp butter|2 tbsp flour|2 cups milk|2 cups shredded cheese|1/2 tsp salt',
    'Fill the thermos with boiling water and leave it standing while you cook — a cold thermos loses the heat in an hour.|Boil the macaroni until just tender and drain it.|Melt the butter, stir in the flour and cook it a minute, then whisk in the milk a little at a time until it thickens.|Take it off the heat, stir in the cheese and salt, then fold through the pasta.|Empty the thermos, fill it with the piping hot macaroni and close it straight away.'),
  'grilled cheese, packed cold': R(10, 4, '8 slices sandwich bread|8 slices cheese|2 tbsp butter',
    'Butter the outside of the bread, not the pan.|Cook over medium-low heat, 3 minutes a side, until the cheese has properly melted.|Let the sandwiches cool fully on a rack before wrapping, or the steam turns them soggy.|Cut them just before packing.'),
  'chicken caesar wrap': R(15, 4, '2 cups cooked chicken, sliced|4 large tortillas|3 cups chopped romaine|1/3 cup caesar dressing|1/4 cup grated parmesan',
    'Toss the romaine with the dressing and parmesan just before you build the wraps.|Lay the chicken along the near third of each tortilla and pile the salad on top.|Roll up tight, cut in half, and wrap each half.|Pack with an ice pack; if it is being packed the night before, send the dressing separately.'),
  'mini bagel pizzas, cold': R(15, 4, '4 mini bagels, halved|1/2 cup pizza sauce|1 cup shredded mozzarella|1/2 tsp dried oregano',
    'Heat the oven to 400F.|Spread sauce over each bagel half, then the cheese and a pinch of oregano.|Bake 8 minutes, until the cheese is bubbling at the edges.|Cool completely before packing. They are meant to be eaten cold, and they are good cold.'),
  'rice & black bean bowl': R(25, 4, '1 cup rice|2 cups water|1 can black beans, rinsed|1 cup shredded cheese|1 tsp cumin|1/2 tsp salt|1 lime',
    'Cook the rice in the water, covered, for 15 minutes, then leave it to stand 5 minutes off the heat.|Warm the beans with the cumin and salt.|Fork the rice through with the juice of the lime.|Layer rice, then beans, then cheese in each cup, and let it cool before the lid goes on.'),
  'lentil soup thermos': R(35, 4, '1 cup red lentils|4 cups vegetable stock|1 onion, diced|2 carrots, diced|1 tbsp olive oil|1 tsp cumin|1/2 tsp salt',
    'Fill the thermos with boiling water and leave it to stand.|Soften the onion and carrot in the oil for 5 minutes, then stir in the cumin.|Add the lentils and stock, bring to a boil, then simmer 20 minutes until the lentils have collapsed.|Season, blend it smooth if that is how it gets eaten, and get it back to a proper boil.|Empty the thermos and fill it with the boiling soup.'),
  'turkey chili thermos': R(35, 4, '1 lb ground turkey|1 can kidney beans, rinsed|1 can diced tomatoes|1 onion, diced|2 tsp chili powder|1 tsp cumin|1/2 tsp salt',
    'Fill the thermos with boiling water and leave it to stand.|Brown the turkey with the onion, breaking it up as it goes.|Stir in the chili powder and cumin and cook a minute, until you can smell them.|Add the tomatoes and beans and simmer 20 minutes.|Empty the thermos and fill it with the chili at a rolling simmer.'),
  'tortellini salad': R(15, 4, '1 lb cheese tortellini|1 cup cherry tomatoes, halved|1/3 cup Italian dressing|1/4 cup sliced olives|2 tbsp chopped basil',
    'Boil the tortellini until they float and are just tender, then drain and rinse under cold water.|Toss with the dressing while still slightly warm.|Fold through the tomatoes, olives and basil.|Chill before packing. Keeps three days.'),
  'chicken & rice bowl': R(30, 4, '1 cup rice|2 cups chicken stock|2 cups cooked chicken, chopped|1 cup frozen peas|1 tbsp butter|1/2 tsp salt',
    'Fill the thermos with boiling water and leave it to stand.|Cook the rice in the stock, covered, for 15 minutes.|Stir in the chicken, peas, butter and salt and heat it right through.|Empty the thermos and fill it while the rice is steaming.'),
  'salmon & cracker bites': R(10, 4, '4 oz smoked salmon|4 oz cream cheese|1 tbsp lemon juice|1 tsp chopped dill|24 crackers',
    'Beat the cream cheese with the lemon juice and dill until it is soft enough to spread.|Pack it into a small pot with the salmon folded on top.|Send the crackers in their own bag, to be built at the table — spread crackers go soft in an hour.'),
  'blt wrap, hold the mayo': R(15, 4, '8 slices bacon|4 large tortillas|2 cups shredded lettuce|2 tomatoes, sliced|2 tbsp ranch dressing',
    'Cook the bacon until properly crisp and drain it on paper towel; limp bacon is worse cold.|Pat the tomato slices dry, which is what stops the wrap going soggy.|Spread a little ranch on each tortilla, then lettuce, tomato and two rashers of bacon.|Roll tight, cut in half, wrap each half.'),
  'pesto pasta cup': R(15, 4, '8 oz short pasta|1/3 cup pesto|1 cup cherry tomatoes, halved|2 tbsp grated parmesan|1 tbsp olive oil',
    'Boil the pasta in well-salted water until just tender.|Save a spoonful of the cooking water, then drain.|Stir the pesto and the reserved water through the hot pasta, so it coats rather than clumps.|Cool, then fold through the tomatoes, parmesan and oil.'),
  'cheese quesadilla, packed cold': R(10, 4, '4 large tortillas|2 cups shredded cheese|1 tsp olive oil',
    'Scatter cheese over half of each tortilla and fold it over.|Cook in a dry or barely oiled pan, 2 minutes a side, pressing it flat.|Cool completely on a rack before cutting into wedges, or the cheese runs.'),
  'egg & cheese muffin, cold': R(20, 4, '4 english muffins|4 eggs|4 slices cheese|1/4 tsp salt|1 tbsp butter',
    'Fry the eggs in the butter, breaking the yolks so they cook through — a runny yolk is not a lunch.|Salt them, lay a slice of cheese on each while hot, and let it melt.|Toast the muffins, build them, and cool them completely before wrapping.|Pack with an ice pack.'),
  'turkey & avocado wrap': R(10, 4, '4 large tortillas|8 slices deli turkey|2 avocados|1 tbsp lime juice|1/4 tsp salt',
    'Mash the avocado with the lime juice and salt — the lime is what keeps it from browning by lunchtime.|Spread it over each tortilla and lay the turkey on top.|Roll tight, cut in half, and wrap each half so it holds.'),
  'crackers, cheese cubes & salami': R(10, 4, '8 oz cheese, cubed|4 oz salami, sliced|24 crackers|1/2 cup grapes',
    'Cube the cheese the night before and keep it in a sealed pot; it dries out uncovered.|Fold the salami slices into quarters so they sit flat and do not grease the crackers.|Pack the crackers in their own compartment or bag, away from the cheese.|Add the grapes to fill the gaps and keep everything from rattling loose.'),
  'cream cheese & cucumber bagel': R(10, 4, '4 bagels, halved|6 oz cream cheese|1 cucumber, sliced thin|1/4 tsp salt|1 tsp chopped dill',
    'Slice the cucumber thin and lay it on paper towel with a pinch of salt for 10 minutes, then pat it dry.|Beat the dill through the cream cheese.|Spread it thickly on both halves — it is the barrier that keeps the bagel from going damp.|Lay the cucumber on and close. Best packed in the morning.'),
  'potato salad cup': R(30, 4, '2 lb potatoes|1/2 cup mayonnaise|1 tbsp mustard|2 stalks celery, diced|1 tbsp vinegar|1/2 tsp salt',
    'Cut the potatoes into even chunks and boil them in salted water for 12 minutes, until a knife slides in.|Drain and, while they are still hot, toss them with the vinegar; hot potato takes up flavour, cold potato does not.|Once cool, fold through the mayonnaise, mustard, celery and salt.|Chill for at least two hours. Pack with an ice pack.'),
  /* ---- sides */
  'hard-boiled egg': R(15, 6, '6 eggs|1 tsp salt',
    'Bring a pan of water to a proper rolling boil, then lower the eggs in on a spoon.|Boil 10 minutes for a firm yolk, 8 for a softer one.|Move them straight into cold water for 5 minutes; the shock is what makes them peel cleanly.|Peel under running water. They keep a week in the fridge, in the shell.'),
  'roasted chickpeas': R(40, 6, '2 cans chickpeas, rinsed|2 tbsp olive oil|1 tsp paprika|1/2 tsp salt|1/2 tsp garlic powder',
    'Heat the oven to 400F.|Dry the chickpeas thoroughly in a towel and pick out any loose skins — wet chickpeas steam instead of crisping.|Toss with the oil and spread them in one layer on a tray.|Roast 35 minutes, shaking the tray twice, until they rattle.|Toss with the paprika, salt and garlic powder while hot. Cool completely before they go in a pot, or they soften.'),
  'hummus cup': R(10, 6, '2 cans chickpeas, rinsed|1/3 cup tahini|1/4 cup lemon juice|2 cloves garlic|1/2 tsp salt|3 tbsp olive oil|3 tbsp cold water',
    'Blend the tahini, lemon juice and garlic first, on their own, until pale and thick.|Add the chickpeas and salt and blend again.|With the motor running, pour in the oil and then the cold water, a spoon at a time, until it is lighter than you expect.|Spoon into small pots. Keeps five days.'),
  'guacamole cup': R(10, 4, '3 avocados|1 lime|1/4 cup diced red onion|1/2 tsp salt|1 tbsp chopped cilantro',
    'Mash the avocado roughly, leaving some lumps.|Stir in the juice of the whole lime, the onion, salt and cilantro.|Pack into small pots filled to the brim, and press the lid right down onto the surface — air is what browns it.'),
  'three-bean salad': R(15, 6, '1 can kidney beans, rinsed|1 can green beans, drained|1 can chickpeas, rinsed|1/4 cup vinegar|3 tbsp olive oil|2 tbsp sugar|1/2 tsp salt',
    'Whisk the vinegar, oil, sugar and salt until the sugar has dissolved.|Fold the beans through and refrigerate at least four hours; this one really is better the next day.|Lift it out with a slotted spoon so the box does not fill with dressing.'),
  'coleslaw cup': R(15, 6, '1/2 head cabbage, shredded|2 carrots, grated|1/2 cup mayonnaise|2 tbsp vinegar|1 tbsp sugar|1/2 tsp salt',
    'Toss the shredded cabbage with the salt and leave it in a colander for 20 minutes, then squeeze it dry — this is the difference between coleslaw and soup.|Whisk the mayonnaise, vinegar and sugar together.|Fold everything through and chill. Pack with an ice pack.'),
  'corn salad cup': R(10, 6, '3 cups corn kernels|1 cup cherry tomatoes, halved|1/4 cup diced red onion|2 tbsp lime juice|2 tbsp olive oil|1/2 tsp salt',
    'If the corn is frozen, run it under hot water and drain it well rather than cooking it.|Toss everything together and taste for salt.|Chill an hour before packing.'),
  'caprese skewers': R(10, 4, '16 cherry tomatoes|16 mozzarella balls|16 basil leaves|1 tbsp olive oil|8 short skewers',
    'Thread tomato, a folded basil leaf and a mozzarella ball, twice per skewer.|Brush with the oil just before packing, not the night before.|Keep them flat in the box and pack with an ice pack.'),
  'edamame': R(10, 4, '2 cups frozen edamame in the pod|1 tsp salt',
    'Boil the pods in salted water for 4 minutes, no longer, or they go grey.|Drain and cool them under cold water straight away.|Toss with the salt and pack them cold. They are eaten by squeezing the beans out of the pod.'),
  /* ---- sweets and snacks worth making */
  'banana muffin': R(35, 12, '3 ripe bananas|1/3 cup melted butter|3/4 cup sugar|1 egg|1 tsp vanilla|1 tsp baking soda|1/4 tsp salt|1 1/2 cups flour',
    'Heat the oven to 350F and line a 12-hole muffin tin.|Mash the bananas properly — the browner and softer they are, the better this is.|Stir in the butter, sugar, egg and vanilla.|Sprinkle the baking soda and salt over the top and stir them in, then fold in the flour until it just disappears. Do not beat it.|Divide between the holes and bake 20 minutes, until a skewer comes out clean.|Cool in the tin 5 minutes, then on a rack. They freeze well; one goes in the box frozen and thaws by lunch.'),
  'blueberry muffin': R(35, 12, '2 cups flour|1/2 cup sugar|2 tsp baking powder|1/2 tsp salt|1 cup milk|1/3 cup oil|1 egg|1 1/2 cups blueberries',
    'Heat the oven to 375F and line a 12-hole muffin tin.|Whisk the flour, sugar, baking powder and salt in one bowl; the milk, oil and egg in another.|Pour the wet into the dry and fold about ten times only — lumps are fine, a smooth batter makes tough muffins.|Toss the blueberries in a spoonful of flour, then fold them through; that is what stops them sinking.|Bake 20 minutes until springy. Cool on a rack.'),
  'apple cinnamon muffin': R(35, 12, '2 cups flour|3/4 cup brown sugar|2 tsp baking powder|2 tsp cinnamon|1/2 tsp salt|1 cup milk|1/3 cup oil|1 egg|2 apples, diced small',
    'Heat the oven to 375F and line a 12-hole muffin tin.|Whisk the dry ingredients together, then the milk, oil and egg separately.|Fold the wet into the dry until only just combined.|Fold through the diced apple and divide between the holes.|Bake 22 minutes. Cool fully before packing, or they sweat in the wrapper.'),
  'banana bread slice': R(70, 10, '3 ripe bananas|1/2 cup melted butter|3/4 cup sugar|2 eggs|1 tsp vanilla|1 tsp baking soda|1/2 tsp salt|2 cups flour',
    'Heat the oven to 350F and line a loaf tin.|Mash the bananas, then stir in the butter, sugar, eggs and vanilla.|Sprinkle over the baking soda and salt, stir, then fold in the flour just until it disappears.|Bake 55 minutes, until a skewer comes out clean; cover the top with foil if it browns early.|Cool completely in the tin before slicing, or it crumbles.'),
  'zucchini bread slice': R(70, 10, '2 cups grated zucchini|2 cups flour|1 cup sugar|2 eggs|1/2 cup oil|1 tsp baking soda|2 tsp cinnamon|1/2 tsp salt',
    'Heat the oven to 350F and line a loaf tin.|Grate the zucchini and squeeze it in a towel until no more water comes out — skip this and the loaf will not set.|Beat the eggs, oil and sugar, then stir in the zucchini.|Fold in the flour, baking soda, cinnamon and salt.|Bake 55 minutes. Cool fully before slicing.'),
  'pumpkin bread slice': R(70, 10, '1 can pumpkin puree|2 cups flour|1 cup sugar|2 eggs|1/2 cup oil|1 tsp baking soda|2 tsp pumpkin spice|1/2 tsp salt',
    'Heat the oven to 350F and line a loaf tin.|Beat the pumpkin, sugar, eggs and oil together.|Fold in the flour, baking soda, spice and salt until just combined.|Bake 60 minutes, until a skewer comes out clean.|Cool fully in the tin. It slices far better the next day.'),
  'oatmeal cookie': R(30, 24, '1 cup butter, softened|1 cup brown sugar|2 eggs|1 tsp vanilla|1 1/2 cups flour|1 tsp baking soda|1 tsp cinnamon|1/2 tsp salt|3 cups rolled oats|1 cup raisins',
    'Heat the oven to 350F and line two trays.|Beat the butter and sugar until pale, then beat in the eggs and vanilla.|Stir in the flour, baking soda, cinnamon and salt, then the oats and raisins.|Drop tablespoons onto the trays, well apart.|Bake 11 minutes — they will look underdone in the middle, and that is what keeps them chewy.|Leave them on the tray 5 minutes before moving them.'),

var RECIPE_BY_KEY = null;
/* the bank's recipes, safe against a food called __proto__ */
function recipeByName(n){
  if(!RECIPE_BY_KEY){ RECIPE_BY_KEY = nullMap(); Object.keys(RECIPE).forEach(function(k){ RECIPE_BY_KEY[k] = RECIPE[k]; }); }
  return RECIPE_BY_KEY[normKey(n)] || null;
}
/* ---- the household's library, and the bank behind it.
   A food resolves to a recipe three ways, in order: the one it was given, one of the
   household's own by the same name, and failing both the idea bank's — the same
   fallback `buy` uses, so a list seeded before any of this existed gets them too. */
function libRecipes(){ return (S && Array.isArray(S.recipes) ? S.recipes : []).filter(function(r){ return !r.deletedAt; }); }
function libById(id){
  if(!id) return null;
  var hit = libRecipes().filter(function(r){ return r.id === id; })[0];
  return hit || null;
}
function libByName(n){
  if(!n) return null;
  var key = normKey(n);
  return libRecipes().filter(function(r){ return normKey(r.n) === key; })[0] || null;
}
function recipeFor(f){
  if(!f) return null;
  return libById(f.recipeId) || libByName(f.n) || recipeByName(f.n);
}
/* every recipe a parent can open, theirs first, the bank's after, each one already
   knowing whether it is on a food list and whose */
function allRecipes(){
  var out = [], seen = nullMap();
  libRecipes().slice().sort(function(a, b){ return (a.n || '').localeCompare(b.n || ''); }).forEach(function(r){
    seen[normKey(r.n)] = 1; out.push({r:r, own:true});
  });
  BANK.forEach(function(b){
    var r = recipeByName(b.n);
    if(r && !seen[normKey(b.n)]){ seen[normKey(b.n)] = 1; out.push({r:r, own:false, name:b.n}); }
  });
  return out;
}
/* the name a recipe goes by, whether it is the household's or the bank's */
function recipeName(e){ return e.own ? e.r.n : e.name; }
/* which lunchboxes hold a food this recipe belongs to */
function recipeOn(e){
  var nm = normKey(recipeName(e)), id = e.own ? e.r.id : null;
  return kids().filter(function(k){
    return foodsOf(k).some(function(f){ return (id && f.recipeId === id) || normKey(f.n) === nm; });
  });
}

/* ------------------------------------------------- amounts
   An ingredient is stored as the line a recipe writes ("1 1/2 cups rolled oats").
   Reading the number and the unit off the front is all cook mode needs to halve
   it, double it, or say it in grams; anything it cannot read stays exactly as
   written, which is the honest answer for "a handful of spinach". */
var FRACS = {'½':.5,'⅓':1/3,'⅔':2/3,'¼':.25,'¾':.75,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
var UNITS = [
  ['tbsp', /^(?:tbsps?|tbs|tablespoons?)\b\.?/i],
  ['tsp',  /^(?:tsps?|teaspoons?)\b\.?/i],
  ['floz', /^(?:fl\.?\s?ozs?|fluid ounces?)\b\.?/i],
  ['cup',  /^(?:cups?|c)\b\.?/i],
  ['ml',   /^(?:mls?|millilit(?:er|re)s?)\b\.?/i],
  ['l',    /^(?:l|lit(?:er|re)s?)\b\.?/i],
  ['oz',   /^(?:ozs?|ounces?)\b\.?/i],
  ['lb',   /^(?:lbs?|pounds?)\b\.?/i],
  ['kg',   /^(?:kgs?|kilograms?)\b\.?/i],
  ['g',    /^(?:g|grams?)\b\.?/i]
];
var ML = {tsp:4.93, tbsp:14.79, cup:236.6, floz:29.57, ml:1, l:1000};
var GRAMS = {oz:28.35, lb:453.6, g:1, kg:1000};
/* Grams per millilitre, for the things a lunch recipe measures by the cup. A
   liquid is left in millilitres however well we know its density, because that
   is how a jug is marked; anything not here at all keeps the measure it was
   written in, since guessing a density is worse than not converting. */
var POUR = /\boil\b|\bmilk\b|\bwater\b|\bstock\b|\bjuice\b|\bvinegar\b|\bdressing\b|\bsauce\b|\bcream\b(?! cheese)/;
var DENSITY = [
  [/\bflour\b/, .53], [/\brolled oats\b|\boats\b/, .4], [/\bbrown sugar\b/, .91], [/\bpowdered sugar\b|\bicing sugar\b/, .5],
  [/\bsugar\b/, .85], [/\bcocoa\b/, .42], [/\bbutter\b(?!milk)/, .96], [/\bhoney\b/, 1.42],
  [/\bmaple syrup\b/, 1.32], [/\byogurt\b/, 1.03],
  /* a cup of puffed cereal weighs almost nothing; a cup of the rice it was puffed
     from weighs eight times as much, so the puffed one is named before the grain */
  [/\bcrisped rice\b|\bpuffed\b|\brice cereal\b/, .11],
  [/\bquinoa\b/, .71], [/\brice\b/, .8],
  [/\bchocolate chips\b/, .74], [/\btahini\b|\bmayonnaise\b/, 1.05], [/\bshredded cheese\b|\bgrated parmesan\b/, .48],
  [/\bgranola\b/, .42], [/\blentils\b/, .85], [/\bhummus\b/, 1.05], [/\bpesto\b/, 1.03]
];
function densityOf(name){
  if(POUR.test(name)) return 0;
  for(var i=0;i<DENSITY.length;i++) if(DENSITY[i][0].test(name)) return DENSITY[i][1];
  return 0;
}
/* "1 1/2", "1½", "3/4", "2", "1.5", "1-2" (the first of a range) */
function parseQty(s){
  var m = s.match(/^(\d+(?:\.\d+)?)\s*(?:[-–]\s*\d+(?:\.\d+)?)?\s*(\d)\/(\d)/);      /* 1 1/2 */
  if(m) return {q:+m[1] + (+m[2] / +m[3]), len:m[0].length};
  m = s.match(/^(\d+(?:\.\d+)?)\s*([½⅓⅔¼¾⅛⅜⅝⅞])/);                        /* 1½ */
  if(m && FRACS[m[2]]) return {q:+m[1] + FRACS[m[2]], len:m[0].length};

  if(m) return {q:+m[1] / +m[2], len:m[0].length};
  m = s.match(/^([½⅓⅔¼¾⅛⅜⅝⅞])/);                                          /* ½ */
  if(m && FRACS[m[1]]) return {q:FRACS[m[1]], len:m[0].length};
  m = s.match(/^(\d+(?:\.\d+)?)\s*[-–]\s*\d+(?:\.\d+)?/);                             /* 1-2 */
  if(m) return {q:+m[1], len:m[0].length};
  m = s.match(/^(\d+(?:\.\d+)?)/);                                                         /* 2 */
  if(m) return {q:+m[1], len:m[0].length};

/* {q, u, n, raw} — q null when the line has no number the app can scale */
function parseIng(line){

var COMMON = [[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞']];
/* a number a parent can act on: 1½, not 1.5, and never 0.6666666666 */
function fmtQty(q){

function fmtMass(g){ return (g < 100 ? Math.round(g) : Math.round(g / 5) * 5) + ' g'; }

/* The other direction, for a recipe that arrived written in grams: a kitchen that

/* An ingredient line at this many servings, in this system of measures. A spoonful

         becomes millilitres, and a cup of cherry tomatoes stays a cup, because
         240 ml of cherry tomatoes is not a measurement anyone has ever used */
      if(d && ml * d >= METRIC_MIN) return fmtMass(ml * d) + ' ' + n;
      if(POUR.test(n) && ml >= METRIC_MIN) return fmtVol(ml) + ' ' + n;

}
function unitWord(u, q){

}
/* a step reads the same in both, except that an oven has two scales */
function stepLine(text, metric){
  if(!metric || /\d\s*(?:°\s*)?C\b/.test(text)) return text;    /* already says both; saying it twice helps nobody */
  return String(text).replace(/(\d{2,3})\s*(?:°\s*)?F\b/g, function(all, f){
    return all + ' (' + Math.round((+f - 32) * 5 / 9 / 5) * 5 + '°C)';
  });
}

/* ================================================================ storage
   The ONLY place that touches persistence. Both calls are async so the
   UI already tolerates a round trip; a server version replaces the two
   bodies with fetch() and nothing else in the app changes.
   ---------------------------------------------------------------- */
var Store = {
  KEY:'lunchsorted',             /* the account document */
  PRIOR_KEYS:['fiveboxes','lunchbox-tin'],   /* the same document under the app's earlier names, newest first */
  DEVICE_KEY:'lunchsorted-device', /* which member is on THIS device — never exported */
  PRIOR_DEVICE_KEY:'fiveboxes-device',
  LEGACY_KEY:'lunchbox-tin-v1',  /* single-profile format, migrated on first run */
  ok:true,
  load:function(){
    return new Promise(function(res){
      var out = {doc:null, legacy:null, device:null, raw:null, unreadable:false, renamed:false};
      try{
        var raw = localStorage.getItem(Store.KEY);
        if(!raw){                                       /* found under an old name: write it under the new one */
          for(var i=0; i<Store.PRIOR_KEYS.length && !raw; i++) raw = localStorage.getItem(Store.PRIOR_KEYS[i]);
          out.renamed = !!raw;
        }
        out.raw = raw;
        if(raw){ try{ out.doc = JSON.parse(raw); }catch(e){ out.unreadable = true; } }
        var old = localStorage.getItem(Store.LEGACY_KEY);
        if(old){ try{ out.legacy = JSON.parse(old); }catch(e){ out.legacy = null; } }
        out.device = localStorage.getItem(Store.DEVICE_KEY) || localStorage.getItem(Store.PRIOR_DEVICE_KEY);
      }catch(e){ Store.ok = false; }
      res(out);
    });
  },
  save:function(doc, deviceMemberId){
    return new Promise(function(res){
      try{
        localStorage.setItem(Store.KEY, JSON.stringify(doc));
        if(deviceMemberId) localStorage.setItem(Store.DEVICE_KEY, deviceMemberId);
        Store.PRIOR_KEYS.forEach(function(k){ localStorage.removeItem(k); });   /* one copy on disk, under one name */
        localStorage.removeItem(Store.PRIOR_DEVICE_KEY);
      }catch(e){ Store.ok = false; }
      res(true);
    });
  },
  /* Never overwrite something we could not read: park the raw text under a
     dated key so it can be recovered by hand or pasted back in. */
  BACKUP_PREFIX:'lunchsorted-backup-',
  backupKeys:function(){
    try{ return Object.keys(localStorage).filter(function(k){ return k.indexOf(Store.BACKUP_PREFIX) === 0 || k.indexOf('fiveboxes-backup-') === 0; }).sort(); }catch(e){ return []; }
  },
  backup:function(raw){
    if(!raw) return false;
    try{
      var keys = Store.backupKeys();
      if(keys.some(function(k){ return localStorage.getItem(k) === raw; })) return true;   /* already kept */
      while(keys.length >= 2) localStorage.removeItem(keys.shift());                          /* never more than two */
      localStorage.setItem(Store.BACKUP_PREFIX+Date.now(), raw); return true;
    }catch(e){ return false; }

var CAT_ICON = {main:'🍱', side:'🥕', fruit:'🍎', sweet:'🍪', snack:'🍘', drink:'🥤'};

/* A photo of the real thing, for the kid who cannot read yet: taken once on the Foods tab,
   shrunk on the phone to a thumbnail a few kilobytes big, stored with the food so it
   travels with the household. Where there is no photo, the emoji stands in. */
var PHOTO_PX = 160, PHOTO_MAX = 16000;
function picHTML(food, cls){
  if(food && food.img) return '<img class="pic '+(cls||'')+'" src="'+food.img+'" alt="">';
  return '<span class="ic '+(cls||'')+'">'+iconFor(food)+'</span>';
}
function shrinkPhoto(file){
  var decode = window.createImageBitmap
    ? createImageBitmap(file).then(function(bm){ return {im:bm, w:bm.width, h:bm.height}; })
    : new Promise(function(resolve, reject){                 /* older WebKit: through a blob URL, which the policy allows for images */
        var url = URL.createObjectURL(file), im = new Image();
        im.onload = function(){ URL.revokeObjectURL(url); resolve({im:im, w:im.naturalWidth, h:im.naturalHeight}); };
        im.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('unreadable')); };
        im.src = url;
      });
  return decode.then(function(src){
    var side = Math.min(src.w, src.h); if(!side) throw new Error('empty');
    var c = document.createElement('canvas'); c.width = c.height = PHOTO_PX;
    var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, PHOTO_PX, PHOTO_PX);   /* a JPEG has no alpha: white under a transparent source, in every theme */
    g.drawImage(src.im, (src.w - side) / 2, (src.h - side) / 2, side, side, 0, 0, PHOTO_PX, PHOTO_PX);   /* the middle square */
    if(src.im.close) src.im.close();
    var q = 0.66, out = c.toDataURL('image/jpeg', q);
    while(out.length > PHOTO_MAX && q > 0.3){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
    if(out.length > PHOTO_MAX) throw new Error('big');
    return out;
  });
}
function iconFor(food){
  if(!food) return '';
  var n = String(food.n).toLowerCase();
  for(var i=0;i<ICONS.length;i++) if(n.indexOf(ICONS[i][0])>-1) return ICONS[i][1];
  return CAT_ICON[food.c] || '🍱';
}

/* ------------------------------------------------------------- helpers */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function weekStart(d){ return addDays(d, -((d.getDay()+6)%7)); }
function has(item,tag){ return !!(item && item.t && item.t.indexOf(tag)>-1); }
function toast(msg, undo){
  var t = document.getElementById('toast');
  t.textContent = msg;
  UI.undo = undo || null;
  if(undo){ var b = document.createElement('button'); b.type='button'; b.setAttribute('data-act','undo'); b.textContent = 'Undo'; t.appendChild(b); }
  t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); UI.undo = null; }, undo ? Math.max(6000, String(msg).length * 55) : Math.max(2000, String(msg).length * 55));
}

/* --------------------------------------------------------- school rules */
var AVOID_CACHE = {text:null, words:[]};
function avoidWords(s){
  var t = s.avoidText || '';
  if(AVOID_CACHE.text !== t){
    AVOID_CACHE.text = t;
    AVOID_CACHE.words = t.split(',').map(function(w){ return w.trim().toLowerCase(); }).filter(function(w){ return w.length>1; });
  }
  return AVOID_CACHE.words;
}
function violation(kid, food){
  if(!food) return null;
  var s = kid.settings;
  if(s.noHeat && has(food,'heat')) return 'needs heating';
  if(s.noIce && has(food,'ice')) return 'needs an ice pack';
  if(s.shortWindow && has(food,'messy')) return 'fiddly for a short lunch';
  if(s.noChoc && CHOC_RE.test(food.n)) return 'chocolate or candy';
  var bad = (food.al||[]).filter(function(a){ return s.avoidAllergens.indexOf(a)>-1; });
  if(bad.length) return 'has '+bad.map(function(k){ return (ALLERGENS.filter(function(y){ return y.k === k; })[0] || {label:k}).label.toLowerCase(); }).join(' and ');
  var words = avoidWords(s);
  for(var i=0;i<words.length;i++) if(food.n.toLowerCase().indexOf(words[i])>-1) return 'on your avoid list';
  return null;
}
function eligible(kid, cat){
  return foodsOf(kid).filter(function(f){ return f.c===cat && !violation(kid,f); });
}
/* A parent can put a food in a box that a rule keeps out — their kid, their
   call. The override is recorded against the exact food, so it lasts only as
   long as that food is in that compartment: a re-draw or another choice ends
   it, and it never spreads to any other draw. */
function isOverride(kid, day, cat){
  var f = foodById(kid, day.slots[cat]);
  return !!(f && day.over && day.over[cat] && day.over[cat] === day.slots[cat] && violation(kid, f));   /* the record stays; the flag needs a rule to break */
}
function setOverride(day, cat, foodId){
  day.over = day.over || {};
  if(foodId) day.over[cat] = foodId; else delete day.over[cat];
}
function overrides(kid, day){
  return catsFor(kid).filter(function(c){ return isOverride(kid, day, c.k); });
}

/* ------------------------------------------------ pairing (deterministic) */
function pairScore(main, item, cat){
  if(!main || !item) return {s:0, why:[]};
  var s = 0, why = [];
  if(cat === 'drink'){
    if(has(main,'sweet') && has(item,'sweet')) s -= 2;            /* sweet main + juice is a sugar box */
    if(has(main,'salty') && has(item,'light')){ s += 1; why.push({w:1,k:'drink',n:item.n}); }
    return {s:s, why:why};
  }
  if(has(main,'soft') && has(item,'crunchy')){ s += 3; why.push({w:3,k:'crunch',n:item.n}); }
  if(has(main,'crunchy') && has(item,'soft')) s += 1;
  if(!has(main,'protein') && has(item,'protein')){ s += 3; why.push({w:3,k:'protein',n:item.n}); }
  if(has(main,'hearty') && has(item,'light')){ s += 2; why.push({w:2,k:'light',n:item.n}); }
  if(has(main,'hearty') && has(item,'hearty')) s -= 3;
  if(has(main,'messy') && has(item,'messy')) s -= 3;
  if(has(main,'savory') && has(item,'tangy')){ s += 2; why.push({w:2,k:'tangy',n:item.n}); }
  if(has(main,'salty') && has(item,'juicy')){ s += 2; why.push({w:2,k:'juicy',n:item.n}); }
  if(has(main,'sweet') && has(item,'sweet')) s -= 2;
  if(cat==='sweet'){
    if(has(main,'sweet')) s -= 2;
    if(has(item,'light') && has(main,'hearty')){ s += 1; why.push({w:1,k:'finish',n:item.n}); }
    if(has(item,'hearty') && has(main,'hearty')) s -= 2;
  }
  if(cat==='fruit' && has(item,'juicy') && !has(main,'messy')){ s += 1; why.push({w:1,k:'fresh',n:item.n}); }
  return {s:s, why:why};
}
function dayFlags(kid, day){
  var items = catsFor(kid).map(function(c){ return foodById(kid, day.slots[c.k]); }).filter(Boolean);
  var f = [];
  if(items.some(function(i){ return has(i,'ice'); })) f.push({t:'Ice pack', cls:''});
  if(items.some(function(i){ return has(i,'messy'); })) f.push({t:'Sealed container', cls:''});
  if(items.length && !items.some(function(i){ return has(i,'protein'); })) f.push({t:'No protein', cls:'warn'});
  if(day.kidPick && Object.keys(day.kidPick).length) f.push({t:kidLabel(kid) ? kidLabel(kid)+' picked' : 'Picked', cls:'picked'});
  if(overrides(kid, day).length) f.push({t:'Against the rules', cls:'warn'});
  return f;
}

/* ------------------------------------------------------- first-run seeding
   The onboarding answers pick how wide a starting list to build. A stranger
   should never face an empty app: three taps have to produce a planned week. */
var BREADTH = {
  variety:{n:{main:14,side:14,fruit:10,sweet:10,snack:8,drink:3}, easyOnly:false},
  some:   {n:{main:8, side:9, fruit:7, sweet:7, snack:5,drink:2}, easyOnly:false},
  picky:  {n:{main:5, side:5, fruit:4, sweet:4, snack:3,drink:2}, easyOnly:true}
};
function seedCategory(kid, catKey, n, easyOnly){
  var pool = BANK.filter(function(b){ return b.c===catKey && !violation(kid,b) && (!easyOnly || b.e); });
  if(easyOnly && pool.length < n)                    /* too strict to fill a week — widen */
    pool = BANK.filter(function(b){ return b.c===catKey && !violation(kid,b); });
  var ordered = shuffled(pool.filter(function(b){ return b.s; }))
    .concat(shuffled(pool.filter(function(b){ return !b.s; })));
  var added = 0;
  ordered.slice(0, n).forEach(function(b){
    if(foodsOf(kid).some(function(f){ return normKey(f.n)===normKey(b.n); })) return;
    kid.foods.push(newFood(kid, b)); added++;
  });
  if(added) touch(kid);
  return added;
}
function seedLibrary(kid, breadth){
  var cfg = BREADTH[breadth] || BREADTH.some, added = 0;
  catsFor(kid).forEach(function(c){ added += seedCategory(kid, c.k, cfg.n[c.k], cfg.easyOnly); });
  touch(kid);
  return added;
}

/* ------------------------------------------------------ week generation */
function shuffled(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* ---------------------------------------------------------- eat history
   The retention mechanic. After a pack day the parent records, per compartment,
   whether it was eaten, partly eaten, or came home. Outcomes are stored against
   the FOOD, not the slot, so they survive re-plans. The draw then leans toward
   foods that get eaten and rests anything that came home twice running — for
   three weeks, after which it quietly returns. No model, no server: a weighted
   shuffle over a six-outcome recency window. */
var EAT_IDX = nullMap();                              /* kid.id -> foodId -> outcomes, newest first; reset on save */
function eatHistory(kid, foodId){
  var idx = EAT_IDX[kid.id];
  if(!idx){
    idx = EAT_IDX[kid.id] = nullMap();
    var eaten = kid.eaten || {};
    Object.keys(eaten).sort().reverse().forEach(function(d){
      var row = eaten[d]; if(!row || row.skipped) return;
      ALL_CATS.forEach(function(c){
        var e = row[c.k]; if(!e || !e.foodId) return;
        (idx[e.foodId] = idx[e.foodId] || []).push({d:d, r:e.r});
      });
    });
  }
  return idx[foodId] || [];
}
function eatStats(kid, foodId){
  var h = eatHistory(kid, foodId).slice(0, 6);
  if(!h.length) return {n:0, score:0.6, streakLeft:0, resting:false, last:null};
  var w = 0, sum = 0;
  h.forEach(function(e, i){ var wt = Math.pow(0.75, i); w += wt; sum += wt * (e.r==='ate' ? 1 : e.r==='some' ? 0.5 : 0); });
  var streak = 0;
  for(var i=0; i<h.length; i++){ if(h[i].r === 'left') streak++; else break; }
  var daysAgo = Math.round((today() - parseISO(h[0].d)) / 86400000);
  return {n:h.length, score:sum / w, streakLeft:streak, resting:(streak >= 2 && daysAgo < 21), last:h[0].r};
}
function eatLabel(kid, foodId){
  var st = eatStats(kid, foodId);
  if(!st.n) return '';
  if(st.resting){
    var back = addDays(parseISO(eatHistory(kid, foodId)[0].d), 21);
    return 'came home '+(st.streakLeft===2 ? 'twice' : st.streakLeft+' times')+' \u2014 taking a break until '+MON[back.getMonth()]+' '+back.getDate();
  }
  if(st.last === 'ate') return (st.n > 1 && st.score > 0.8) ? 'eats it' : 'ate it last time';
  if(st.last === 'some') return 'ate some last time';
  return 'came home last time';
}
function weightedShuffle(kid, arr){
  return arr.map(function(f){ var wt = 0.3 + eatStats(kid, f.id).score; return {f:f, k:Math.pow(Math.random(), 1/wt)}; })
    .sort(function(a,b){ return b.k - a.k; }).map(function(x){ return x.f; });
}
function findDay(kid, dStr){
  var all = (kid.past || []).concat(kid.week ? kid.week.days : []).concat(kid.next ? kid.next.days : []);
  return all.filter(function(d){ return d.d === dStr; })[0] || null;
}
function reviewComplete(kid, d){
  var row = (kid.eaten || {})[d.d];
  if(!row) return false;
  if(row.skipped) return true;
  return ALL_CATS.every(function(c){ return !foodById(kid, d.slots[c.k]) || !!row[c.k]; });
}
/* A day is worth asking about if something was ticked into the bag, or if the
   plan existed on that day. Onboarding on a Friday must not produce an
   interrogation about Thursday. */
function packedEvidence(kid, d){
  var row = (kid.packed || {})[d.d];
  if(row && Object.keys(row).some(function(k){ return ticked(row, k); })) return true;
  var live = kid.week && kid.week.days.some(function(x){ return x.d === d.d; });
  if(!live) return true;                               /* archived days came from an earlier week */
  var created = kid.week.createdAt ? String(kid.week.createdAt).slice(0,10) : null;
  return !created || created <= d.d;
}
/* The box comes home around three. From then on today's box can be asked
   about; before that, only a day already gone. A parent who taps Answer later
   is left alone until the next three o'clock, or the next open. */
var REVIEW_HOUR = 15;
function afterSchool(){ return new Date().getHours() >= REVIEW_HOUR; }
/* A day has gone once its box has been eaten: any day before today, and today
   from three o'clock. Nothing rewrites a day that has gone — not a re-draw, a
   swap, the kid's pick, the shopping list, nor a merge from the other phone. */
function dayGone(d){ var t = iso(today()); return d.d < t || (d.d === t && afterSchool()); }
function mergeHorizon(){ return iso(afterSchool() ? addDays(today(), 1) : today()); }
function laterHolds(kid, d){
  var e = UI.reviewLater[kid.id]; if(!e || e.d !== d.d) return false;
  if(iso(new Date(e.at)) !== iso(today())) return false;           /* a new day always asks again */
  var cut = today(); cut.setHours(REVIEW_HOUR, 0, 0, 0);
  return !(e.at < cut.getTime() && Date.now() >= cut.getTime());   /* crossed three o'clock since: ask again */
}
function reviewOwed(){
  return kids().some(function(k){ var rd = reviewDay(k); return !!(rd && !reviewComplete(k, rd)); });
}
function reviewDay(kid){
  var floor = iso(addDays(today(), -7));
  var cands = (kid.past || []).concat(kid.week ? kid.week.days : []).filter(function(d){
    return dayGone(d) && d.d >= floor && packedEvidence(kid, d) && ALL_CATS.some(function(c){ return foodById(kid, d.slots[c.k]); });
  });
  if(!cands.length) return null;
  cands.sort(function(a,b){ return b.d.localeCompare(a.d); });
  return cands[0];                                     /* only ever ask about the most recent */
}
/* was this day's review answered today? then its summary earns a line on screen */
function reviewedToday(kid, d){
  var row = (kid.eaten || {})[d.d]; if(!row) return false;
  var stamps = row.skipped ? [row.at] : ALL_CATS.map(function(c){ return row[c.k] && row[c.k].at; });
  return stamps.some(function(t){ return t && String(t).slice(0,10) === iso(today()); });
}
function reviewSummary(kid, dStr){
  var d = findDay(kid, dStr); if(!d) return '';
  var row = (kid.eaten || {})[dStr] || {}, l = dayLabel(dStr), summary;
  if(row.skipped) summary = 'skipped';
  else {
    var answered = 0, out = [];
    ALL_CATS.forEach(function(c){
      var e = row[c.k], f = e && foodById(kid, e.foodId); if(!e || !f) return;
      answered++;
      if(e.r === 'some') out.push('some of the '+f.n.toLowerCase());
      else if(e.r === 'left') out.push(f.n+' came home');
    });
    summary = !answered ? 'nothing recorded' : out.length ? out.join(', ') : 'all eaten';
  }
  return (kids().length > 1 ? kidLine(kid) : '')
    + '<div class="card spread" style="padding:12px 16px"><span class="hint" style="margin:0">'
    + esc(l.diff === -1 ? 'Yesterday' : l.full)+': '+esc(summary)+'</span>'
    + '<button class="btn ghost sm" data-act="eat-change" data-kid="'+esc(kid.id)+'" data-day="'+esc(dStr)+'">Change</button></div>';
}

function draw(kid, pool, n, exclude){
  var avail = pool.filter(function(f){ return exclude.indexOf(f.id)<0; });
  var awake = avail.filter(function(f){ return !eatStats(kid, f.id).resting; });
  if(awake.length >= n) avail = awake;                 /* rest the repeat offenders when we can afford to */
  var out = [], bag = weightedShuffle(kid, avail);
  while(out.length < n){
    if(!bag.length){ bag = weightedShuffle(kid, avail.length ? avail : pool); if(!bag.length) break; }
    out.push(bag.shift());
  }
  return out;
}
function permutations(arr){
  if(arr.length<=1) return [arr.slice()];
  var out = [];
  for(var i=0;i<arr.length;i++){
    var rest = arr.slice(0,i).concat(arr.slice(i+1));
    permutations(rest).forEach(function(p){ out.push([arr[i]].concat(p)); });
  }
  return out;
}
function bestAssignment(mains, items, cat){
  if(!items.length) return [];
  if(items.length<=6){
    var best = items, bestScore = -1e9;
    permutations(items).forEach(function(p){
      var sc = 0;
      for(var i=0;i<mains.length;i++) sc += pairScore(mains[i], p[i], cat).s;
      if(sc > bestScore){ bestScore = sc; best = p; }
    });
    return best;
  }
  var pool = items.slice(), res = [];
  mains.forEach(function(m){
    var bi = 0, bs = -1e9;
    pool.forEach(function(it,i){ var sc = pairScore(m,it,cat).s; if(sc>bs){ bs=sc; bi=i; } });
    res.push(pool.splice(bi,1)[0]);
  });
  return res;
}
function packDaysSorted(kid){

      if(k.week.days.filter(function(d){ return d.d >= next && untouched(k, d) && catsFor(k).some(function(c){ return d.slots[c.k]; }); }).length < 2) continue;
      var at = new Date(eve.getFullYear(), eve.getMonth(), eve.getDate(), +hm[0], +hm[1], 0);
      if(at.getTime() <= nowMs) continue;
      out.push({id:1800 + ki * 7 + i, at:at, name:kidLabel(k) || 'them'});
    }
  });

}
/* One a day, at three, on a day any box was planned and none of it answered:

function reviewReminders(){
  if(!(S.reviewReminder && S.reviewReminder.on === true)) return [];
  var out = [], t0 = today(), nowMs = Date.now();
  for(var i = 0; i < 7; i++){
    var day = new Date(t0.getTime() + i * 86400000), ds = iso(day);
    var owed = kids().filter(function(k){
      var d = k.week && k.week.days.filter(function(x){ return x.d === ds; })[0];
      return !!(d && ALL_CATS.some(function(c){ return foodById(k, d.slots[c.k]); }) && !reviewComplete(k, d));
    });
    if(!owed.length) continue;
    var at = new Date(day.getFullYear(), day.getMonth(), day.getDate(), REVIEW_HOUR, 0, 0);

function dishWords(d){ return d.slice(0, 2).join(' \u00b7 ')+(d.length > 2 ? ' +'+(d.length-2) : ''); }
function shoppingList(ahead){
  var rows = nullMap();
  kids().forEach(function(k){
    var w = ahead ? k.next : k.week;
    if(!w) return;
    var t0 = iso(today());
    w.days.forEach(function(d){
      if(dayGone(d)) return;                            /* already eaten, or packed; nothing left to buy for it */
      catsFor(k).forEach(function(c){
        var f = foodById(k, d.slots[c.k]); if(!f) return;
        var parts = (f.buy && f.buy.length)
          ? f.buy.map(function(nm){ return {name:nm, aisle:ING_AISLE[normKey(nm)] || f.a || 'other', dish:f.n}; })
          : [{name:f.n, aisle:f.a||'other', dish:null}];
        if(parts.length === 1 && parts[0].dish && normKey(parts[0].dish).indexOf(normKey(parts[0].name).replace(/s$/,'')) > -1) parts[0].dish = null;
        parts.forEach(function(pt){
          var key = normKey(pt.name);
          var r = rows[key] || (rows[key] = {key:key, name:pt.name, aisle:pt.aisle, qty:0, forKids:[], dishes:[]});
          r.qty++;
          if(r.forKids.indexOf(k.name)<0) r.forKids.push(k.name);
          if(pt.dish && r.dishes.indexOf(pt.dish)<0) r.dishes.push(pt.dish);   /* the dishes it is for; a dish that is just this one thing says nothing new */
        });
      });
    });
  });
  var order = {}; AISLES.forEach(function(a,i){ order[a]=i; });
  return Object.keys(rows).map(function(k){
    var r = rows[k]; r.have = !!(own(S.pantry, k) && S.pantry[k].have); return r;
  }).sort(function(a,b){
    return (order[a.aisle]-order[b.aisle]) || a.name.localeCompare(b.name);
  });
}
function weekIsStale(kid){
  if(!kid.week || !kid.week.days.length) return false;
  var last = kid.week.days.map(function(d){ return d.d; }).sort().pop();

}

/* Planning ahead: one more week, kept apart from the one on screen. It becomes

function nextStart(kid){ return addDays((kid.week && !weekIsStale(kid)) ? parseISO(kid.week.start) : anchorWeek(kid), 7); }
function weeksOf(kid){ return [kid.week, kid.next].filter(Boolean); }
function weekOf(kid, dStr){ return weeksOf(kid).filter(function(w){ return w.days.some(function(d){ return d.d === dStr; }); })[0] || null; }
function findWeekDay(kid, dStr){ var w = weekOf(kid, dStr); return w ? w.days.filter(function(d){ return d.d === dStr; })[0] : null; }
function rollover(kid){
  if(!kid.next) return false;
  if(kid.week && !weekIsStale(kid)) return false;
  if(kid.week) archiveWeek(kid);
  kid.week = kid.next; kid.next = null; touch(kid.week); touch(kid);
  return true;
}
