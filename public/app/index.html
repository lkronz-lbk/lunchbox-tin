  if(!st.done && st.mode === 'parts'){
    var cat = st.cats[st.step], opts = partOptions(kid, target, cat);
    h += '<div class="body"><div><p class="catlab">'+esc(KIDWORD[cat])+' · '+esc(l.rel || l.full)+'</p>'
      +  '<h1>'+(kidLabel(kid) ? esc(kidLabel(kid))+', pick your '+esc(KIDWORD[cat]) : 'Pick your '+esc(KIDWORD[cat]))+'.</h1>'
      +  '<p class="hint">Tap the one you want.</p></div>'
      +  '<div class="picks">'+opts.map(function(o){
           var f = foodById(kid, o.id);
           return '<button class="pick" data-act="kid-pick" data-d="'+esc(o.d)+'" data-id="'+esc(o.id)+'">'+picHTML(f)+'<span class="nm">'+esc(f ? f.n : '')+'</span></button>';
         }).join('')+'</div></div>';
  } else if(!st.done){
    h += '<div class="body"><div>'
      +  '<h1>'+(kidLabel(kid) ? esc(kidLabel(kid))+', pick' : 'Pick')+' '+esc(when)+' box.</h1>'
      +  '<p class="hint">Tap the one you want.</p></div>'
      +  '<div class="boxes'+(cats.length > 4 ? ' tall' : '')+'">'
      +  st.choices.map(function(dstr){
           var day = days.filter(function(d){ return d.d===dstr; })[0];
           return '<button class="pickbox" data-act="kid-pick" data-d="'+esc(dstr)+'" aria-label="'+esc(cats.map(function(c){ var f = foodById(kid, day.slots[c.k]); return f ? f.n : ''; }).filter(Boolean).join(', '))+'">'+miniTin(day)+'</button>';
         }).join('')
      +  '</div></div>';
  } else {
    h += '<div class="body kiddone"><div class="big">🎉</div>'
      +  '<h1>'+(kidLabel(kid) ? 'That’s the one, '+esc(kidLabel(kid))+'!' : 'That’s the one!')+'</h1>'
      +  '<div class="tin">'+cats.map(function(c){
           var f = foodById(kid, target.slots[c.k]);
           return '<div class="cmp c-'+c.k+(c.minor?' minor':'')+'"><span class="lab">'+KIDWORD[c.k]+'</span>'
             + picHTML(f)+'<span class="nm">'+(f?esc(f.n):'')+'</span></div>';
         }).join('')+'</div>'
      +  '<p class="hint" style="text-align:center">Now hand the phone back.</p>'
      +  '<button class="btn primary wide" data-act="kid-exit">Done</button></div>';
  }
  return h+'</div>';
}

/* ---------------------------------------------------------------- views */
/* "Let Emma pick", only on the box the pick would change: the next one with nothing in the bag */
function pickButton(kid, day){
  if(!kid.settings.kidPick) return '';
  var target = nextPickDay(kid);
  if(!target || target.d !== day.d || pickChoices(kid).length < 2) return '';
  var who = kidRef(kid) ? esc(kidRef(kid)) : 'them', picked = day.kidPick && Object.keys(day.kidPick).length;
  if(gated()) return '<button class="btn sm" data-act="upgrade" data-why="kidpick" style="margin-left:auto">'+svg('lock',13)+'Let '+who+' pick</button>';
  return '<span style="margin-left:auto;display:inline-flex;align-items:center;gap:8px">'+premiumTag()
    + '<button class="btn sm" data-act="kid-start" data-kid="'+esc(kid.id)+'">'+(picked ? 'Pick again' : 'Let '+who+' pick')+'</button></span>';
}
/* Several lunchboxes: a row of folder tabs, one tap each, the same on Pack,
   Week and Foods. On Pack each tab carries that box's state — a tick once it
   is packed, a ring while an answer is owed — so four kids is not four guesses. */
function kidPager(withState){
  var ks = kids();
  if(ks.length < 2) return '';
  return '<div class="boxtabs" role="tablist">'+ks.map(function(k){
    var st = withState ? kidState(k, typeof withState === 'string' ? withState : null) : '';
    return '<button role="tab" data-act="pick-kid" data-id="'+esc(k.id)+'" aria-current="'+(k.id===S.activeKidId)+'" aria-selected="'+(k.id===S.activeKidId)+'"'
      +  (st ? ' aria-label="'+esc(k.name)+' — '+(st==='packed' ? 'packed' : 'still to answer')+'"' : '')+'>'
      +  '<span class="dot" style="background:'+hueVar(k)+'"></span>'+esc(k.name)
      +  (st==='packed' ? '<span class="pin ok">'+svg('check',10)+'</span>'
         : st==='due' ? '<span class="pin due"></span>' : '')+'</button>'; }).join('')+'</div>';
}
/* What a pill has to say at 7am, in the order it matters: yesterday's box is
   still owed an answer, or today's is already in the bag. */
function kidState(k, dateStr){
  var rd = reviewDay(k);
  if(rd && !reviewComplete(k, rd)) return 'due';               /* Answer later hides the card, not the fact */
  var day = nextPackDay(k);
  if(!day || (dateStr && day.d !== dateStr)) return '';    /* a different school day: not this morning's tick */
  return boxPacked(k, day) ? 'packed' : '';
}
/* The next day this lunchbox packs, or the last one planned when the week has
   gone — Pack always has a box to show. */
function nextPackDay(kid){
  if(!kid.week || !kid.week.days.length) return null;
  var t = iso(today());
  /* a night-before household, once today's box is home, is packing tomorrow's */
  if(packsAtNight() && afterSchool()){
    var tomorrow = kid.week.days.filter(function(d){ return d.d > t; })[0];
    if(tomorrow) return tomorrow;
  }
  return kid.week.days.filter(function(d){ return d.d >= t; })[0] || kid.week.days[kid.week.days.length-1];
}
/* Every lunchbox's box for this date, packed or not: the one line that says
   whether you can leave the house. A different school day is not this
   morning's problem; a box with no plan still counts, and is named. */
function householdReady(dateStr){
  var out = {boxes:0, ready:0, left:[]};
  kids().forEach(function(k){
    if(!foodsOf(k).length) return;                 /* nothing to plan, nothing to pack: the banner says so */
    var slot = nextPackDay(k);
    if(slot && slot.d !== dateStr) return;
    out.boxes++;
    if(!slot){ out.left.push(k); return; }
    if(boxPacked(k, slot)) out.ready++; else out.left.push(k);
  });
  return out;
}
function viewPack(){
  var kid = activeKid(), ks = kids(), multi = ks.length>1;
  var news = UI.notice === WHATS_NEW.text;                        /* news waits behind the trial and the plan; an error does not */
  var top = '<div class="stack">' + (news ? trialBanner() + planBanner() + noticeBanner() : noticeBanner() + trialBanner() + planBanner()) + kidPager(true);
  if(!ks.some(function(k){ return foodsOf(k).length; }))
    return top + '<p class="view-sub">Pack list</p><h2 class="view-title">Nothing to pack yet</h2>'+noFoodsEmpty()+'</div>';

  var day = nextPackDay(kid);
  if(!day)
    return top + '<p class="view-sub">Pack list</p><h2 class="view-title">No plan yet</h2>'
      + '<div class="empty"><p>Draw a week and this page is the morning&#8217;s box.</p>'
      + '<button class="btn primary" data-act="plan-all">'+svg('dice',18)+'Plan the week</button></div></div>';

  var h = top;
  /* The review is the one thing that should stack: it exists once a day and then
     goes, and making a parent visit four boxes to answer four questions would be
     the whole cost of one box at a time. A helper is never asked. */
  var asked = 0, stack = '';
  if(!isHelper()){
    var rd = reviewDay(kid);
    if(rd && laterHolds(kid, rd) && !reviewComplete(kid, rd)){        /* Answer later: the question waits, in one line, with the way back */
      stack += '<div class="card spread" style="padding:12px 16px"><span class="hint" style="margin:0;color:var(--ink-2)">How did '
        + (kidLabel(kid) ? esc(kidLabel(kid))+'\u2019s' : 'the')+' box go? Not answered yet.</span>'
        + '<button class="btn ghost sm" data-act="review-now" data-kid="'+esc(kid.id)+'">Answer now</button></div>';
    } else if(rd){
      if(!reviewComplete(kid, rd) || UI.reviewEdit[kid.id] === rd.d){ stack += reviewCard(kid, rd); if(!reviewComplete(kid, rd)) asked++; }
      else if(reviewedToday(kid, rd)) stack += reviewSummary(kid, rd.d);
    }
  }
  /* the way past the question sits above it; the other boxes' rings on their tabs say who else is owed */
  if(asked) stack = '<div class="spread"><p class="view-sub" style="margin:0">'+(kidLabel(kid) ? esc(kidLabel(kid))+'\u2019s box' : 'The box')+' came home</p>'
    + '<button class="btn ghost sm" data-act="review-later-all">Answer later</button></div>' + stack;

  var box = '';
  var lab = dayLabel(day.d);
  box += '<div><p class="view-sub">'+(lab.rel ? esc(lab.rel) : lab.diff<0 ? 'Already packed' : 'Next school day')
    + ' · '+esc(lab.date)+(multi ? ' · '+esc(kid.name) : '')+'</p><h2 class="view-title">'
    + (lab.rel==='Today' ? 'Today&#8217;s box' : lab.rel==='Tomorrow' ? 'Tomorrow&#8217;s box' : esc(lab.full)+'&#8217;s box')
    + '</h2></div>';

  box += '<div class="kidgroup">'
    +  tinHTML(kid, day, 'pack')
    +  '<div class="spread" style="gap:8px;flex-wrap:wrap">' + chipsHTML(kid, day)
    +  '<span class="row" style="gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto">' + packButton(kid, day) + pickButton(kid, day) + '</span></div></div>';

  /* what in this box gets made rather than bought: the recipe waits where the box
     is being packed, because that is the evening a parent is standing in the kitchen */
  var making = catsFor(kid).map(function(c){ return foodById(kid, day.slots[c.k]); })
    .filter(function(f){
      /* only what is worth standing at the counter for: a parent about to walk out of
         the door does not need to be told there is a recipe for a ham sandwich */
      var mr = f && recipeFor(f);
      return !!mr && (!!(f.recipeId || libByName(f.n)) || mr.m >= 10);
    });
  if(making.length)
    box += '<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">'
      +  '<span class="hint muted" style="margin:0">Making it?</span>' + making.map(function(f){
           return '<button class="btn sm ghost" data-act="cook" data-kid="'+esc(kid.id)+'" data-id="'+esc(f.id)+'">'+svg('book',14)+esc(f.n)+'</button>';
         }).join('') + '</div>';

  /* with more than one lunchbox, the box on screen is not the whole morning */
  var hh = householdReady(day.d);
  if(hh.boxes > 1){
    var link = function(k){ return '<button class="linkbtn" data-act="pick-kid" data-id="'+esc(k.id)+'">'+esc(k.name)+'</button>'; };
    box += '<p class="hint" style="margin:0;color:var(--ink-2)">'+hh.ready+' of '+hh.boxes+' boxes ready'
      +  (hh.left.length ? ' — '+listNames(hh.left, link)+' still to pack.' : ' — everyone is packed.')+'</p>';
  }
  /* a night-before household came to pack tomorrow's box: it goes first, the questions after */
  h += (packsAtNight() && afterSchool()) ? box + stack : stack + box;

  var rest = kid.week.days.filter(function(x){ return x.d > day.d; });
  if(rest.length){
    h += '<div><div class="sect-head"><h3>Coming up</h3></div><div class="list">';
    rest.forEach(function(x){
      var l = dayLabel(x.d);
      var what = catsFor(kid).map(function(c){ var f = foodById(kid, x.slots[c.k]); return f?f.n:null; }).filter(Boolean).join(' · ');
      var pick = pickButton(kid, x);
      var pickedBy = (x.kidPick && Object.keys(x.kidPick).length) ? (kidLabel(kid) ? kidLabel(kid)+' picked' : 'Picked') : '';
      /* the day the kid's pick would change carries the button, so the pick lands where it is seen */
      h += '<'+(pick ? 'div' : 'button')+' class="item"'+(pick ? '' : ' data-act="go-week"')+'><span class="grow"><span class="nm">'+esc(l.full)+(pick ? ' <span class="qty" style="font-size:12px">'+esc(l.date)+'</span>' : '')+(pickedBy ? ' <span class="chip picked">'+esc(pickedBy)+'</span>' : '')+'</span>'
        +  '<span class="meta">'+esc(what || 'nothing picked')+'</span></span>'
        +  (pick ? '<span class="row" style="gap:8px;flex-wrap:wrap;justify-content:flex-end">'+pick+'</span>' : '<span class="qty">'+esc(l.date)+'</span>')
        +  '</'+(pick ? 'div' : 'button')+'>';
    });
    h += '</div></div>';
  }
  return h+'</div>';
}

function viewWeek(){

}

        +  '</span><span class="qty">'+(r.qty>1 ? '&times;'+r.qty : '')+'</span></button>';

    var nws = nextStart(kids().filter(function(k){ return k.next; })[0]);
    h += '<div style="margin-top:24px"><p class="view-sub">Next week \u00b7 '+later.filter(function(r){ return !r.have; }).length+' to buy</p>'

      if(!lg[a]) return;
      h += '<div><div class="sect-head"><h3>'+AISLE_SHORT[a]+'</h3><span class="count">'+lg[a].length+'</span></div><div class="list">';
      lg[a].forEach(function(r){
        h += '<button class="item'+(r.have?' done':'')+'" data-act="have" data-key="'+esc(r.key)+'">'
          +  '<span class="box">'+svg('check',12)+'</span><span class="grow"><span class="nm">'+esc(r.name)+'</span>'
          +  (multi || r.dishes.length ? '<span class="meta">'+esc((multi ? 'for '+r.forKids.join(', ')+(r.dishes.length ? ' · ' : '') : '')+dishWords(r.dishes))+'</span>' : '')
          +  '</span><span class="qty">'+(r.qty>1 ? '&times;'+r.qty : '')+'</span></button>';
      });

function viewFoods(){

        +  '<button class="grow" data-act="food-open" data-kid="'+esc(kid.id)+'" data-id="'+esc(f.id)+'">'

                 + esc(eatLabel(kid, f.id) || (f.buy && f.buy.length > 1 ? f.buy.join(' \u00b7 ') : AISLE_LABEL[f.a] || 'Your own'))+'</span>')

    });

  EXTRA_CATS.forEach(function(c){

      + '<p class="hint muted" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0"><span>Every food here stays. Writing one in your own words is the Household plan; the idea bank, and every recipe in it, is free.</span>'+premiumTag()+'</p>'
    : isHelper() ? ''
    : '<button class="btn wide" data-act="add-own">'+svg('plus',17)+'Add your own</button>'
      + (premiumTag() ? '<p class="hint" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0"><span>A food in your own words.</span>'+premiumTag()+'</p>' : '');
  return h + '</div>';
}

/* ======================================================== the Recipes tab
   Recipes belong to the household, not to a lunchbox: the same blondies are the
   same blondies whichever kid is eating them. So this is one list for everybody,
   with no lunchbox tabs across the top — the parent's own first, the idea bank's
   behind them, and a box to search when seventy of them is too many to scroll. */
function recipeRow(e){
  var r = e.r, name = recipeName(e), on = recipeOn(e), head = cookHead(r);
  var meta = head || '';
  if(on.length) meta += (meta ? ' · ' : '') + (kids().length > 1 ? 'on ' + listNames(on) : 'on the food list');
  return '<button class="item" data-act="cook-recipe" data-id="'+esc(e.own ? r.id : '')+'" data-name="'+esc(name)+'">'
    + '<span class="grow"><span class="nm">'+esc(name)+(e.own ? '' : ' <span class="chip">Idea bank</span>')+'</span>'
    + '<span class="meta">'+esc(meta || 'Tap to cook it')+'</span></span>'

function viewRecipes(){

    h += '<div class="field" style="margin:0"><label for="rqFind" class="sr-only">Find a recipe</label>'
      +  '<input type="search" id="rqFind" data-find="recipe" placeholder="Find a recipe, or an ingredient" '
      +  'autocomplete="off" autocapitalize="off" maxlength="60" value="'+esc(UI.recipeFind || '')+'"></div>';
  if(!hit.length)
    h += '<div class="empty"><p>Nothing matches &#8220;'+esc(UI.recipeFind || '')+'&#8221;.</p>'
      +  '<button class="btn ghost" data-act="recipe-clear-find">Show them all</button></div>';
  if(mine.length){
    h += '<div><div class="sect-head"><h3>Yours</h3><span class="count">'+mine.length+'</span></div><div class="list">'
      +  mine.map(recipeRow).join('')+'</div></div>';
  } else if(!find && !isHelper()){
    h += '<div class="empty"><p>Nothing of your own yet. Paste in a recipe, or give the app the address of one, '
      +  'and it is yours to cook from on any phone in the household.</p></div>';

  if(bank.length)
    h += '<div><div class="sect-head"><h3>From the idea bank</h3><span class="count">'+bank.length+'</span></div><div class="list">'

      +  (find ? '' : '<p class="hint muted" style="margin:8px 0 0">Free, for good, whether the food is on a list or not.</p>')+'</div>';
  return h + '</div>';
}

function viewBox(){

     pane; what holds for every box sits above the tabs, what is one box's own

    all += '<div class="switch"><div><div class="t">Match the boxes</div>'

      +  '<button class="sw" data-act="align" aria-pressed="'+!(S.align && S.align.on === false)+'" aria-label="Match the boxes"></button></div>';

      +  '<button data-act="pack-when" data-v="evening" aria-pressed="'+packsAtNight()+'">Night before</button></div></div>'
      +  '<div class="switch"><div><div class="t">Another lunchbox</div>'
      +  '<div class="d">Its own rules, its own foods, its own tab.</div></div>'
      +  '<div class="row" style="gap:8px;align-items:center;flex:none">'+premiumTag()
      +  '<button class="btn sm" data-act="add-kid">'+svg('plus',15)+'Add</button></div></div>'
      +  '</div>'
      +  '<p class="hint" style="margin:8px 0 0">Pack the night before and Pack shows tomorrow&#8217;s box from three o&#8217;clock.</p>'

  }

  h += kidPager()
    +  '<div><p class="view-sub">This lunchbox</p><h2 class="view-title">'+esc(kid.name)+'</h2></div>';

  /* this lunchbox */
  h += '<div class="card stack" style="gap:14px">'
    +  '<div class="field"><label for="kidName">Name on this lunchbox</label>'
    +  '<input type="text" id="kidName" value="'+esc(kid.name)+'" placeholder="Whose lunch" maxlength="40"></div>'
    +  '<div class="field"><label>Pack days</label><div class="dow">'
    +  [1,2,3,4,5,6,0].map(function(d){
         return '<button class="tg" data-act="day" data-d="'+d+'" aria-pressed="'+(s.days.indexOf(d)>-1)+'" aria-label="'+DOWFULL[d]+'">'+DOW[d][0]+'</button>';
       }).join('')+'</div></div></div>';

  var sw = function(act, k, t, on, d){
    return '<div class="switch"><div><div class="t">'+t+'</div>'+(d ? '<div class="d">'+d+'</div>' : '')+'</div>'
      + '<button class="sw" data-act="'+act+'"'+(k ? ' data-k="'+k+'"' : '')+' aria-pressed="'+(!!on)+'" aria-label="'+esc(t)+'"></button></div>';
  };
  var slotsOn = s.slots || {};
  h += '<div><div class="sect-head"><h3>In '+kidPoss(kid)+' box</h3></div><div class="card">'
    +  sw('compartment', 'snack', 'A snack, too', slotsOn.snack)
    +  sw('compartment', 'drink', 'A drink', slotsOn.drink)

  h += '<div><div class="sect-head"><h3>School rules</h3></div><div class="card">'
    +  sw('noheat', '', 'Cold lunches only', s.noHeat)
    +  sw('rule', 'noIce', 'No ice pack', s.noIce)
    +  sw('rule', 'shortWindow', 'Short eating time', s.shortWindow)
    +  sw('rule', 'noChoc', 'No chocolate or candy', s.noChoc)
    +  '</div></div>';

  h += '<div><div class="sect-head"><h3>Keep out of '+kidPoss(kid)+' box</h3></div><div class="card">'
    +  '<div class="toggles">'

         return '<button class="tg" data-act="allergen" data-k="'+a.k+'" aria-pressed="'

    +  '<textarea id="avoidText" placeholder="salami, kiwi, sesame" maxlength="500">'+esc(s.avoidText)+'</textarea></div></div></div>';

  /* the kid's say */
  h += '<div><div class="sect-head"><h3>'+(kidLabel(kid) ? esc(kidLabel(kid))+'&#8217;s say' : 'Their say')+'</h3>'+(premiumTag() ? '<span>'+premiumTag()+'</span>' : '')+'</div><div class="card">'
    +  sw('kidpick-on', '', 'They pick their box each day', s.kidPick, 'From the week already planned and shopped for.')
    +  (s.kidPick ? '<div class="switch"><div><div class="t">How they pick</div></div>'
         + '<div class="seg two"><button data-act="kidpick-mode" data-v="parts" aria-pressed="'+(s.kidPickMode !== 'boxes')+'">Each part</button>'
         + '<button data-act="kidpick-mode" data-v="boxes" aria-pressed="'+(s.kidPickMode === 'boxes')+'">Whole box</button></div></div>' : '')
    +  (s.kidPick && native() ? sw('kid-reminder', '', 'Remind us the night before', s.kidReminder !== false)
         + (s.kidReminder !== false ? '<div class="switch"><div><div class="t">At</div></div><input type="time" id="kidReminderAt" value="'+esc(s.kidReminderAt || '18:00')+'" style="width:auto;min-height:44px"></div>' : '') : '')
    +  '</div></div>';

  /* removing is destructive, so it sits at the end of the box it removes */
  if(many && !isHelper()) h += '<div class="card"><div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">'
    +  '<button class="btn danger sm" data-act="del-kid" data-id="'+esc(kid.id)+'">'
    +  (UI.armed==='kid:'+kid.id?'Tap again to remove '+esc(kid.name):'Remove '+esc(kid.name))+'</button>'
    +  (UI.armed==='kid:'+kid.id ? '<button class="btn ghost sm" data-act="disarm">Keep it</button>' : '')
    +  '</div></div>';
  return h+'</div>';
}

/* The Account tab is five doors, not one long column. Each opens a pane over
   the tab; the bottom bar stays put, and Done comes back to the row it left.
   Signed out, the sign-in card stays on this surface: it is the only thing
   that tab is for, and a join link lands here expecting it. */
function viewSetup(){
  var h = '<div class="stack"><div><p class="view-sub">Account</p><h2 class="view-title">'+(signedIn() ? 'Your household' : 'This phone')+'</h2>'
    +  (syncLine() ? '<p class="hint" style="margin:6px 0 0" id="syncLine">'+esc(syncLine())+'</p>' : '')+'</div>';   /* only one of these renders at a time: the tab, or the Account page */
  if(Account.join) h += '<div class="card stack" style="gap:12px">'+joinBlock()+'</div>';
  if(!signedIn()) h += signInCard();
  var row = function(pane, act, label, caption){
    return '<button class="item" data-act="'+act+'"'+(pane ? ' data-pane="'+pane+'"' : '')+'>'
      +  '<span class="grow"><span class="nm">'+label+'</span>'
      +  (caption ? '<span class="meta">'+esc(caption)+'</span>' : '')+'</span>'
      +  '<span class="go">'+svg('chev',16)+'</span></button>';
  };
  var people = Account.members.length, many = kids().length, kid = activeKid();
  h += '<div class="list">'
    +  row('account', 'pane', signedIn() ? 'Account' : 'This phone', signedIn() ? Account.user.email : 'Backup, or erase everything')
    +  row('household', 'pane', 'Household', !signedIn() ? 'Just this phone' : people > 1 ? people+' people' : 'Just you')
    +  (billingOn() && !isHelper() ? row('plan', 'pane', 'Subscription', planLabel()) : '')
    +  (isHelper() ? '' : row('box', 'pane', many > 1 ? 'Lunchboxes' : 'Lunchbox', many > 1 ? many+' lunchboxes' : (kid ? kid.name : '')))
    +  row('', 'help', 'Contact support', 'Answers, and how to reach us')
    +  '</div>';
  return h+'</div>';
}
var PANE_TITLE = {account:'Your account', household:'Household', plan:'Subscription'};
function viewPane(){
  return '<div class="stack">'
    + paneHead('Account', UI.pane === 'account' && !signedIn() ? 'This phone' : (PANE_TITLE[UI.pane] || PANES[UI.pane]))
    + (UI.pane === 'household' ? paneHousehold() : UI.pane === 'plan' ? panePlan() : paneAccount())+'</div>';
}

/* Account: who this phone is signed in as, and everything that ends a thing —
   sign out, leave, erase, delete. The data it holds sits with them. */
function paneAccount(){
  var h = '';
  if(signedIn()){
    h += '<div class="card stack" style="gap:12px">'
      +  '<div class="kv"><span>Signed in as</span><span style="overflow-wrap:anywhere;white-space:normal;text-align:right">'+esc(Account.user.email)+'</span></div>'
      +  '<p class="hint" style="margin:0" id="syncLine">'+esc(syncLine())+'</p>'
      +  '<div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-act="signout">Sign out</button>'
      +  (Account.me && Account.me.role !== 'owner' ? '<button class="btn danger sm" data-act="leave">Leave this household</button>' : '')+'</div>'
      +  '</div>';
  }
  h += '<div><div class="sect-head"><h3>'+(signedIn() ? 'Backup' : 'Move to another phone')+'</h3></div><div class="card stack" style="gap:12px">'
    +  '<div class="row" style="gap:8px;flex-wrap:wrap">'
    +  '<button class="btn sm" data-act="copy-data">Copy your lunches</button>'
    +  (Downloads ? '<button class="btn sm" data-act="save-file">'+svg('save',15)+'Save a backup file</button>' : '')
    +  '<button class="btn ghost sm" data-act="import-open">Paste from another phone</button></div>'
    +  '<div class="kv"><span>Lunchboxes</span><span>'+kids().length+'</span></div>'
    +  '<div class="kv"><span>Foods saved</span><span>'+kids().reduce(function(a,k){ return a+foodsOf(k).length; },0)+'</span></div>'
    +  '<div class="kv"><span>People</span><span>'+members().length+'</span></div>'
    +  '<div class="kv"><span>Last change</span><span>'+esc(whenLabel(S.updatedAt))+'</span></div>'
    +  '</div></div>';
  h += '<div class="card stack" style="gap:10px"><h3>'+(signedIn() ? 'Stored here and in your household' : 'Stored on this '+(native() ? 'phone' : 'browser')+' only')+'</h3>'
    +  (native() || signedIn() ? '' : '<p class="hint" style="margin:0">Share &rarr; <b>Add to Home Screen</b> opens it like an app.</p>')
    +  (Store.ok ? '' : '<p class="hint" style="margin:0"><b>Storage is blocked '+(native() ? 'on this phone' : 'in this browser')+', so changes will not survive a reload.</b></p>')
    +  '<div class="row" style="flex-wrap:wrap;gap:8px;margin-top:4px">'
    +  '<button class="btn ghost sm" data-act="clear-week">'+(UI.armed==='week'?'Tap again to clear':'Clear the plans')+'</button>'
    /* Signed out the lunches are only here, so erasing them is a phone-local act and says
       so. Signed in there is no such thing: this document is the household's, and wiping
       it reached the other parent's phone while the button talked about this one. The
       honest version of that is deleting the account, below, and there is only one of it. */
    +  (signedIn() || Store.hadAccount() ? '' : '<button class="btn danger sm" data-act="clear-all">'+(UI.armed==='all'?'Tap again to erase':'Erase everything')+'</button>'
         + (UI.armed==='all' ? '<button class="btn ghost sm" data-act="disarm">Keep it</button>' : ''))
    +  '</div>'
    +  (signedIn() || Store.hadAccount() ? '<p class="hint" style="margin:0">The lunches belong to the household, so there is nothing to erase from this phone alone. Sign out to leave them behind, or end the account below.</p>' : '')
    +  '</div>';
  if(signedIn() && Account.me){
    /* Everyone who has an account can end it. The server deletes only a household the
       person owns, so for anyone else this ends their own sign-in and leaves the lunches
       with the household — which is also the only way they can close the account we
       opened for them. */
    var owner = Account.me.role === 'owner';
    var others = Account.members.filter(function(m){ return m.userId !== Account.me.userId; }).map(memberLabel);
    h += '<div class="card stack" style="gap:10px;scroll-margin-bottom:320px"><h3>Delete your account and data</h3>'
      +  '<p class="hint muted" style="margin:0">This is not undoable, and there is no copy afterwards. It removes:</p>'
      +  '<ul class="hint muted" style="margin:0;padding-left:18px">'
      +  '<li>Your sign-in, and this email address</li>'
      +  (owner
          ? '<li>Every lunchbox, food, plan, photo and answer, from our servers and from this phone</li>'
            + (others.length ? '<li>'+esc(andList(others))+'’s sign-in to this household — whatever is already on their phone stays on it</li>' : '')
            + (paid() ? '<li>'+(Account.entitlement.plan === 'lifetime' ? 'The forever purchase, which does not come back' : 'The yearly plan, which stops at once')+'</li>' : '')
          : '<li>Your place in this household, and the lunches from this phone</li>')
      +  '</ul>'
      +  (owner ? '' : '<p class="hint" style="margin:0">The household and its lunches stay'+(others.length ? ' with '+esc(andList(others)) : '')+'. To keep your place and only clear this phone, sign out instead.</p>')
      +  '<p class="hint" style="margin:0">Want to keep a copy? Copy your lunches'+(Downloads ? ', or save a backup file' : '')+', above first.</p>'
      +  '<div class="field"><label for="deleteConfirm">Type DELETE to confirm</label>'
      +  '<input type="text" id="deleteConfirm" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="10" aria-describedby="deleteHint" value="'+esc(UI.deleteTyped || '')+'" style="font-family:var(--f-mono);letter-spacing:.08em"></div>'
      +  '<div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn danger sm" data-act="delete-account"'+(deleteArmed() ? '' : ' disabled aria-disabled="true"')+'>Delete my account and data</button>'
      +  (deleteArmed() ? '' : '<span class="hint" id="deleteHint" style="align-self:center">Type DELETE above to switch this on.</span>')+'</div></div>';
  }
  return h;
}

/* Household: the people, and the name this phone packs under. A caretaker
   comes here too — they set their own name and see who else is in it. */
function paneHousehold(){
  var me = deviceMember();
  var h = '<div class="card stack" style="gap:12px">'
    +  (Account.join ? joinBlock() : '')
    +  '<div class="field"><label for="memberName">Your name</label>'
    +  '<input type="text" id="memberName" value="'+esc(me?me.name:'')+'" placeholder="Who packed" maxlength="60"></div>'
    +  '<p class="hint" style="margin:0">It goes beside the box you packed, so the other phone can see who did.</p></div>';
  if(!signedIn()){
    return h + '<div class="card stack" style="gap:10px"><h3>Nobody else yet</h3>'
      +  '<p class="hint" style="margin:0">Sign in and you can invite the other parent, or a caretaker who sees the week and checks the box off.</p>'
      +  '<button class="btn sm" data-act="pane" data-pane="account">Sign in</button></div>';
  }
  if(Account.members.length){
    h += '<div><div class="sect-head"><h3>In this household</h3><span class="count">'+Account.members.length+'</span></div><div class="list">' + Account.members.map(function(m){
      var mine = Account.me && m.userId === Account.me.userId, armed = UI.armed === 'rm:'+m.userId;
      return '<div class="item"><span class="grow"><span class="nm">'+esc(memberLabel(m))+(mine ? ' (you)' : '')+'</span>'
        + '<span class="meta" style="overflow-wrap:anywhere;white-space:normal">'+esc(m.role === 'owner' ? 'Owner' : m.role === 'helper' ? 'Caretaker — sees the week and checks the box off' : 'Parent')+(m.email && !isHelper() ? ' · '+esc(m.email) : '')+'</span></span>'
        + (Account.me && Account.me.role === 'owner' && !mine
            ? (armed ? '<button class="btn danger sm" data-act="member-remove" data-id="'+esc(String(m.userId))+'">Tap again to remove</button>'
                     : '<button class="x" data-act="member-remove" data-id="'+esc(String(m.userId))+'" aria-label="Remove '+esc(memberLabel(m))+'">'+svg('trash',17)+'</button>')
            : '')
        + '</div>'; }).join('') + '</div></div>';
  }
  if(!isHelper()){
    h += '<div class="card stack" style="gap:10px"><h3>Ask someone in</h3>'
      +  '<p class="hint" style="margin:0">The other parent sees and changes everything you do. A caretaker sees the week and checks the box off, and nothing else.</p>'
      +  '<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center"><button class="btn sm" data-act="invite">Invite the other parent</button>'
      +  '<button class="btn ghost sm" data-act="invite-helper">Invite a caretaker</button>'+premiumTag()+'</div>';
    if(Account.invite) h += '<div class="field"><label for="inviteUrl">Invite link</label>'
      + '<textarea id="inviteUrl" class="codebox" readonly style="min-height:60px">'+esc(Account.invite)+'</textarea>'
      + '<span class="hint">It works once, for a week'+(Account.inviteRole === 'helper' ? ', and gives them the week and the pack list only' : '')+'.</span>'
      + '<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:6px">'+(navigator.share ? '<button class="btn primary sm" data-act="invite-share">Send the link</button>' : '')
      + '<button class="btn sm" data-act="invite-copy">Copy the link</button></div></div>';
    h += '</div>';
  }
  return h;
}

/* Subscription: what you are on, what it costs, when it renews, and how to
   stop it — in that order, because that is the order a parent asks. */
function panePlan(){
  var e = Account.entitlement || {};
  var lapsing = paid() && e.status === 'past_due', d = planDate();
  /* the moment after paying: the webhook has not landed, so every row below would
     still say Free. One line is the honest thing to show. */
  if(Account.settling){
    return '<div class="card stack" style="gap:10px"><h3>Thank you</h3>'
      +  '<p class="hint" style="margin:0">Payment received. Switching the Household plan on now — it takes a few seconds.</p></div>';
  }
  var h = '<div class="card stack" style="gap:12px">'
    +  '<div class="kv"><span>Your plan</span><span>'+esc(lapsing ? 'Household — payment failed' : paid() ? (e.plan === 'lifetime' ? 'Household, forever' : 'Household') : trialing() ? 'Household, free trial' : 'Free')+'</span></div>';
  var cost = planCost();
  if(cost) h += '<div class="kv"><span>Cost</span><span>'+esc(cost)+'</span></div>';
  h += '<div class="kv"><span>'
    +  (paid() && e.plan === 'lifetime' ? 'Bought' : paid() && e.cancelAtPeriodEnd ? 'Ends' : paid() ? 'Renews' : trialing() ? 'Free until' : 'Plan')
    +  '</span><span>'
    +  esc(paid() ? (e.plan === 'lifetime' ? 'Paid once, never renews' : d || 'Yearly')
        : trialing() ? (trialEnd() ? fmtDay(trialEnd()) : planLabel()) : 'Not on')
    +  '</span></div>';
  if(lapsing) h += '<p class="hint" style="margin:0;color:var(--warn)">The last payment did not go through. Update the card in Manage billing'+(d ? ', or the Household plan ends on '+esc(d) : '')+'.</p>';
  h += '<div class="row" style="gap:8px;flex-wrap:wrap">'
    +  (paid() ? (e.plan !== 'lifetime' ? '<button class="btn sm" data-act="upgrade" data-why="forever">Switch to forever</button>' : '') : trialing() ? '<button class="btn primary sm" data-act="upgrade" data-why="keep">Keep the Household plan</button>' : '<button class="btn primary sm" data-act="upgrade" data-why="keep">Get the Household plan</button>')
    +  (e.portal ? '<button class="btn '+(lapsing ? 'primary' : 'ghost')+' sm" data-act="portal">Manage billing</button>' : '')+'</div></div>';
  /* what free looks like, said once, in the two places a parent is about to meet it */
  var freeAgain = 'one lunchbox, the week, the shopping list, the pack list and the idea bank stay free. What you have added stays.';
  if(trialing()){
    h += '<div class="card stack" style="gap:10px"><h3>When the three weeks end</h3>'
      +  '<p class="hint" style="margin:0">No card, and nothing to cancel. From '+esc(trialEnd() ? fmtDay(trialEnd()) : 'then')+', '+freeAgain+'</p></div>';
  } else if(paid() && e.plan !== 'lifetime' && signedIn()){
    h += '<div class="card stack" style="gap:10px"><h3>Stopping it</h3>'

  targets.forEach(function(k){
    /* already on the list first: a food a rule now flags is still on the list,
       and saying the rules keep it out of a box that holds it is a lie */
    if(foodsOf(k).some(function(f){ return normKey(f.n) === normKey(o.n); })){ r.already.push(k); return; }

       box refusing, gets it on the list flagged, where the Foods tab marks it */
    if(violation(k, o) && takers.length){ r.skipped.push(k); return; }

/* ======================================================= importing a recipe
   Two ways in, because the recipes a parent actually saves live in two places.
   A recipe page publishes its recipe in the markup for search engines, so the
   address of one is enough: /api/recipe reads it and hands back the parts. A
   video does not — there is nothing to read under a reel but the words its maker
   typed, so the second way is to paste those words in, and the same parser runs
   on the phone with no network at all. Either way what comes back is shown to
   the parent to correct before it becomes a food: the compartment, the aisle and
   above all what it contains, because the school rules are built on that and a
   guess is not good enough to hide. */
/* "1." and "2)" in front of a line are a recipe numbering its steps, not an amount:
   they come off before the line is read, and the fact that they were there is what
   says the line is a step. A leading bullet comes off the same way. */
var NUMBERED = /^(?:step\s*)?\d{1,2}\s*[.)]\s+/i;
function stripNum(l){ return l.replace(NUMBERED, '').replace(/^[-*\u2022\u00b7]\s*/, '').trim(); }
/* what a parent pasted from under a video is a caption, not a title: the emoji,
   the aside after the dash and the shouting all come off, and what is left is
   still theirs to edit before it becomes the name of a food */
function tidyTitle(t){
  t = String(t || '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{2190}-\u{21FF}]/gu, ' ').replace(/\s+/g, ' ').trim();
  t = t.split(/\s+[\u2014\u2013-]\s+|[!?]+\s+|\s*\|\s*/)[0].trim().replace(/[!.,:;]+$/, '').trim();
  if(t.length > 3 && t === t.toUpperCase() && /[A-Z]{4}/.test(t)) t = t.charAt(0) + t.slice(1).toLowerCase();
  return t.slice(0, 80);
}
/* a line that reads like something you buy rather than something you do */
function looksIngredient(l){
  if(l.length > 90) return false;
  if(/^[\d\u00bc-\u00be\u2150-\u215e]/.test(l)) return true;
  return /^(?:a|an|one|two|three|four|half|some|salt|pepper|pinch)\b/i.test(l) && l.length < 45;
}
/* the tail of a caption: tags, handles and links, which are neither */
function isNoise(l){ return !/[a-z]/i.test(l) || /^(?:#|@|https?:\/\/)/i.test(l) || /^#\S+(?:\s+#\S+)*$/.test(l); }
var HEAD_ING = /^(?:ingredients?|you(?:\u2019|')?ll need|what you need|shopping list)$/i;
var HEAD_STEP = /^(?:instructions?|directions?|method|steps?|preparation|to make it|how to make it)$/i;
var HEAD_SKIP = /^(?:notes?|nutrition|equipment|storage|tips?|substitutions?)$/i;
function parsePasted(raw){
  var lines = String(raw || '').replace(/\r/g, '').split('\n').map(function(l){ return l.replace(/\s+/g, ' ').trim(); });
  var title = '', ing = [], steps = [], mode = '', mins = 0, yld = 0;
  lines.forEach(function(l){
    if(!l) return;
    var bare = l.replace(/[:\s]+$/, '');
    if(HEAD_ING.test(bare)){ mode = 'i'; return; }
    if(HEAD_STEP.test(bare)){ mode = 's'; return; }
    if(HEAD_SKIP.test(bare)){ mode = 'x'; return; }
    if(mode === 'x') return;
    /* A numbered line is a step the recipe numbered, so it is never read as a time or
       a yield: "2. Stir it together and bake 28 minutes" is something to do, not a
       statement that the recipe takes 28 minutes. For the rest, the time or yield word
       has to be at the front of the line — a label — rather than anywhere in a sentence. */
    var numbered = NUMBERED.test(l);
    if(!numbered){
      var y = l.match(/\b(?:serves|servings?|makes|yields?)\b[^0-9]{0,12}(\d{1,2})/i);
      if(y && !yld && y.index < 20){ yld = +y[1]; if(/^(?:serves|servings?|makes|yields?)\b/i.test(l)) return; }
      var t = l.match(/\b(?:total|cook|bake|prep|ready in|active|time)\b[^0-9]{0,16}(\d{1,3})\s*(m|min|mins|minutes?|h|hr|hrs|hours?)\b/i);
      if(t && t.index < 20 && l.length < 60){ mins += /^h/i.test(t[2]) ? +t[1] * 60 : +t[1]; return; }
    }
    /* the numbering comes off first, so a numbered step is read as a step and not,
       because it opens with a digit, as an amount */
    var body = stripNum(l);
    if(!body || isNoise(body)) return;
    if(!title && mode === '' && !looksIngredient(body) && body.length < 90){ title = body; return; }
    if(mode === 's'){ steps.push(body); return; }
    if(mode === 'i' || looksIngredient(body)){ ing.push(body); return; }
    steps.push(body);                       /* anything left is something you do */
  });
  return {title:tidyTitle(title), m:(mins > 0 && mins <= 1440) ? mins : 0, y:(yld > 0 && yld < 100) ? yld : 0,
    ing:ing.slice(0, ING_MAX), steps:steps.slice(0, STEP_MAX), src:'', url:null};
}

/* ---- what the app can work out about an imported dish, for a parent to correct */
var AL_HINT = [
  ['nuts',  /peanut|almond|cashew|walnut|pecan|pistachio|hazelnut|macadamia|\bnuts?\b/],
  ['seeds', /sesame|tahini|sunflower seed|pumpkin seed|poppy seed|hummus/],
  ['dairy', /\bmilk\b|cheese|\bbutter\b|yogurt|yoghurt|\bcream\b|ricotta|mozzarella|parmesan|\bfeta\b|\bghee\b/],
  ['gluten',/\bflour\b|bread|pasta|tortilla|cracker|noodle|wheat|panko|breadcrumb|bagel|\bpita\b|couscous|barley|\bbun\b|\broll\b/],
  ['egg',   /\beggs?\b|mayonnaise|\bmayo\b|meringue/],
  ['soy',   /\bsoy\b|\btofu\b|edamame|tamari|\bmiso\b/],
  ['fish',  /\btuna\b|salmon|anchov|fish sauce|shrimp|\bcod\b|sardine|worcestershire/]

  var dairySafe = raw.replace(/\b(?:peanut|sunflower|almond|cashew|nut|seed|cocoa|apple|shea)\s+butter\b/g, ' spread ');
  return AL_HINT.filter(function(a){ return a[1].test(a[0] === 'dairy' ? dairySafe : raw); }).map(function(a){ return a[0]; });
}
var TRIM_FRONT = /^(?:of|fresh|freshly|finely|thinly|roughly|coarsely|chopped|diced|grated|shredded|sliced|minced|ground|crushed|large|small|medium|ripe|cold|warm|hot|melted|softened|packed|heaping|plain|whole|raw|cooked|good|extra|optional|slices?|cloves?|cans?|tins?|jars?|packs?|packets?|sticks?|strips?|pieces?|handfuls?|bunch(?:es)?|sprigs?)\s+/i;
var TRIM_BACK = /[,\s]+(?:chopped|diced|grated|shredded|sliced|minced|melted|softened|divided|drained|rinsed|halved|quartered|cubed|to taste|for serving|for garnish|optional|if needed|plus more)\s*$/i;
/* the shopping line for an imported dish: the things, not the amounts */
function buyFrom(ing){
  var seen = nullMap(), out = [];
  ing.forEach(function(line){
    var n = parseIng(line).n.replace(/\([^)]*\)/g, ' ').split(/,| or /)[0];
    var was = '';
    while(n !== was){ was = n; n = n.replace(TRIM_FRONT, '').replace(TRIM_BACK, '').trim(); }
    if(!n || n.length < 2 || n.length > 40 || /^(?:to taste|water|salt|pepper|salt and pepper)$/i.test(n)) return;
    var k = normKey(n); if(seen[k]) return; seen[k] = 1;

  var count = nullMap(), best = '', n = 0;
  buy.forEach(function(b){
    var a = ING_AISLE[normKey(b)]; if(!a) return;

var SWEET_RE = /cookie|muffin|brownie|blondie|cupcake|cake\b|bread\b|bars?\b|scone|donut|doughnut|biscuit|pudding|granola|flapjack|slice\b|bites?\b|balls?\b|squares?\b|treats?\b|truffle/i;

function parseImport(text){
  var doc = null;
  try{ doc = JSON.parse(text); }catch(e){ return null; }
  if(!doc || typeof doc !== 'object') return null;
  var body = ((doc.app === 'lunchsorted' || doc.app === 'fiveboxes' || doc.app === 'lunchbox-tin') && doc.account) ? doc.account : doc;
  try{
    if(isAccount(body)) return normalizeAccount(body);
    if(isLegacy(body)) return normalizeAccount(migrate(Object.assign({}, body, {schema:1})));
  }catch(e){ return null; }
  return null;
}
function isLegacy(d){ return !!(d && Array.isArray(d.foods) && d.settings && typeof d.settings === 'object'); }

document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act],[data-nf]');
  if(!el || !S) return;

  var nf = el.getAttribute('data-nf');
  if(nf){
    if(nf==='cat'){
      el.parentNode.querySelectorAll('.tg').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
      el.setAttribute('aria-pressed','true');
    } else el.setAttribute('aria-pressed', el.getAttribute('aria-pressed')==='true' ? 'false' : 'true');

    return;
  }
  var act = el.getAttribute('data-act');
  var kid = activeKid();
  /* a caretaker sees the plan and checks the list off on this phone; changing the plan is for a parent */
  if(isHelper() && HELPER_OK.indexOf(act) < 0){ toast('Only a parent can change the plan'); return; }
  if(act!=='clear-all' && act!=='del-kid' && act!=='clear-week' && act!=='delete-account' && act!=='member-remove' && act!=='disarm' && UI.armed) UI.armed = '';
  if(act!=='delete-account' && UI.deleteTyped) UI.deleteTyped = '';   /* typing is an input event, so it can never clear itself */

    var ek = kidById(el.getAttribute('data-kid')), ed = ek && findDay(ek, el.getAttribute('data-day'));
    if(!ek || !ed) return;
    ek.eaten = ek.eaten || {};
    var row = ek.eaten[ed.d] = (ek.eaten[ed.d] && !ek.eaten[ed.d].skipped) ? ek.eaten[ed.d] : {};
    var me = (deviceMember() || {}).id || null;
    if(act==='eat-skip'){ ek.eaten[ed.d] = {skipped:true, at:now(), by:me}; }
    else if(act==='eat-all'){
      ALL_CATS.forEach(function(c){ if(foodById(ek, ed.slots[c.k])) row[c.k] = {foodId:ed.slots[c.k], r:'ate', at:now(), by:me}; });
    } else {
      var ec = el.getAttribute('data-cat');
      row[ec] = {foodId:ed.slots[ec], r:el.getAttribute('data-r'), at:now(), by:me};
    }
    touch(ek); save();
    if(reviewComplete(ek, ed)) delete UI.reviewEdit[ek.id];

    return;

  }

  /* kid's pick */

  if(act==='kidpick-on'){
    if(!kid.settings.kidPick && gated()){ upgradeSheet('kidpick'); return; }
    kid.settings.kidPick = !kid.settings.kidPick; touch(kid.settings); touch(kid); save(); render(); kidReminderSync(true); return;
  }
  if(act==='kid-reminder'){ kid.settings.kidReminder = kid.settings.kidReminder === false; touch(kid.settings); touch(kid); save(); render(); kidReminderSync(true); return; }
  if(act==='kidpick-mode'){ kid.settings.kidPickMode = el.getAttribute('data-v') === 'boxes' ? 'boxes' : 'parts'; touch(kid.settings); touch(kid); save(); render(); return; }
  if(act==='kid-exit'){ UI.kid = null; render(); toast('Handed back'); return; }

  /* first run */
  /* the chips flip in place: a re-render would throw away the name field's focus and keyboard */
  if(act==='ob-heat'){ UI.ob.heat = el.getAttribute('data-v')==='hot'; obPress(el, true); return; }
  if(act==='ob-avoid'){

  if(act==='ob-signin'){ if(!navigator.onLine){ toast('You are offline \u2014 try that when you have signal'); return; } UI.obEmail = true; render(); window.scrollTo(0,0); return; }
  if(act==='ob-resend'){ Account.linkSent = ''; Account.devLink = ''; Account.devCode = ''; render(); return; }
  if(act==='ob-skip'){
    var obn2 = document.getElementById('obName'); if(obn2 && obn2.value.trim()) kid.name = obn2.value.trim().slice(0,40);
    kid.settings.noHeat = !UI.ob.heat;
    kid.settings.avoidAllergens = UI.ob.avoid.slice();
    touch(kid.settings);
    S.onboardedAt = now(); UI.tab = 'foods';
    if(Account.elsewhere){ Account.elsewhere = false; Sync.push(true); }
    save(); render(); window.scrollTo(0,0); return;
  }

  /* navigation */
  if(act==='tab'){ UI.weekAhead = 0; if(el.getAttribute('data-tab')==='pack' && UI.tab==='pack' && reviewOwed()) UI.reviewLater = {};   /* the dot is a door: tapping Pack again brings the questions back */ if(UI.tab !== 'setup') UI.lastTab = paneLabel(); UI.tab = el.getAttribute('data-tab'); UI.pane = '';
    UI.recipeFind = '';                    /* leaving the tab clears the search: coming back to a filtered list reads as a list with recipes missing */
    render(); window.scrollTo(0,0); return; }
  if(act==='box-settings'){ if(UI.pane==='box') closePane(); else if(paneOK('box')) openPane('box'); return; }
  if(act==='pane'){ var pn = el.getAttribute('data-pane'); if(!paneOK(pn)) return; openPane(pn); return; }
  if(act==='pane-done' || act==='box-done'){ closePane(); return; }
  if(act==='go-foods'){ UI.tab='foods'; UI.pane = ''; render(); window.scrollTo(0,0); return; }
  if(act==='go-kid-foods'){ S.activeKidId = el.getAttribute('data-id'); UI.tab='foods'; UI.pane = ''; save(); render(); window.scrollTo(0,0); return; }
  if(act==='go-week'){ UI.tab='week'; UI.pane = ''; render(); window.scrollTo(0,0); return; }

    }).catch(offline);
    return;
  }
  if(act==='signout'){ UI.deleteTyped = ''; Store.markAccount(false);
    /* the household lives on the server; signing out sends anything unsent, then leaves this
       phone blank, the way a signed-out app should be. Signing in again brings it all back. */
    clearTimeout(Account.timer);
    var flush = (canWrite() && S.onboardedAt) ? Sync.push() : Promise.resolve();
    flush.then(function(){ return api('POST', '/api/auth/logout'); }).then(function(){
      Account.user = null; Account.me = null; Account.members = []; Account.invite = ''; Account.linkSent = ''; Account.status = 'idle'; Account.first = false; Account.elsewhere = false; Account.entitlement = null; Account.household = null;
      Store.forget(); S = newAccount(); DEVICE.memberId = S.members[0].id; UI.tab = 'pack'; UI.obEmail = false;
      save(); render(); window.scrollTo(0,0); toast('Signed out \u2014 this phone is clear. Sign in again to get the lunches back.');
    }).catch(offline);
    return;
  }
  if(act==='upgrade'){ upgradeSheet(el.getAttribute('data-why') || ''); return; }
  if(act==='go-signin'){ rememberAfter(el.getAttribute('data-why')); UI.tab = 'setup'; UI.pane = ''; render(); setTimeout(function(){ var el = document.getElementById('signinEmail'); if(el) el.focus(); }, 120); return; }
  if(act==='buy' || act==='portal'){
    if(Account.buying) return;
    Account.buying = true; var was = el.textContent; el.disabled = true; el.textContent = 'Opening Stripe\u2026';
    var undoBtn = function(){ Account.buying = false; el.disabled = false; el.textContent = was; };
    if(act==='buy') rememberAfter(el.getAttribute('data-why'));
    var client = native() ? 'ios' : undefined;
    var call = act==='buy' ? api('POST', '/api/billing/checkout', {plan: el.getAttribute('data-plan') || 'year', client: client}) : api('POST', '/api/billing/portal', {client: client});
    call.then(function(r){
      if(r.status !== 200 || !r.url){ undoBtn(); toast(r.error || (act==='buy' ? 'Could not open the checkout' : 'Could not open billing')); return; }
      var browser = nativePlugin('Browser');
      if(browser){                                           /* the iPhone app: Stripe opens in Safari, and back.html hands the parent back to the app */
        undoBtn(); closeSheet();
        browser.open({url: r.url}).catch(function(){ location.href = r.url; });
        return;
      }
      location.href = r.url;                                 /* Stripe's page; it sends you back to /app/ */
    }).catch(function(){ undoBtn(); offline(); });
    return;
  }
  if(act==='invite' || act==='invite-helper'){
    if(gated()){ upgradeSheet('share'); return; }
    api('POST', '/api/household/invite', {role: act==='invite-helper' ? 'helper' : 'adult'}).then(function(r){
      if(r.status === 402){ upgradeSheet('share'); return; }
      if(r.status !== 200){ toast(r.error || 'Could not make an invite'); return; }
      Account.invite = r.url; Account.inviteRole = r.role; render();
    }).catch(offline);
    return;
  }
  if(act==='invite-copy'){ copy(Account.invite, 'Link copied \u2014 send it to them'); return; }
  if(act==='invite-share'){
    navigator.share({title:'Lunch Sorted', text:'Join our lunches on Lunch Sorted', url:Account.invite}).then(function(){ toast('Sent \u2014 ask them to open it on their phone'); }, function(){});
    return;
  }
  if(act==='member-remove'){
    var rmId = el.getAttribute('data-id'), rmName = (Account.members.filter(function(m){ return String(m.userId) === rmId; })[0] || {});
    if(UI.armed !== 'rm:'+rmId){ UI.armed = 'rm:'+rmId; render(); toast('That signs '+(rmName.userId ? memberLabel(rmName) : 'them')+' out of the household'); return; }
    api('POST', '/api/household/remove', {userId: +rmId}).then(function(r){
      UI.armed = '';
      if(r.status !== 200){ render(); toast(r.error || 'Could not remove them'); return; }
      applyState(r); render(); toast('Removed \u2014 you can invite them back');
    }).catch(offline);
    return;
  }
  if(act==='leave'){
    api('POST', '/api/household/leave').then(function(r){
      if(r.status !== 200){ toast(r.error || 'Could not leave'); return; }
      /* the lunches were the household's: this phone starts fresh, signed in to its own empty household */
      S = newAccount(); S.onboardedAt = now(); DEVICE.memberId = S.members[0].id; Store.save(S, DEVICE.memberId);
      applyState(r); Account.version = r.version;
      return Sync.pull().then(function(){ UI.tab = 'setup'; UI.pane = ''; render(); toast('You have left \u2014 this phone has its own household now'); });
    }).catch(offline);
    return;
  }
  if(act==='join-accept'){
    api('POST', '/api/household/join', {code: Account.join.code, memberId: DEVICE.memberId}).then(function(r){
      if(r.status !== 200){ UI.notice = r.error || 'Could not join'; render(); return; }
      Account.join = null; try{ localStorage.removeItem('lunchsorted-join'); }catch(e){}
      applyState(r);
      var theirs = r.doc ? normalizeAccount(r.doc) : null;
      if(theirs){
        /* bring along only what this phone actually has: lunchboxes with food in them, and the person on it */
        var mine = Object.assign({}, S, {
          kids:S.kids.filter(function(k){ return !k.deletedAt && (foodsOf(k).length || k.week); }),
          members:S.members.filter(function(m){ return m.id === DEVICE.memberId; })
        });
        S = normalizeAccount(window.LSMerge.merge(mine, theirs, mergeHorizon())); S.activeKidId = (kids()[0] || {}).id;
        if(theirs.createdAt) S.createdAt = theirs.createdAt;      /* their household's birthday, not this phone's: joining never shortens their three weeks */
        Store.save(S, DEVICE.memberId);
      }
      render(); toast('Joined \u2014 you share their lunches now');
      return Sync.push();
    }).catch(offline);
    return;
  }
  if(act==='join-dismiss'){ Account.join = null; try{ localStorage.removeItem('lunchsorted-join'); }catch(e){} render(); return; }
  if(act==='delete-account'){
    if(!deleteArmed()){ toast('Type DELETE to confirm'); return; }
    el.disabled = true; el.textContent = 'Deleting\u2026';
    api('POST', '/api/auth/delete', {confirm:'DELETE'}).then(function(r){
      if(r.status !== 200){ el.disabled = false; el.textContent = 'Delete my account and data'; toast(r.error || 'Could not delete'); return; }
      Account.user = null; Account.me = null; Account.members = []; Account.invite = ''; UI.armed = ''; UI.deleteTyped = ''; Account.first = false; Account.household = null;
      Store.forget(); S = newAccount(); DEVICE.memberId = S.members[0].id; UI.tab = 'pack';
      save(); render(); toast('Deleted');
    }).catch(function(e){ el.disabled = false; el.textContent = 'Delete my account and data'; offline(e); });
    return;
  }
  if(act==='notice-dismiss'){ UI.notice=''; markSeen(); render(); return; }
  if(act==='whats-new-ok'){ UI.notice=''; markSeen(); closeSheet(); render(); return; }
  if(act==='elsewhere-ok'){ Account.elsewhere = false; render(); return; }
  if(act==='sync-now'){ if(!navigator.onLine){ toast('You are offline'); return; } Account.tries = 0; Sync.pull().then(render); return; }
  if(act==='review-later'){ UI.reviewLater[el.getAttribute('data-kid')] = {d:el.getAttribute('data-day'), at:Date.now()}; render(); return; }
  if(act==='week-ahead'){ UI.weekAhead = +el.getAttribute('data-v') === 1 ? 1 : 0; render(); window.scrollTo(0,0); return; }
  if(act==='review-now'){ delete UI.reviewLater[el.getAttribute('data-kid')]; render(); return; }
  if(act==='review-later-all'){                            /* this box: the card is inside its own tab */
    var rdL = reviewDay(kid); if(rdL) UI.reviewLater[kid.id] = {d:rdL.d, at:Date.now()};
    render(); window.scrollTo(0,0); toast('Answer from Pack whenever you like'); return;
  }
  if(act==='trial-dismiss'){ try{ localStorage.setItem(TRIAL_SEEN_KEY, el.getAttribute('data-stage') || 'soon'); }catch(e){} render(); return; }
  if(act==='undo'){ if(UI.undo){ var fn = UI.undo; UI.undo = null; fn(); } return; }
});

document.addEventListener('change', function(ev){
  if(!S) return;
  if(ev.target.id==='kidReminderAt'){
    var kid = activeKid(); if(!kid) return;
    var at = String(ev.target.value || '');
    if(/^([01]\d|2[0-3]):[0-5]\d$/.test(at)){ kid.settings.kidReminderAt = at; touch(kid.settings); touch(kid); save(); kidReminderSync(true); }
    return;
  }
  if(ev.target.id==='kidName' || ev.target.id==='avoidText'){
    if(ev.target.id==='avoidText'){ rulesChanged(activeKid()); save(); }
    render();
  }
});
document.addEventListener('keydown', function(ev){
  if(ev.key !== 'Enter') return;
  var id = ev.target && ev.target.id;
  if(id === 'signinEmail'){ ev.preventDefault(); var b = document.querySelector('[data-act="signin-request"]'); if(b) b.click(); }
  if(id === 'signinCode'){ ev.preventDefault(); var c = document.querySelector('[data-act="signin-code"]'); if(c) c.click(); }
});
document.addEventListener('input', function(ev){
  if(!S) return;
  var kid = activeKid();
  if(isHelper() && (ev.target.id==='kidName' || ev.target.id==='avoidText')) return;   /* a write that can never sync is worse than no write */
  if(ev.target.id==='kidName'){
    kid.name = ev.target.value.slice(0,40); touch(kid); save();
    /* echo the new name where it already shows, without rebuilding the header:
       the old hand-patch dropped the gear and the help button until the next
       render, and would now put a lunchbox button back over the tab strip */
    var nm = kid.name || 'Lunchbox';
    var titles = document.querySelectorAll('#view .view-title');
    var t = titles[titles.length - 1]; if(t && t.id !== 'paneTitle') t.textContent = nm;   /* the last one names the box; the first names the page */
    var tab = document.querySelector('.boxtabs [aria-current="true"]');
    if(tab && tab.lastChild && tab.lastChild.nodeType === 3) tab.lastChild.nodeValue = nm;
    var kb = document.querySelector('#who .kidbtn .nm'); if(kb) kb.textContent = nm;
  }
  if(ev.target.id==='deleteConfirm'){
    UI.deleteTyped = ev.target.value;
    var b = document.querySelector('[data-act="delete-account"]'), armed = deleteArmed();
    if(b){ b.disabled = !armed; if(armed) b.removeAttribute('aria-disabled'); else b.setAttribute('aria-disabled','true'); }
    var hint = document.getElementById('deleteHint'); if(hint) hint.hidden = armed;
    return;
  }
  if(ev.target.id==='obName'){ UI.ob.name = ev.target.value; }
  if(ev.target.id==='signinEmail'){ UI.obDraft = ev.target.value; }
  if(ev.target.id==='avoidText'){ kid.settings.avoidText = ev.target.value.slice(0,500); touch(kid.settings); touch(kid); save(); }
  if(ev.target.id==='memberName'){
    var me = deviceMember(); if(!me) return;
    me.name = ev.target.value.slice(0,60); touch(me); save();
  }
});

/* the list as plain text, one line each, grouped by aisle, for Notes, Reminders or a text message */
function listText(bare){
  var rows = shoppingList().filter(function(r){ return !r.have; }), out = [], last = null;
  var later = shoppingList(true).filter(function(r){ return !r.have; });
  if(later.length) rows = rows.concat([{aisle:'__next'}], later);        /* the week after, under its own line */
  rows.forEach(function(r){
    if(r.aisle === '__next'){ out.push((out.length ? '\n' : '')+'NEXT WEEK'); last = null; return; }
    if(r.aisle !== last){ out.push((out.length ? '\n' : '')+AISLE_SHORT[r.aisle]); last = r.aisle; }
    out.push('- '+r.name+(r.qty>1 ? ' x'+r.qty : ''));
  });
  return rows.length ? (bare ? '' : 'Lunch shopping list\n\n')+out.join('\n') : '';
}
/* the phone's share sheet: the app's plugin inside the iPhone app, the browser's on the web */
function canShare(){ return !!(nativePlugin('Share') || navigator.share); }
function shareText(title, text){
  var sh = nativePlugin('Share');
  var p = sh ? sh.share({title:title, text:text, dialogTitle:title}) : (navigator.share ? navigator.share({title:title, text:text}) : null);
  if(!p){ copy(text, 'List copied'); return; }
  p.catch(function(e){ if(!/abort|cancel/i.test(String(e && (e.name || e.message)))) copy(text, 'List copied'); });
}
function copy(text, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); },
      function(){ toast(native() ? 'Copy blocked' : 'Copy blocked by the browser'); });
  } else toast(native() ? 'Copy blocked' : 'Copy blocked by the browser');
}

/* -------------------------------------------------- optional capability */
var Downloads = null;
if(window.claude && typeof window.claude.use === 'function'){
  try{
    window.claude.use('downloads').then(function(d){
      Downloads = d || null;
      if(Downloads && UI.tab==='setup') render();
    }, function(){});
  }catch(e){}
}

/* ------------------------------------------------------------------ boot */
Store.load().then(function(r){
  var doc = null, rejected = false;
  try{
    if(r.doc) doc = normalizeAccount(isAccount(r.doc) ? r.doc : migrate(r.doc));
    if(!doc && !r.raw && isLegacy(r.legacy)) doc = normalizeAccount(migrate(Object.assign({}, r.legacy, {schema:1})));
  }catch(e){ doc = null; }
  if(!doc && (r.raw || r.unreadable)){
    /* something was saved here and we could not make sense of it: keep it, start fresh, say so */
    rejected = true;
    UI.notice = Store.backup(r.raw)
      ? 'Your saved lunches could not be read, so this is a fresh start. A copy was kept on this phone.'
      : 'Your saved lunches could not be read, so this is a fresh start.';
  }
  if(!doc) doc = newAccount();
  S = doc;
  DEVICE.memberId = (r.device && memberById(r.device)) ? r.device : members()[0].id;
  /* anyone who already has a list has effectively finished onboarding */
  if(!S.onboardedAt && kids().some(function(k){ return foodsOf(k).length; })) S.onboardedAt = now();
  whatsNew();
  try{ rolloverAll(); render(); }
  catch(e){
    /* the last line of defence: a document that renders badly must not become
       permanent, and must not be overwritten unless a copy was really kept */
    var kept = rejected || Store.backup(r.raw);
    S = newAccount(); DEVICE.memberId = S.members[0].id;
    UI.notice = 'Your saved lunches could not be shown, so this is a fresh start.' + (kept ? ' A copy was kept on this phone.' : '');
    if(!kept) rejected = true;
    render();
  }
  if(!rejected && (r.renamed || JSON.stringify(S) !== r.raw)) save();   /* an unchanged document is not rewritten on every launch */

  /* signed in? then the household on the server is part of the picture */
  var qs = new URLSearchParams(location.search);
  if(qs.get('signed-in')){
    var after = ''; try{ after = localStorage.getItem(AFTER_KEY) || ''; }catch(e){}
    if(after === 'week'){ UI.tab = 'week'; } else { UI.tab = 'setup'; UI.pane = ''; Account.first = true; }   /* the row list, not a pane: it carries the banners a fresh sign-in needs */
    UI.homeHint = true; toast('Signed in');
  }
  var betaCode = qs.get('beta') || '';
  if(/^[A-Za-z0-9-]{8,64}$/.test(betaCode)){ try{ localStorage.setItem(BETA_KEY, betaCode); }catch(e){} UI.tab = 'setup'; UI.pane = ''; Account.first = true; }
  var joinCode = qs.get('join') || (function(){ try{ return localStorage.getItem('lunchsorted-join') || ''; }catch(e){ return ''; } })();
  if(joinCode){ try{ localStorage.setItem('lunchsorted-join', joinCode); }catch(e){} UI.tab = 'setup'; UI.pane = ''; }
  var back = qs.get('paid'), portalBack = qs.get('portal'), wantUpgrade = qs.get('upgrade') === '1';
  if(wantUpgrade){ UI.tab = 'setup'; UI.pane = 'plan'; Account.first = true; if(S.onboardedAt) toast('Sign in on this phone to keep the Household plan'); }
  if(back === '1'){ UI.tab = 'setup'; UI.pane = 'plan'; Account.first = true; Account.settling = true; toast('Thank you \u2014 switching on the Household plan\u2026'); }
  else if(back === '0'){ UI.tab = 'setup'; UI.pane = 'plan'; Account.first = true; rememberAfter(''); toast('No charge was made'); }
  else if(portalBack){ UI.tab = 'setup'; UI.pane = 'plan'; Account.first = true; }
  if(qs.get('signed-in') || qs.get('join') || qs.get('beta') || back !== null || portalBack || wantUpgrade) history.replaceState(null, '', location.pathname);
  /* what the plans cost and whether anything is gated at all; cached, and answered from the phone offline */
  loadBilling().then(function(){ if(!signedIn()) render(); kidReminderSync(); });
  var afterMe = function(){
    if(!joinCode) return;
    api('GET', '/api/household/invite?code='+encodeURIComponent(joinCode)).then(function(r){
      if(r.status === 200){
        Account.join = {code:joinCode, name:r.name, role:r.role, from:r.from};
        if(!S.onboardedAt){ S.onboardedAt = now(); save(); }   /* an invited phone starts at the sign-in card, not the questions */
      } else { try{ localStorage.removeItem('lunchsorted-join'); }catch(e){} if(r.status === 410) UI.notice = r.error; }
      render();
    }).catch(function(){});
  };
  if(navigator.onLine && !rejected){
    /* one request answers "who am I" and "what does the household hold" together */
    Sync.pull().then(function(){ if(signedIn() || joinCode) render(); afterMe(); if(qs.get('signed-in')) resumeAfter(); if(wantUpgrade && signedIn() && S.onboardedAt && !paid()) upgradeSheet('keep'); }).catch(function(){});
    /* back from Stripe: the webhook usually lands within a second or two of the redirect, so look a few times */
    if(back === '1') settle();
  }
  function settle(){
    if(settle.on) return;                                    /* the hand-back can arrive more than once; one poll is enough */
    settle.on = true;
    var looks = 0, look = function(){
      if(paid()){ settle.on = false; Account.settling = false; render(); toast('Welcome to the Household plan'); resumeAfter(); return; }
      if(++looks > 8){ settle.on = false; Account.settling = false; render(); toast('Paid \u2014 it can take a minute to show up here'); return; }
      setTimeout(function(){ Sync.pull().then(look).catch(look); }, looks < 3 ? 1500 : 3000);
    };
    setTimeout(look, 1200);
  }
  /* the iPhone app: a sign-in link or back.html opening the app lands here, with the url */
  var app = nativePlugin('App');
  if(app && app.addListener){
    app.addListener('appUrlOpen', function(ev){
      var u = String(ev && ev.url || '');
      var browser = nativePlugin('Browser'); if(browser) browser.close().catch(function(){});
      var m = /^lunchsorted:\/\/back\/?(?:\?(.*))?$/.exec(u);
      if(m){
        var q = new URLSearchParams(m[1] || '');
        UI.tab = 'setup'; UI.pane = 'plan'; Account.first = true;   /* back from Stripe in Safari: land on the plan, not on a row list */
        if(q.get('paid') === '1'){ Account.settling = true; render(); toast('Thank you \u2014 switching on the Household plan\u2026'); settle(); }
        else if(q.get('paid') === '0'){ rememberAfter(''); render(); toast('No charge was made'); }
        else { render(); Sync.pull(); }
        return;
      }
      if(/^https:\/\/([a-z0-9-]+\.)?lunchsorted\.app\//.test(u)) location.href = u;   /* a universal link, such as the sign-in link in the email */
    });
  }
  /* Safari closed on the Done button instead of the hand-off: look once anyway, so a payment made that way still shows */
  var nb = nativePlugin('Browser');
  if(nb && nb.addListener){
    nb.addListener('browserFinished', function(){
      if(!signedIn() || settle.on) return;
      var wasPaid = paid();
      Sync.pull().then(function(){ if(!wasPaid && paid()){ render(); toast('Welcome to the Household plan'); resumeAfter(); } else render(); }).catch(function(){});
    });
  }
  window.addEventListener('online', function(){ if(signedIn()) Sync.resume(); else render(); });
  window.addEventListener('pageshow', function(e){ if(e.persisted && Account.buying){ Account.buying = false; closeSheet(); render(); } });
  window.addEventListener('offline', function(){ renderSyncLine(); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ if(S) rolloverAll(); if(S && !UI.kid && !sheetState && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName || '')) render(); Sync.resume(); } });
});
})();
