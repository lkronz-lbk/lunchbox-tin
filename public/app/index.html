<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunch Sorted</title>
<meta name="description" content="Plan a week of packed school lunches in about a minute. Cold-lunch ideas matched into balanced boxes, with the shopping list built for you.">
<meta name="theme-color" content="#E9EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lunch Sorted">
<style>
:root{color-scheme:light dark}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#E9EEE6; --surface:#FBFCF9; --surface-2:#F1F5EE; --sunk:#DFE7DB;
  --ink:#16241E; --ink-2:#4A5C53; --ink-3:#6E7F75;
  --line:#CFDACB; --line-strong:#1E3329;
  --c-main:#2E5A48; --c-side:#8A5309; --c-fruit:#A2304C; --c-sweet:#57448A; --c-snack:#6B7A1F; --c-drink:#2B6B85;
  --scrim:rgba(8,16,13,.5); --shadow-1:0 1px 2px rgba(0,0,0,.25); --shadow-lift:0 4px 0 rgba(0,0,0,.06);
  --accent:#2E5A48; --accent-fg:#FBFCF9; --accent-soft:#DCE8DF;
  --warn:#8A5A06; --warn-soft:#F6E9CE;
  --toast-bg:#1E3329; --toast-fg:#F4F8F3;
  --r-lg:20px; --r-md:12px; --r-sm:8px;
  --f-display:"Familjen Grotesk","Trebuchet MS",sans-serif;
  --f-body:"Karla","Helvetica Neue",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1815; --surface:#17251F; --surface-2:#1E2F28; --sunk:#111C18;
    --ink:#E6EEE7; --ink-2:#A6BAAE; --ink-3:#7A8E84;
    --line:#2B3E36; --line-strong:#4E7263;
    --c-main:#79C8A2; --c-side:#E0A253; --c-fruit:#EA8299; --c-sweet:#A793DC; --c-snack:#C3CF6E; --c-drink:#7FC3DE;
    --scrim:rgba(0,0,0,.62); --shadow-1:0 0 0 1px rgba(255,255,255,.14); --shadow-lift:0 4px 0 rgba(255,255,255,.08);
    --accent:#79C8A2; --accent-fg:#0E1815; --accent-soft:#1F332A;
    --warn:#E0A253; --warn-soft:#2C2415;
    --toast-bg:#E6EEE7; --toast-fg:#0E1815;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1815; --surface:#17251F; --surface-2:#1E2F28; --sunk:#111C18;
  --ink:#E6EEE7; --ink-2:#A6BAAE; --ink-3:#7A8E84;
  --line:#2B3E36; --line-strong:#4E7263;
  --c-main:#79C8A2; --c-side:#E0A253; --c-fruit:#EA8299; --c-sweet:#A793DC; --c-snack:#C3CF6E; --c-drink:#7FC3DE;
  --scrim:rgba(0,0,0,.62); --shadow-1:0 0 0 1px rgba(255,255,255,.14); --shadow-lift:0 4px 0 rgba(255,255,255,.08);
  --accent:#79C8A2; --accent-fg:#0E1815; --accent-soft:#1F332A;
  --warn:#E0A253; --warn-soft:#2C2415;
  --toast-bg:#E6EEE7; --toast-fg:#0E1815;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:600px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-0.01em}
.brand span{color:var(--c-side)}
.kid{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
h2.view-title{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;margin:0;text-wrap:balance}
.view-sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-3)}

/* ---- the tin ---- */
.tin{border:2px solid var(--line-strong);border-radius:var(--r-lg);background:var(--line-strong);
  display:grid;grid-template-columns:1fr 1fr;gap:2px;overflow:hidden}
.cmp{background:var(--surface);border:0;padding:12px 12px 13px;min-height:104px;display:flex;flex-direction:column;
  gap:7px;text-align:left;align-items:stretch;transition:background .12s ease}
.cmp:active{background:var(--surface-2)}
.cmp .lab{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;gap:6px}
.cmp .nm{font-family:var(--f-display);font-size:15.5px;font-weight:600;line-height:1.22;letter-spacing:-0.01em;color:var(--ink)}
.cmp .sub{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);letter-spacing:.04em;margin-top:auto}
.cmp.empty .nm{color:var(--ink-3);font-weight:500}
.c-main .lab{color:var(--c-main)} .c-side .lab{color:var(--c-side)}
.c-fruit .lab{color:var(--c-fruit)} .c-sweet .lab{color:var(--c-sweet)}
.c-snack .lab{color:var(--c-snack)} .c-drink .lab{color:var(--c-drink)}
.cmp.minor{min-height:76px}
.tin .cmp.minor:nth-child(5):last-child{grid-column:1/-1}
.cmp[aria-pressed="true"]{background:var(--surface-2)}
.cmp[aria-pressed="true"] .nm{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-3)}
.tick{width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;flex:none}
.cmp[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tick svg{width:9px;height:9px;opacity:0}
.cmp[aria-pressed="true"] .tick svg{opacity:1}
.lock{opacity:.85}

.daycard{display:flex;flex-direction:column;gap:9px}
.daycard.past{opacity:.55}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:2px}
.dayname{font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:-0.01em}
.dayname em{font-family:var(--f-mono);font-style:normal;font-size:11px;font-weight:500;color:var(--ink-3);
  letter-spacing:.08em;margin-left:7px;text-transform:uppercase}
.note{font-size:13.5px;color:var(--ink-2);padding:0 2px;line-height:1.45}
.note b{font-weight:600;color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:5px}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.good{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.btn{border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-md);
  padding:0 16px;min-height:44px;font-family:var(--f-display);font-weight:600;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--ink-2);font-weight:500}
.btn.wide{width:100%}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px;border-radius:var(--r-sm)}
.btn.danger{border-color:var(--line);color:var(--c-fruit);background:transparent}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card h3{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0 0 3px}
.meter{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3);letter-spacing:.05em}

.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;padding-left:2px}
.sect-head h3{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.item{display:flex;align-items:center;gap:11px;padding:11px 13px;min-height:52px;border-top:1px solid var(--line);
  width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .nm{display:block;font-size:14.5px;line-height:1.3}
.item .meta{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.05em}
.item.done .nm{text-decoration:line-through;color:var(--ink-3)}
.box{width:22px;height:22px;flex:none;border:1.5px solid var(--line-strong);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:transparent}
.item.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.box svg{width:12px;height:12px}
.x{flex:none;width:44px;height:44px;margin-right:-8px;border-radius:var(--r-sm);border:0;background:none;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center}
.qty{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);
  padding:11px 12px;min-height:44px;width:100%;font-size:15px}
textarea{min-height:70px;resize:vertical}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.toggles{display:flex;flex-wrap:wrap;gap:7px}
.tg{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:0 13px;min-height:44px;
  font-size:13.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 -6px}
.dow .tg{min-width:0;min-height:44px;padding:0;justify-content:center;font-family:var(--f-mono);font-size:13px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch .t{font-size:14.5px}
.switch .d{font-size:12.5px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.sw{flex:none;width:50px;height:30px;border-radius:999px;border:1.5px solid var(--line);background:var(--sunk);position:relative;transition:background .15s}
.sw::before{content:"";position:absolute;inset:-8px -12px}   /* a 44px hit area around a 30px pill */
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);
  box-shadow:var(--shadow-1);transition:transform .15s ease}
.sw[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}

.empty{border:2px dashed var(--line);border-radius:var(--r-lg);padding:26px 20px;text-align:center;display:flex;
  flex-direction:column;gap:12px;align-items:center;background:var(--surface)}
.empty p{margin:0;color:var(--ink-2);font-size:14px;max-width:38ch}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-md);padding:11px 13px;font-size:13.5px;
  display:flex;gap:10px;align-items:center;justify-content:space-between}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--ground);background:color-mix(in srgb,var(--ground) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{flex:1;border:0;background:none;min-height:52px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--ink-3);border-radius:var(--r-md)}
nav.tabs button span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
nav.tabs button[aria-current="true"]{color:var(--accent)}
nav.tabs svg{width:21px;height:21px}

.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none;transition:opacity .18s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--ground);border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);max-height:86vh;display:flex;flex-direction:column;visibility:hidden;
  transform:translateY(102%);transition:transform .22s cubic-bezier(.32,.72,0,1),visibility 0s .22s}
.sheet.open{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.32,.72,0,1),visibility 0s}
.sheet header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line)}
.sheet header h3{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0}
.sheet .body{overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:8px auto 0}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:var(--toast-bg);color:var(--toast-fg);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:40;
  opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{min-height:44px;margin:-10px -8px -10px 8px;padding:0 8px;background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:32px}
@media (min-width:520px){
  .cmp{min-height:112px}
  h2.view-title{font-size:30px}
}

/* --- first run --- */
.ob{min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:22px;
  max-width:600px;margin:0 auto;padding:34px 20px calc(34px + env(safe-area-inset-bottom))}
.ob h1{font-family:var(--f-display);font-size:clamp(30px,8.5vw,40px);font-weight:700;letter-spacing:-0.025em;
  line-height:1.08;margin:0;text-wrap:balance}
.ob .lede{font-size:16.5px;color:var(--ink-2);margin:8px 0 0;max-width:38ch}
.ob .q{display:flex;flex-direction:column;gap:9px}
.ob .q > span{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.ob .go{margin-top:4px}
.ob .skip{background:none;border:0;color:var(--ink-3);font-size:13.5px;text-decoration:underline;
  text-underline-offset:3px;min-height:44px}
.oblogo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:64px;height:64px;border-radius:14px;
  border:2px solid var(--line-strong);background:var(--line-strong);overflow:hidden;margin-bottom:4px}
.oblogo i:nth-child(1){background:var(--c-main)} .oblogo i:nth-child(2){background:var(--c-side)}
.oblogo i:nth-child(3){background:var(--c-fruit)} .oblogo i:nth-child(4){background:var(--c-sweet)}

/* --- kid's pick: bounded choice, two pictures per compartment --- */
.kidmode{position:fixed;inset:0;z-index:60;background:var(--ground);display:flex;flex-direction:column;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.kidmode .top .exit{margin-left:auto}
.more summary{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;min-height:44px;display:flex;align-items:center}
.kidmode .top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 6px}
.dots{display:flex;gap:7px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line-strong);opacity:.35;display:block}
.dots i.on{background:var(--accent);opacity:1} .dots i.did{background:var(--accent);opacity:.45}
.kidmode .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;
  padding:8px 20px calc(28px + env(safe-area-inset-bottom));max-width:600px;width:100%;margin:0 auto}
.kidmode .catlab{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.kidmode h1{font-family:var(--f-display);font-size:clamp(28px,8vw,38px);font-weight:700;letter-spacing:-0.025em;
  line-height:1.08;margin:0;text-wrap:balance}
.kidmode .hint{font-size:16px;color:var(--ink-2);margin:0}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.picks.one{grid-template-columns:1fr;max-width:260px}
.pick{background:var(--surface);border:2.5px solid var(--line-strong);border-radius:24px;min-height:210px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 12px;
  font:inherit;color:var(--ink);transition:transform .12s ease,background .12s ease}
.pick:active{transform:scale(.96)}
.pick .ic{font-size:68px;line-height:1;filter:drop-shadow(var(--shadow-lift))}
.pick .nm{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.2;text-align:center;text-wrap:balance}
.pick.chosen{border-color:var(--accent);background:var(--accent-soft)}
.kiddone{display:flex;flex-direction:column;gap:18px;align-items:stretch}
.kiddone .big{font-size:64px;line-height:1;text-align:center}
.kiddone h1{text-align:center}
.kiddone .tin .cmp{min-height:112px}
.kiddone .tin .ic{font-size:26px;line-height:1;margin-bottom:2px}
.pickchip{display:inline-flex;align-items:center;gap:5px}
@media (prefers-reduced-motion:reduce){.pick:active{transform:none}}

/* --- "did they eat it?" review --- */
.review h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600}
.rrow{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rrow:last-of-type{border-bottom:0;padding-bottom:4px}
.ric{font-size:22px;line-height:1}
.rnm{font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.25}
.seg{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;border:1.5px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);min-height:44px;font-size:13px;font-weight:500;color:var(--ink-2);border-left:1.5px solid var(--line-strong)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.review .btn.wide{margin-top:12px}

/* --- multi-profile chrome --- */
.topbar .who{display:flex;align-items:center;gap:8px}
.kidbtn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);
  border-radius:999px;padding:0 12px;min-height:44px;font-size:13.5px;font-weight:600;color:var(--ink)}
.kidbtn .dot{width:8px;height:8px}
.kidbtn .caret{font-size:10px;color:var(--ink-3)}
.kidline{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:6px;margin:0 0 6px;padding-left:2px}
.kidgroup{display:flex;flex-direction:column;gap:9px}
.radio{width:20px;height:20px;flex:none;border:1.5px solid var(--line-strong);border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.item.on .radio{border-color:var(--accent)}
.item.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.codebox{font-family:var(--f-mono);font-size:11px;line-height:1.45;min-height:110px;word-break:break-all}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
</style>
</head>

<div class="app">
  <div class="topbar">
    <div class="brand">Lunch <span>Sorted</span></div>

  </div>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs"></nav>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">

  <header><h3 id="sheetTitle"></h3><button class="btn ghost sm" id="sheetClose">Done</button></header>
  <div class="body" id="sheetBody"></div>
</div>
<div id="kid" hidden></div>

/* ================================================================ storage
   The ONLY place that touches persistence. Both calls are async so the
   UI already tolerates a round trip; a server version replaces the two
   bodies with fetch() and nothing else in the app changes.
   ---------------------------------------------------------------- */
var Store = {
  KEY:'lunchsorted',             /* the account document */
  PRIOR_KEYS:['fiveboxes','lunchbox-tin'],   /* the same document under the app's earlier names, newest first */
  DEVICE_KEY:'lunchsorted-device', /* which member is on THIS device — never exported */
  PRIOR_DEVICE_KEY:'fiveboxes-device',
  LEGACY_KEY:'lunchbox-tin-v1',  /* single-profile format, migrated on first run */
  ok:true,
  load:function(){
    return new Promise(function(res){
      var out = {doc:null, legacy:null, device:null, raw:null, unreadable:false, renamed:false};
      try{
        var raw = localStorage.getItem(Store.KEY);
        if(!raw){                                       /* found under an old name: write it under the new one */
          for(var i=0; i<Store.PRIOR_KEYS.length && !raw; i++) raw = localStorage.getItem(Store.PRIOR_KEYS[i]);
          out.renamed = !!raw;
        }
        out.raw = raw;
        if(raw){ try{ out.doc = JSON.parse(raw); }catch(e){ out.unreadable = true; } }
        var old = localStorage.getItem(Store.LEGACY_KEY);
        if(old){ try{ out.legacy = JSON.parse(old); }catch(e){ out.legacy = null; } }
        out.device = localStorage.getItem(Store.DEVICE_KEY) || localStorage.getItem(Store.PRIOR_DEVICE_KEY);
      }catch(e){ Store.ok = false; }
      res(out);
    });
  },
  save:function(doc, deviceMemberId){
    return new Promise(function(res){
      try{
        localStorage.setItem(Store.KEY, JSON.stringify(doc));
        if(deviceMemberId) localStorage.setItem(Store.DEVICE_KEY, deviceMemberId);
        Store.PRIOR_KEYS.forEach(function(k){ localStorage.removeItem(k); });   /* one copy on disk, under one name */
        localStorage.removeItem(Store.PRIOR_DEVICE_KEY);
      }catch(e){ Store.ok = false; }
      res(true);
    });
  },
  /* Never overwrite something we could not read: park the raw text under a
     dated key so it can be recovered by hand or pasted back in. */
  BACKUP_PREFIX:'lunchsorted-backup-',
  backupKeys:function(){
    try{ return Object.keys(localStorage).filter(function(k){ return k.indexOf(Store.BACKUP_PREFIX) === 0 || k.indexOf('fiveboxes-backup-') === 0; }).sort(); }catch(e){ return []; }
  },
  backup:function(raw){
    if(!raw) return false;
    try{
      var keys = Store.backupKeys();
      if(keys.some(function(k){ return localStorage.getItem(k) === raw; })) return true;   /* already kept */
      while(keys.length >= 2) localStorage.removeItem(keys.shift());                          /* never more than two */
      localStorage.setItem(Store.BACKUP_PREFIX+Date.now(), raw); return true;
    }catch(e){ return false; }
  },
  forget:function(){
    try{ [Store.KEY, Store.LEGACY_KEY, Store.DEVICE_KEY, Store.PRIOR_DEVICE_KEY].concat(Store.PRIOR_KEYS, Store.backupKeys())
      .forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
  }
};

var MIGRATIONS = {
  1: function(old){                       /* single-profile v1 -> account v2 */
    var owner = newMember('Me','owner');
    var kid = newKid((old.settings && old.settings.kid) || 'Lunchbox', 0);
    var acct = {schema:2, id:uid('acc'), name:'My household', createdAt:now(), updatedAt:now(),
      members:[owner], kids:[kid], activeKidId:kid.id, pantry:nullMap()};
    if(old.settings){
      kid.settings.days = old.settings.days || [1,2,3,4,5];
      kid.settings.noHeat = old.settings.noHeat !== false;
      kid.settings.avoidAllergens = old.settings.avoidAllergens || [];
      kid.settings.avoidText = old.settings.avoidText || '';
    }
    var idMap = {};
    (old.foods||[]).forEach(function(f){
      var nf = newFood(kid, f); idMap[f.id] = nf.id; kid.foods.push(nf);
    });
    if(old.week && old.week.days){
      kid.week = {id:uid('week'), kidId:kid.id, start:old.week.start, updatedAt:now(),
        days: old.week.days.map(function(d){
          var slots = {}, lock = {};
          CATS.forEach(function(c){ slots[c.k] = idMap[d.slots[c.k]] || null; lock[c.k] = !!(d.lock||{})[c.k]; });
          return {d:d.d, dow:d.dow, slots:slots, lock:lock};
        })};
    }
    Object.keys(old.packed||{}).forEach(function(dt){
      var row = {};
      Object.keys(old.packed[dt]).forEach(function(c){ if(old.packed[dt][c]) row[c] = {at:now(), by:owner.id}; });
      if(Object.keys(row).length) kid.packed[dt] = row;
    });
    Object.keys(old.have||{}).forEach(function(fid){
      if(!old.have[fid]) return;
      var nid = idMap[fid], f = kid.foods.filter(function(x){ return x.id===nid; })[0];
      if(f) acct.pantry[normKey(f.n)] = {have:true, at:now(), by:owner.id};
    });
    return acct;
  }
};
function migrate(doc){
  if(!doc || typeof doc !== 'object') return null;
  var guard = 0;
  while((doc.schema || 1) < SCHEMA && guard++ < 10){
    var fn = MIGRATIONS[doc.schema || 1];
    if(!fn) return null;
    doc = fn(doc);
  }
  return (doc.schema === SCHEMA) ? doc : null;
}
function isAccount(d){ return !!(d && d.schema === SCHEMA && Array.isArray(d.kids) && Array.isArray(d.members)); }

/* ------------------------------------------------------- normalization
   Anything that arrives from outside the running app — a pasted import, a
   hand-edited backup, a save from a future build, or simply a file that lost a
   field — is rebuilt from a whitelist before it becomes state. Unknown keys are
   dropped, wrong types fall back to defaults, ids and dates must look like ids
   and dates. The point is that render() can never throw on stored data, because
   a document that throws on load is a bricked app. */
function plainObj(v){ return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; }
function nullMap(){ return Object.create(null); }
function own(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }
function safeId(v, p){ return (typeof v === 'string' && /^[a-z]+_[a-z0-9]{1,40}$/.test(v)) ? v : uid(p); }
function safeIdOrNull(v){ return (typeof v === 'string' && /^[a-z]+_[a-z0-9]{1,40}$/.test(v)) ? v : null; }
function safeDate(v){ return (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : null; }
function safeStamp(v, dflt){ return (typeof v === 'string' && v.length < 40) ? v : (dflt === undefined ? now() : dflt); }
function safeStr(v, max, dflt){ return typeof v === 'string' ? v.slice(0, max) : dflt; }
function normMember(m){
  m = plainObj(m);
  return {id:safeId(m.id,'mem'), name:safeStr(m.name, 60, 'Me').trim() || 'Me',
    role: m.role === 'owner' ? 'owner' : 'adult',
    createdAt:safeStamp(m.createdAt), updatedAt:safeStamp(m.updatedAt), deletedAt: m.deletedAt ? safeStamp(m.deletedAt) : null};
}
function normFood(kid, f){
  f = plainObj(f);
  if(!catByKey(f.c)) return null;
  var n = safeStr(f.n, 80, '').trim(); if(!n) return null;
  return {id:safeId(f.id,'food'), kidId:kid.id, n:n, c:f.c,
    t:(Array.isArray(f.t) ? f.t : []).filter(function(x){ return TAGS.indexOf(x) > -1; }),
    a: AISLES.indexOf(f.a) > -1 ? f.a : 'other',
    al:(Array.isArray(f.al) ? f.al : []).filter(function(x){ return ALLERGENS.some(function(y){ return y.k === x; }); }),
    createdAt:safeStamp(f.createdAt), updatedAt:safeStamp(f.updatedAt), deletedAt: f.deletedAt ? safeStamp(f.deletedAt) : null};
}
function normStamped(v){
  v = plainObj(v);
  return {at:safeStamp(v.at), by:safeIdOrNull(v.by)};
}
function normDay(d){
  d = plainObj(d);
  var date = safeDate(d.d); if(!date) return null;
  var slots = {}, lock = {}, kidPick = {};
  var sl = plainObj(d.slots), lk = plainObj(d.lock), kp = plainObj(d.kidPick);
  ALL_CATS.forEach(function(c){
    if(own(sl, c.k)) slots[c.k] = safeIdOrNull(sl[c.k]);
    if(own(lk, c.k)) lock[c.k] = !!lk[c.k];
    if(own(kp, c.k) && kp[c.k]){ var e = normStamped(kp[c.k]); e.picker = 'kid'; kidPick[c.k] = e; }
  });
  return {d:date, dow:parseISO(date).getDay(), slots:slots, lock:lock, kidPick:kidPick};
}
function normDateRows(v, perRow, cap){
  var src = plainObj(v), out = {};
  Object.keys(src).filter(safeDate).sort().slice(-cap).forEach(function(d){
    var row = perRow(plainObj(src[d]));
    if(row) out[d] = row;
  });
  return out;
}
function normKid(k, i){
  k = plainObj(k);
  var kid = newKid(safeStr(k.name, 40, '').trim() || 'Lunchbox', Math.abs(Math.floor(+k.hue || i || 0)) % KID_HUES.length);
  kid.id = safeId(k.id, 'kid');
  kid.createdAt = safeStamp(k.createdAt); kid.updatedAt = safeStamp(k.updatedAt);
  kid.deletedAt = k.deletedAt ? safeStamp(k.deletedAt) : null;
  var st = plainObj(k.settings);
  var days = (Array.isArray(st.days) ? st.days : []).map(Number).filter(function(x){ return x >= 0 && x <= 6 && x === Math.floor(x); });
  kid.settings.days = days.length ? days.filter(function(x, j){ return days.indexOf(x) === j; }) : [1,2,3,4,5];
  kid.settings.noHeat = st.noHeat !== false;
  ['noIce','shortWindow','noChoc'].forEach(function(r){ kid.settings[r] = !!st[r]; });
  kid.settings.avoidAllergens = (Array.isArray(st.avoidAllergens) ? st.avoidAllergens : []).filter(function(a){ return ALLERGENS.some(function(y){ return y.k === a; }); });
  kid.settings.avoidText = safeStr(st.avoidText, 500, '');
  var so = plainObj(st.slots); kid.settings.slots = {snack:!!so.snack, drink:!!so.drink};
  kid.settings.updatedAt = safeStamp(st.updatedAt);
  kid.foods = (Array.isArray(k.foods) ? k.foods : []).slice(0, 500).map(function(f){ return normFood(kid, f); }).filter(Boolean);
  var w = plainObj(k.week);
  var wdays = (Array.isArray(w.days) ? w.days : []).map(normDay).filter(Boolean);
  kid.week = (safeDate(w.start) && wdays.length)
    ? {id:safeId(w.id,'week'), kidId:kid.id, start:safeDate(w.start), createdAt:safeStamp(w.createdAt, w.updatedAt), updatedAt:safeStamp(w.updatedAt), days:wdays}
    : null;
  kid.past = (Array.isArray(k.past) ? k.past : []).map(normDay).filter(Boolean).slice(-40);
  kid.packed = normDateRows(k.packed, function(row){
    var out = {}; ALL_CATS.forEach(function(c){ if(row[c.k]) out[c.k] = normStamped(row[c.k]); });
    return Object.keys(out).length ? out : null;
  }, 60);
  kid.eaten = normDateRows(k.eaten, function(row){
    if(row.skipped){ var sk = normStamped(row); sk.skipped = true; return sk; }
    var out = {};
    ALL_CATS.forEach(function(c){
      var e = plainObj(row[c.k]);
      if(e.foodId && ['ate','some','left'].indexOf(e.r) > -1){ var st2 = normStamped(e); st2.foodId = safeIdOrNull(e.foodId); st2.r = e.r; if(st2.foodId) out[c.k] = st2; }
    });
    return Object.keys(out).length ? out : null;
  }, 400);
  return kid;
}
function normalizeAccount(doc){
  if(!isAccount(doc)) return null;
  var acct = {schema:SCHEMA, id:safeId(doc.id,'acc'), name:safeStr(doc.name, 60, 'My household'),

  var live = acct.kids.filter(function(k){ return !k.deletedAt; });
  if(!live.length){ var k0 = newKid('Lunchbox', 0); acct.kids.push(k0); live = [k0]; }

function violation(kid, food){
  var s = kid.settings;
  if(s.noHeat && has(food,'heat')) return 'needs heating';
  if(s.noIce && has(food,'ice')) return 'needs an ice pack';
  if(s.shortWindow && has(food,'messy')) return 'fiddly for a short lunch';
  if(s.noChoc && CHOC_RE.test(food.n)) return 'chocolate or candy';
  var bad = (food.al||[]).filter(function(a){ return s.avoidAllergens.indexOf(a)>-1; });

/* ------------------------------------------------ pairing (deterministic) */
function pairScore(main, item, cat){
  if(!main || !item) return {s:0, why:[]};
  var s = 0, why = [];
  if(cat === 'drink'){
    if(has(main,'sweet') && has(item,'sweet')) s -= 2;            /* sweet main + juice is a sugar box */
    if(has(main,'salty') && has(item,'light')){ s += 1; why.push({w:1,k:'drink',n:item.n}); }
    return {s:s, why:why};
  }
  if(has(main,'soft') && has(item,'crunchy')){ s += 3; why.push({w:3,k:'crunch',n:item.n}); }
  if(has(main,'crunchy') && has(item,'soft')) s += 1;
  if(!has(main,'protein') && has(item,'protein')){ s += 3; why.push({w:3,k:'protein',n:item.n}); }
  if(has(main,'hearty') && has(item,'light')){ s += 2; why.push({w:2,k:'light',n:item.n}); }
  if(has(main,'hearty') && has(item,'hearty')) s -= 3;
  if(has(main,'messy') && has(item,'messy')) s -= 3;
  if(has(main,'savory') && has(item,'tangy')){ s += 2; why.push({w:2,k:'tangy',n:item.n}); }
  if(has(main,'salty') && has(item,'juicy')){ s += 2; why.push({w:2,k:'juicy',n:item.n}); }
  if(has(main,'sweet') && has(item,'sweet')) s -= 2;
  if(cat==='sweet'){
    if(has(main,'sweet')) s -= 2;
    if(has(item,'light') && has(main,'hearty')){ s += 1; why.push({w:1,k:'finish',n:item.n}); }
    if(has(item,'hearty') && has(main,'hearty')) s -= 2;
  }
  if(cat==='fruit' && has(item,'juicy') && !has(main,'messy')){ s += 1; why.push({w:1,k:'fresh',n:item.n}); }
  return {s:s, why:why};
}
var NOTE = {
  crunch: function(n){ return '<b>'+esc(n)+'</b> gives it some crunch against a soft main.'; },
  protein:function(n){ return '<b>'+esc(n)+'</b> carries the protein so the meal holds until 3pm.'; },
  light:  function(n){ return '<b>'+esc(n)+'</b> keeps it from being too heavy.'; },
  tangy:  function(n){ return '<b>'+esc(n)+'</b> cuts through the savory main.'; },
  juicy:  function(n){ return '<b>'+esc(n)+'</b> balances the salt.'; },
  fresh:  function(n){ return '<b>'+esc(n)+'</b> freshens up the box.'; },
  finish: function(n){ return '<b>'+esc(n)+'</b> is a light finish after a filling main.'; },

function dayNote(kid, day){
  var main = foodById(kid, day.slots.main);
  if(!main) return '';
  var all = [];
  catsFor(kid).forEach(function(c){
    if(c.k === 'main') return;
    all = all.concat(pairScore(main, foodById(kid, day.slots[c.k]), c.k).why);
  });
  all.sort(function(a,b){ return b.w-a.w; });
  var usedKey = nullMap(), usedName = nullMap(), out = [];
  for(var i=0;i<all.length && out.length<2;i++){
    if(usedKey[all[i].k] || usedName[all[i].n]) continue;
    usedKey[all[i].k] = 1; usedName[all[i].n] = 1;
    out.push(NOTE[all[i].k](all[i].n));
  }
  return out.length ? out.join(' ') : 'Straightforward box &mdash; nothing fights, nothing wilts.';
}
function dayFlags(kid, day){
  var items = catsFor(kid).map(function(c){ return foodById(kid, day.slots[c.k]); }).filter(Boolean);
  var f = [];
  if(items.some(function(i){ return has(i,'ice'); })) f.push({t:'Ice pack', cls:''});
  if(items.some(function(i){ return has(i,'messy'); })) f.push({t:'Sealed container', cls:''});

/* ------------------------------------------------------- first-run seeding
   The onboarding answers pick how wide a starting list to build. A stranger
   should never face an empty app: three taps have to produce a planned week. */
var BREADTH = {
  variety:{n:{main:14,side:14,fruit:10,sweet:10,snack:8,drink:3}, easyOnly:false},
  some:   {n:{main:8, side:9, fruit:7, sweet:7, snack:5,drink:2}, easyOnly:false},
  picky:  {n:{main:5, side:5, fruit:4, sweet:4, snack:3,drink:2}, easyOnly:true}

function seedCategory(kid, catKey, n, easyOnly){
  var pool = BANK.filter(function(b){ return b.c===catKey && !violation(kid,b) && (!easyOnly || b.e); });
  if(easyOnly && pool.length < n)                    /* too strict to fill a week — widen */
    pool = BANK.filter(function(b){ return b.c===catKey && !violation(kid,b); });
  var ordered = shuffled(pool.filter(function(b){ return b.s; }))
    .concat(shuffled(pool.filter(function(b){ return !b.s; })));
  var added = 0;
  ordered.slice(0, n).forEach(function(b){
    if(foodsOf(kid).some(function(f){ return normKey(f.n)===normKey(b.n); })) return;
    kid.foods.push(newFood(kid, b)); added++;
  });
  if(added) touch(kid);
  return added;
}
function seedLibrary(kid, breadth){
  var cfg = BREADTH[breadth] || BREADTH.some, added = 0;
  catsFor(kid).forEach(function(c){ added += seedCategory(kid, c.k, cfg.n[c.k], cfg.easyOnly); });
  touch(kid);
  return added;
}

/* ------------------------------------------------------ week generation */
function shuffled(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* ---------------------------------------------------------- eat history
   The retention mechanic. After a pack day the parent records, per compartment,
   whether it was eaten, partly eaten, or came home. Outcomes are stored against
   the FOOD, not the slot, so they survive re-plans. The draw then leans toward
   foods that get eaten and rests anything that came home twice running — for
   three weeks, after which it quietly returns. No model, no server: a weighted
   shuffle over a six-outcome recency window. */
var EAT_IDX = nullMap();                              /* kid.id -> foodId -> outcomes, newest first; reset on save */
function eatHistory(kid, foodId){
  var idx = EAT_IDX[kid.id];
  if(!idx){
    idx = EAT_IDX[kid.id] = nullMap();
    var eaten = kid.eaten || {};
    Object.keys(eaten).sort().reverse().forEach(function(d){
      var row = eaten[d]; if(!row || row.skipped) return;
      ALL_CATS.forEach(function(c){
        var e = row[c.k]; if(!e || !e.foodId) return;
        (idx[e.foodId] = idx[e.foodId] || []).push({d:d, r:e.r});
      });
    });
  }
  return idx[foodId] || [];
}
function eatStats(kid, foodId){
  var h = eatHistory(kid, foodId).slice(0, 6);
  if(!h.length) return {n:0, score:0.6, streakLeft:0, resting:false, last:null};
  var w = 0, sum = 0;
  h.forEach(function(e, i){ var wt = Math.pow(0.75, i); w += wt; sum += wt * (e.r==='ate' ? 1 : e.r==='some' ? 0.5 : 0); });
  var streak = 0;
  for(var i=0; i<h.length; i++){ if(h[i].r === 'left') streak++; else break; }
  var daysAgo = Math.round((today() - parseISO(h[0].d)) / 86400000);
  return {n:h.length, score:sum / w, streakLeft:streak, resting:(streak >= 2 && daysAgo < 21), last:h[0].r};
}
function eatLabel(kid, foodId){
  var st = eatStats(kid, foodId);
  if(!st.n) return '';
  if(st.resting){
    var back = addDays(parseISO(eatHistory(kid, foodId)[0].d), 21);
    return 'came home '+(st.streakLeft===2 ? 'twice' : st.streakLeft+' times')+' \u2014 taking a break until '+MON[back.getMonth()]+' '+back.getDate();
  }
  if(st.last === 'ate') return (st.n > 1 && st.score > 0.8) ? 'eats it' : 'ate it last time';
  if(st.last === 'some') return 'ate some last time';
  return 'came home last time';
}
function weightedShuffle(kid, arr){
  return arr.map(function(f){ var wt = 0.3 + eatStats(kid, f.id).score; return {f:f, k:Math.pow(Math.random(), 1/wt)}; })
    .sort(function(a,b){ return b.k - a.k; }).map(function(x){ return x.f; });
}
function findDay(kid, dStr){
  var all = (kid.past || []).concat(kid.week ? kid.week.days : []);
  return all.filter(function(d){ return d.d === dStr; })[0] || null;
}
function reviewComplete(kid, d){
  var row = (kid.eaten || {})[d.d];
  if(!row) return false;
  if(row.skipped) return true;
  return ALL_CATS.every(function(c){ return !foodById(kid, d.slots[c.k]) || !!row[c.k]; });
}
/* A day is worth asking about if something was ticked into the bag, or if the

   interrogation about Thursday. */
function packedEvidence(kid, d){
  var row = (kid.packed || {})[d.d];
  if(row && Object.keys(row).length) return true;
  var live = kid.week && kid.week.days.some(function(x){ return x.d === d.d; });
  if(!live) return true;                               /* archived days came from an earlier week */
  var created = kid.week.createdAt ? String(kid.week.createdAt).slice(0,10) : null;
  return !created || created <= d.d;
}
function reviewDay(kid){
  var t = iso(today()), floor = iso(addDays(today(), -7));
  var cands = (kid.past || []).concat(kid.week ? kid.week.days : []).filter(function(d){
    return d.d < t && d.d >= floor && packedEvidence(kid, d) && ALL_CATS.some(function(c){ return foodById(kid, d.slots[c.k]); });
  });
  if(!cands.length) return null;
  cands.sort(function(a,b){ return b.d.localeCompare(a.d); });

/* was this day's review answered today? then its summary earns a line on screen */
function reviewedToday(kid, d){
  var row = (kid.eaten || {})[d.d]; if(!row) return false;
  var stamps = row.skipped ? [row.at] : ALL_CATS.map(function(c){ return row[c.k] && row[c.k].at; });

  if(row.skipped) summary = 'skipped';
  else {
    var answered = 0, out = [];
    ALL_CATS.forEach(function(c){
      var e = row[c.k], f = e && foodById(kid, e.foodId); if(!e || !f) return;
      answered++;

function draw(kid, pool, n, exclude){
  var avail = pool.filter(function(f){ return exclude.indexOf(f.id)<0; });
  var awake = avail.filter(function(f){ return !eatStats(kid, f.id).resting; });
  if(awake.length >= n) avail = awake;                 /* rest the repeat offenders when we can afford to */
  var out = [], bag = weightedShuffle(kid, avail);
  while(out.length < n){
    if(!bag.length){ bag = weightedShuffle(kid, avail.length ? avail : pool); if(!bag.length) break; }
    out.push(bag.shift());
  }
  return out;
}
function permutations(arr){
  if(arr.length<=1) return [arr.slice()];
  var out = [];
  for(var i=0;i<arr.length;i++){
    var rest = arr.slice(0,i).concat(arr.slice(i+1));
    permutations(rest).forEach(function(p){ out.push([arr[i]].concat(p)); });
  }
  return out;
}
function bestAssignment(mains, items, cat){
  if(!items.length) return [];
  if(items.length<=6){
    var best = items, bestScore = -1e9;
    permutations(items).forEach(function(p){
      var sc = 0;
      for(var i=0;i<mains.length;i++) sc += pairScore(mains[i], p[i], cat).s;
      if(sc > bestScore){ bestScore = sc; best = p; }
    });
    return best;
  }
  var pool = items.slice(), res = [];
  mains.forEach(function(m){
    var bi = 0, bs = -1e9;
    pool.forEach(function(it,i){ var sc = pairScore(m,it,cat).s; if(sc>bs){ bs=sc; bi=i; } });
    res.push(pool.splice(bi,1)[0]);
  });
  return res;
}
function packDaysSorted(kid){
  return kid.settings.days.slice().sort(function(a,b){ return ((a+6)%7)-((b+6)%7); });
}
/* Where a NEW plan goes: this week while at least two pack days are still
   ahead (Thursday night still gets Thursday and Friday), otherwise next week.
   A plan that already exists is re-drawn in place until its last day is gone. */
function anchorWeek(kid){
  var t = iso(today()), ws = weekStart(today()), days = packDaysSorted(kid);
  if(!days.length) return ws;
  /* today counts: the box is packed in the morning, so Thursday morning still gets Thursday and Friday */
  var ahead = days.filter(function(dw){ return iso(addDays(ws, (dw+6)%7)) >= t; }).length;
  return ahead >= 2 ? ws : addDays(ws, 7);
}
/* After any change to a lunchbox's rules, sweep the plan on screen: a food that
   now breaks a rule leaves the box — locked, kid-picked or not — and the
   compartment is drawn again. Returns how many compartments changed. */
function enforceRules(kid){
  if(!kid.week) return 0;
  var hit = {}, n = 0;
  kid.week.days.forEach(function(d){
    catsFor(kid).forEach(function(c){
      var f = foodById(kid, d.slots[c.k]);
      if(f && violation(kid, f)){
        d.slots[c.k] = null; d.lock[c.k] = false; if(d.kidPick) delete d.kidPick[c.k];
        hit[c.k] = 1; n++;
      }
    });
  });
  var empty = 0;
  Object.keys(hit).forEach(function(k){ if(!fillCategory(kid, kid.week, catByKey(k))) empty++; });
  if(n){ touch(kid.week); }
  return {n:n, empty:empty};
}
function rulesChanged(kid){
  var r = enforceRules(kid); if(!r.n) return;
  var who = kids().length > 1 ? (kid.name || 'Lunchbox')+': ' : '';
  toast(who + r.n + (r.n===1 ? ' compartment broke the rules' : ' compartments broke the rules')
    + (r.empty ? ' \u2014 nothing else fits, check Foods' : ' \u2014 drawn again'));
}
/* Fill one category's empty days across a week: draw, then arrange against each
   day's main. Used by the weekly plan and by Setup when a slot is switched on
   mid-week. Returns false only when there was nothing to draw from. */
function fillCategory(kid, week, c){
  var pool = eligible(kid, c.k), t0 = iso(today());
  var open = week.days.filter(function(d){ return !d.slots[c.k] && d.d >= t0; });
  if(!open.length) return true;
  if(!pool.length) return false;
  var locked = week.days.filter(function(d){ return d.slots[c.k]; }).map(function(d){ return d.slots[c.k]; });
  var picks = draw(kid, pool, open.length, locked);
  if(c.k === 'main'){
    open.forEach(function(d,i){ d.slots.main = picks[i] ? picks[i].id : null; });
  } else {
    var mains = open.map(function(d){ return foodById(kid, d.slots.main); });
    var arranged = bestAssignment(mains, picks, c.k);
    open.forEach(function(d,i){ d.slots[c.k] = arranged[i] ? arranged[i].id : null; });
  }
  return true;
}
function archiveWeek(kid){
  if(!kid.week) return;
  var kept = kid.week.days.filter(function(d){ return ALL_CATS.some(function(c){ return d.slots[c.k]; }); })
    .map(function(d){ return {d:d.d, dow:d.dow, slots:Object.assign({}, d.slots), kidPick:Object.assign({}, d.kidPick || {})}; });
  kid.past = (kid.past || []).concat(kept).slice(-40);
}
function planWeek(kid){
  var days = packDaysSorted(kid);

  var ws = (kid.week && !weekIsStale(kid)) ? parseISO(kid.week.start) : anchorWeek(kid);
  var prev = kid.week && kid.week.start === iso(ws) ? kid.week : null;
  var t0 = iso(today());
  /* a brand-new plan started mid-week only covers the days still to come; an
     in-place re-draw keeps the days already gone exactly as they were packed */
  days = days.filter(function(dw){
    var d = iso(addDays(ws, (dw+6)%7));
    return d >= t0 || (prev && prev.days.some(function(x){ return x.d === d; }));
  });
  if(kid.week && !prev) archiveWeek(kid);               /* a new week: keep the old one's days for the eat review */
  var week = {id:(prev && prev.id) || uid('week'), kidId:kid.id, start:iso(ws), createdAt:(prev && prev.createdAt) || now(), updatedAt:now(), days:[]};
  days.forEach(function(dw){
    var d = iso(addDays(ws, (dw+6)%7));
    var old = prev ? prev.days.filter(function(x){ return x.d===d; })[0] : null;
    var slots = old ? Object.assign({}, old.slots) : {}, lock = old ? Object.assign({}, old.lock) : {};
    catsFor(kid).forEach(function(c){ if(!(c.k in slots)) slots[c.k] = null; if(!(c.k in lock)) lock[c.k] = false; });
    week.days.push({d:d, dow:dw, slots:slots, lock:lock, kidPick: old ? Object.assign({}, old.kidPick || {}) : {}});
  });
  week.days.forEach(function(day){
    if(day.d < t0) return;                             /* already packed: not ours to change */
    catsFor(kid).forEach(function(c){ if(!day.lock[c.k] || !foodById(kid, day.slots[c.k])) day.slots[c.k] = null; });
  });
  var shortfall = [];
  catsFor(kid).forEach(function(c){ if(!fillCategory(kid, week, c)) shortfall.push(c.plural); });
  kid.week = week;
  prune(kid, ws);
  touch(kid); save();
  return shortfall;
}
/* Keep the document bounded: packed ticks before this week, eat outcomes older
   than a year, and tombstones older than ninety days are never read again. */
function prune(kid, ws){
  var floorPacked = iso(ws), floorEaten = iso(addDays(today(), -365)), floorTomb = addDays(today(), -90).getTime();
  Object.keys(kid.packed || {}).forEach(function(d){ if(d < floorPacked) delete kid.packed[d]; });
  Object.keys(kid.eaten || {}).forEach(function(d){ if(d < floorEaten) delete kid.eaten[d]; });
  kid.foods = kid.foods.filter(function(f){ return !f.deletedAt || new Date(f.deletedAt).getTime() > floorTomb; });
}
function planAll(){
  var short = {};
  kids().forEach(function(k){
    if(!foodsOf(k).length) return;
    planWeek(k).forEach(function(c){ short[c] = 1; });
  });
  return Object.keys(short);
}
/* Leave resting foods out whenever the list can afford it — the same rule the
   weekly draw applies, so a single re-draw or the kid's options never bring
   back what came home twice. */
function awake(kid, pool){
  var up = pool.filter(function(f){ return !eatStats(kid, f.id).resting; });
  return up.length ? up : pool;
}
function reshuffleSlot(kid, day, cat){
  var pool = eligible(kid, cat);
  var main = foodById(kid, day.slots.main);
  var elsewhere = kid.week.days.filter(function(x){ return x.d!==day.d; }).map(function(x){ return x.slots[cat]; });
  var fresh = pool.filter(function(f){ return f.id!==day.slots[cat] && elsewhere.indexOf(f.id)<0; });
  var choices = awake(kid, fresh.length ? fresh : pool.filter(function(f){ return f.id!==day.slots[cat]; }));
  if(!choices.length) return false;
  if(cat==='main'){ day.slots.main = weightedShuffle(kid, choices)[0].id; }
  else {
    /* a re-draw is a draw: pairing and eat history rank it, a little chance keeps it fresh */
    var scored = choices.map(function(f){ return {f:f, s:pairScore(main,f,cat).s + eatStats(kid, f.id).score*2 + Math.random()*1.5}; });
    scored.sort(function(a,b){ return b.s-a.s; });
    day.slots[cat] = scored[0].f.id;
  }
  day.lock[cat] = false;                               /* re-drawn on purpose: no longer "kept" */
  if(day.kidPick) delete day.kidPick[cat];
  touch(kid.week); touch(kid); save();
  return true;
}

/* ------------------------------------------------------------ kid's pick
   Bounded choice: the parent has already set the rules and drawn the box; the
   child sees two parent-approved options per compartment and taps one. Option A
   is what the draw picked, option B is the next-best match against that day's
   main. Main is asked first so the later pairings score against what the kid
   actually chose. Nothing the child can tap has ever been outside the rules. */
function kidOptions(kid, day, cat, chosen){
  var pool = eligible(kid, cat);
  var elsewhere = kid.week.days.filter(function(x){ return x.d!==day.d; }).map(function(x){ return x.slots[cat]; });
  pool = pool.filter(function(f){ return elsewhere.indexOf(f.id)<0; });
  if(pool.length < 2) pool = eligible(kid, cat);            /* short list: allow repeats over a gap */
  var mainId = chosen.main || day.slots.main;
  var main = foodById(kid, mainId);
  var planned = pool.filter(function(f){ return f.id === day.slots[cat]; })[0] || null;
  var rest = awake(kid, pool.filter(function(f){ return !planned || f.id !== planned.id; }));
  /* option B is deterministic: pairing score, then eat history, then list order */
  rest = rest.map(function(f, i){
      var base = cat === 'main' ? 0 : pairScore(main, f, cat).s;
      return {f:f, s: base + eatStats(kid, f.id).score * 2, i:i};
    }).sort(function(a,b){ return (b.s-a.s) || (a.i-b.i); }).map(function(x){ return x.f; });
  var out = planned ? [planned] : [];
  while(out.length < 2 && rest.length) out.push(rest.shift());
  return out;
}
function startKidPick(kidId, dayStr){
  var kid = kidById(kidId); if(!kid || !kid.week) return;
  var day = kid.week.days.filter(function(d){ return d.d===dayStr; })[0]; if(!day) return;
  UI.kid = {kidId:kidId, d:dayStr, step:0, chosen:{}, options:{}};
  kidAdvance(kid, day);
  if(UI.kid.step >= catsFor(kid).length){ UI.kid = null; toast('Nothing to choose from yet'); return; }
  render();
}
function kidChoose(foodId){
  var st = UI.kid; if(!st) return;
  var kid = kidById(st.kidId), day = kid.week.days.filter(function(d){ return d.d===st.d; })[0];
  var cats = catsFor(kid), cat = cats[st.step].k;
  st.chosen[cat] = foodId;
  if(foodId && foodById(kid, foodId)){
    /* commit now: a choice already made must survive the parent tapping Stop */
    day.slots[cat] = foodId;
    day.lock[cat] = true;                                    /* a choice the kid made survives a shuffle */
    day.kidPick = day.kidPick || {};
    day.kidPick[cat] = {at:now(), by:(deviceMember()||{}).id || null, picker:'kid'};
    touch(kid.week); touch(kid); save();
  }
  st.step++;
  kidAdvance(kid, day);
  render();
}
/* move to the next compartment that actually has something to choose; skip the rest */
function kidAdvance(kid, day){
  var st = UI.kid, cats = catsFor(kid);
  while(st.step < cats.length){
    var next = cats[st.step].k;
    st.options[next] = kidOptions(kid, day, next, st.chosen);
    if(st.options[next].length) return;
    st.chosen[next] = day.slots[next] || null;
    st.step++;
  }
}

/* --------------------------------------------- household-wide roll-ups */
function upcomingDates(){
  var map = {};
  kids().forEach(function(k){
    if(!k.week) return;
    k.week.days.forEach(function(d){ (map[d.d] = map[d.d] || []).push({kid:k, day:d}); });
  });
  return Object.keys(map).sort().map(function(d){ return {date:d, entries:map[d]}; });
}
function shoppingList(){
  var rows = nullMap();
  kids().forEach(function(k){
    if(!k.week) return;
    var t0 = iso(today());
    k.week.days.forEach(function(d){
      if(d.d < t0) return;                              /* already packed; nothing left to buy for it */
      catsFor(k).forEach(function(c){
        var f = foodById(k, d.slots[c.k]); if(!f) return;
        var key = normKey(f.n);
        var r = rows[key] || (rows[key] = {key:key, name:f.n, aisle:f.a||'other', qty:0, forKids:[]});
        r.qty++;
        if(r.forKids.indexOf(k.name)<0) r.forKids.push(k.name);
      });
    });
  });
  var order = {}; AISLES.forEach(function(a,i){ order[a]=i; });
  return Object.keys(rows).map(function(k){
    var r = rows[k]; r.have = !!(own(S.pantry, k) && S.pantry[k].have); return r;
  }).sort(function(a,b){
    return (order[a.aisle]-order[b.aisle]) || a.name.localeCompare(b.name);
  });
}
function weekIsStale(kid){
  if(!kid.week || !kid.week.days.length) return false;
  var last = kid.week.days.map(function(d){ return d.d; }).sort().pop();
  return last < iso(today());                          /* every pack day of that plan has gone by */
}
function anyStale(){ return kids().some(weekIsStale); }

function slotSheet(kidId, dayStr, cat){
  var kid = kidById(kidId); if(!kid || !kid.week) return;
  var day = kid.week.days.filter(function(d){ return d.d===dayStr; })[0]; if(!day) return;
  var c = ALL_CATS.filter(function(x){ return x.k===cat; })[0];
  var pool = foodsOf(kid).filter(function(f){ return f.c===cat; });
  var main = foodById(kid, day.slots.main);
  var h = '<div class="row" style="gap:8px;flex-wrap:wrap">'
    + '<button class="btn sm" data-act="sheet-shuffle" data-kid="'+esc(kid.id)+'" data-day="'+esc(dayStr)+'" data-cat="'+cat+'">'
    + svg('dice',15)+'Re-draw this one</button>'
    + '<button class="tg" data-act="sheet-lock" data-kid="'+esc(kid.id)+'" data-day="'+esc(dayStr)+'" data-cat="'+cat+'"'
    + ' aria-pressed="'+(!!day.lock[cat])+'">'+svg('lock',15)+'Don&#8217;t change this one</button></div>';
  if(!pool.length){
    h += '<div class="empty"><p>No '+esc(c.plural.toLowerCase())+' in the list yet.</p></div>';
  } else {
    h += '<div class="list">';
    pool.forEach(function(f){
      var v = violation(kid, f);
      var sc = cat==='main' ? null : pairScore(main, f, cat).s;
      var meta = v ? 'skipped — '+v : (eatLabel(kid, f.id) || (sc!==null && sc>=3 ? 'goes well with '+(main?main.n:'the main') : ''));
      h += '<button class="item'+(day.slots[cat]===f.id?' done':'')+'" data-act="pick" data-kid="'+esc(kid.id)
        +  '" data-day="'+esc(dayStr)+'" data-cat="'+cat+'" data-id="'+esc(f.id)+'">'
        +  '<span class="box">'+svg('check',12)+'</span><span class="grow"><span class="nm">'+esc(f.n)+'</span>'
        +  '<span class="meta"'+(v?' style="color:var(--warn)"':(sc!==null&&sc>=3?' style="color:var(--accent)"':''))
        +  '>'+esc(meta)+'</span></span></button>';
    });
    h += '</div>';
  }
  openSheet(dayLabel(dayStr).full+' · '+c.label, h);
}

function parseImport(text){
  var doc = null;
  try{ doc = JSON.parse(text); }catch(e){ return null; }
  if(!doc || typeof doc !== 'object') return null;
  var body = ((doc.app === 'lunchsorted' || doc.app === 'fiveboxes' || doc.app === 'lunchbox-tin') && doc.account) ? doc.account : doc;
  try{
    if(isAccount(body)) return normalizeAccount(body);
    if(isLegacy(body)) return normalizeAccount(migrate(Object.assign({}, body, {schema:1})));
  }catch(e){ return null; }
  return null;
}
function isLegacy(d){ return !!(d && Array.isArray(d.foods) && d.settings && typeof d.settings === 'object'); }
function exportText(){
  return JSON.stringify({app:'lunchsorted', schema:SCHEMA, exportedAt:now(), account:S}, null, 2);
}

    document.getElementById('who').innerHTML = '';

  }
  document.getElementById('tabs').style.display = '';
  document.querySelector('.topbar').style.display = '';
  document.getElementById('view').innerHTML =
      UI.tab==='pack'  ? viewPack()
    : UI.tab==='week'  ? viewWeek()

      + svg(t.icon)+'<span>'+t.label+'</span></button>'; }).join('');

      ? '<button class="kidbtn" data-act="kidsheet">'+kids().length+' lunchboxes<span class="caret">&#9662;</span></button>'
      : '<button class="kidbtn" data-act="kidsheet"><span class="dot" style="background:'+hueVar(kid)+'"></span>'
        + esc(kid.name)+'<span class="caret">&#9662;</span></button>';
}

/* ---------------------------------------------------------------- events */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act],[data-nf]');
  if(!el || !S) return;

  var nf = el.getAttribute('data-nf');
  if(nf){
    if(nf==='cat'){
      el.parentNode.querySelectorAll('.tg').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
      el.setAttribute('aria-pressed','true');
    } else el.setAttribute('aria-pressed', el.getAttribute('aria-pressed')==='true' ? 'false' : 'true');
    return;
  }
  var act = el.getAttribute('data-act');
  var kid = activeKid();
  if(act!=='clear-all' && act!=='del-kid' && act!=='clear-week' && act!=='disarm' && UI.armed) UI.armed = '';

  /* did they eat it? */
  if(act==='eat-set' || act==='eat-all' || act==='eat-skip'){
    var ek = kidById(el.getAttribute('data-kid')), ed = ek && findDay(ek, el.getAttribute('data-day'));
    if(!ek || !ed) return;
    ek.eaten = ek.eaten || {};
    var row = ek.eaten[ed.d] = (ek.eaten[ed.d] && !ek.eaten[ed.d].skipped) ? ek.eaten[ed.d] : {};
    var me = (deviceMember() || {}).id || null;
    if(act==='eat-skip'){ ek.eaten[ed.d] = {skipped:true, at:now(), by:me}; }
    else if(act==='eat-all'){
      ALL_CATS.forEach(function(c){ if(foodById(ek, ed.slots[c.k])) row[c.k] = {foodId:ed.slots[c.k], r:'ate', at:now(), by:me}; });
    } else {
      var ec = el.getAttribute('data-cat');
      row[ec] = {foodId:ed.slots[ec], r:el.getAttribute('data-r'), at:now(), by:me};
    }
    touch(ek); save();
    if(reviewComplete(ek, ed)) delete UI.reviewEdit[ek.id];
    render();
    if(act!=='eat-skip' && reviewComplete(ek, ed)) toast('Noted — the next draw learns from it');
    return;
  }
  if(act==='eat-change'){
    var ck = kidById(el.getAttribute('data-kid')); if(!ck) return;
    UI.reviewEdit[ck.id] = el.getAttribute('data-day'); render(); return;
  }

  /* kid's pick */
  if(act==='kid-start'){ startKidPick(el.getAttribute('data-kid'), el.getAttribute('data-day')); window.scrollTo(0,0); return; }
  if(act==='kid-pick'){ kidChoose(el.getAttribute('data-id')); return; }
  if(act==='kid-exit'){ UI.kid = null; render(); toast('Handed back'); return; }

  /* first run */
  /* the chips flip in place: a re-render would throw away the name field's focus and keyboard */
  if(act==='ob-heat'){ UI.ob.heat = el.getAttribute('data-v')==='hot'; obPress(el, true); return; }
  if(act==='ob-avoid'){
    var av = el.getAttribute('data-v'), ai = UI.ob.avoid.indexOf(av);
    if(ai>-1) UI.ob.avoid.splice(ai,1); else UI.ob.avoid.push(av);
    obPress(el, false); return;
  }
  if(act==='ob-breadth'){ UI.ob.breadth = el.getAttribute('data-v'); obPress(el, true); return; }
  if(act==='ob-go'){
    var obn = document.getElementById('obName'); if(obn && obn.value.trim()) kid.name = obn.value.trim().slice(0,40);
    kid.settings.noHeat = !UI.ob.heat;
    kid.settings.avoidAllergens = UI.ob.avoid.slice();
    touch(kid.settings);
    seedLibrary(kid, UI.ob.breadth);
    planWeek(kid);
    S.onboardedAt = now(); UI.tab = 'week';
    save(); render(); window.scrollTo(0,0);
    toast('Your week is ready'); return;
  }
  if(act==='ob-skip'){
    var obn2 = document.getElementById('obName'); if(obn2 && obn2.value.trim()) kid.name = obn2.value.trim().slice(0,40);
    kid.settings.noHeat = !UI.ob.heat;
    kid.settings.avoidAllergens = UI.ob.avoid.slice();
    touch(kid.settings);
    S.onboardedAt = now(); UI.tab = 'foods';
    save(); render(); window.scrollTo(0,0); return;
  }

  /* navigation */
  if(act==='tab'){ UI.tab = el.getAttribute('data-tab'); render(); window.scrollTo(0,0); return; }
  if(act==='go-foods'){ UI.tab='foods'; render(); window.scrollTo(0,0); return; }
  if(act==='go-kid-foods'){ S.activeKidId = el.getAttribute('data-id'); UI.tab='foods'; save(); render(); window.scrollTo(0,0); return; }
  if(act==='go-week'){ UI.tab='week'; render(); window.scrollTo(0,0); return; }
  if(act==='kidsheet'){ kidSheet(); return; }

  /* lunchbox profiles */
  if(act==='pick-kid'){
    S.activeKidId = el.getAttribute('data-id'); save();
    if(el.getAttribute('data-close')) closeSheet();
    render(); return;
  }
  if(act==='add-kid'){ addKidSheet(); return; }
  if(act==='save-kid'){
    var nk = document.getElementById('nkName');
    var name = (nk.value||'').trim().slice(0,40);
    if(!name){ nk.focus(); toast('Give the lunchbox a name'); return; }
    var k = newKid(name, S.kids.length % KID_HUES.length);
    S.kids.push(k); S.activeKidId = k.id; UI.tab='foods';
    save(); closeSheet(); render(); toast(name+' added'); return;
  }
  if(act==='del-kid'){
    var id = el.getAttribute('data-id'), k2 = kidById(id);
    if(!k2 || kids().length<2) return;
    if(UI.armed!=='kid:'+id){ UI.armed = 'kid:'+id; render(); toast('That removes '+k2.name+' and their foods'); return; }
    k2.deletedAt = now(); touch(k2); UI.armed='';
    if(S.activeKidId===id) S.activeKidId = (kids()[0]||{}).id;
    save(); render(); toast(k2.name+' removed'); return;
  }

  /* planning */
  if(act==='plan-kid'){
    var short = planWeek(kid); render();
    toast(short.length ? 'No '+short.join(' or ').toLowerCase()+' available — check Foods' : 'Week drawn');
    return;
  }
  if(act==='plan-all'){
    var short2 = planAll(); render();
    toast(short2.length ? 'No '+short2.join(' or ').toLowerCase()+' available — check Foods' : 'Weeks drawn');
    return;
  }
  if(act==='shuffle-day'){
    var k3 = kidById(el.getAttribute('data-kid')) || kid;
    var d = k3.week.days.filter(function(x){ return x.d===el.getAttribute('data-day'); })[0];
    if(d){ catsFor(k3).forEach(function(c){ if(!d.lock[c.k]) reshuffleSlot(k3, d, c.k); }); render(); }
    return;
  }
  if(act==='slot'){ slotSheet(el.getAttribute('data-kid'), el.getAttribute('data-day'), el.getAttribute('data-cat')); return; }
  if(act==='sheet-shuffle'){
    var k4 = kidById(el.getAttribute('data-kid')), cat = el.getAttribute('data-cat');
    var day4 = k4.week.days.filter(function(x){ return x.d===el.getAttribute('data-day'); })[0];
    var wasKept = !!(day4.lock[cat] || (day4.kidPick && day4.kidPick[cat]));
    if(reshuffleSlot(k4, day4, cat)){ slotSheet(k4.id, day4.d, cat); render(); if(wasKept) toast('Re-drawn \u2014 it is no longer kept'); }
    else toast('Nothing else in that category');
    return;
  }
  if(act==='sheet-lock'){
    var k5 = kidById(el.getAttribute('data-kid')), cat5 = el.getAttribute('data-cat');
    var day5 = k5.week.days.filter(function(x){ return x.d===el.getAttribute('data-day'); })[0];
    day5.lock[cat5] = !day5.lock[cat5]; touch(k5.week); touch(k5); save();
    el.setAttribute('aria-pressed', day5.lock[cat5]); render(); return;
  }
  if(act==='pick'){
    var k6 = kidById(el.getAttribute('data-kid'));
    var day6 = k6.week.days.filter(function(x){ return x.d===el.getAttribute('data-day'); })[0];
    var cat6 = el.getAttribute('data-cat');
    if(day6.slots[cat6] !== el.getAttribute('data-id') && day6.kidPick) delete day6.kidPick[cat6];
    day6.slots[cat6] = el.getAttribute('data-id');
    touch(k6.week); touch(k6); save(); closeSheet(); render(); return;
  }

  /* packing */
  if(act==='toggle'){
    var k7 = kidById(el.getAttribute('data-kid')), dt = el.getAttribute('data-day'), c7 = el.getAttribute('data-cat');
    if(!k7 || !k7.week) return;
    var day7 = k7.week.days.filter(function(x){ return x.d===dt; })[0];
    if(!day7 || !foodById(k7, day7.slots[c7])) return;
    var row = k7.packed[dt] = k7.packed[dt] || {};
    if(row[c7]) delete row[c7];
    else row[c7] = {at:now(), by:(deviceMember()||{}).id || null};
    touch(k7); save(); render(); return;
  }

  /* shopping */
  if(act==='have'){
    var key = el.getAttribute('data-key');
    if(own(S.pantry, key) && S.pantry[key].have) delete S.pantry[key];
    else S.pantry[key] = {have:true, at:now(), by:(deviceMember()||{}).id || null};
    save(); render(); return;
  }
  if(act==='copy-list'){
    var txt = shoppingList().filter(function(r){ return !r.have; })
      .map(function(r){ return '- '+r.name+(r.qty>1?' x'+r.qty:''); }).join('\n');
    if(!txt){ toast('Nothing left to buy'); return; }
    copy('Lunch shopping list\n'+txt, 'List copied'); return;
  }

  /* foods */
  if(act==='ideas'){ ideasSheet(); return; }
  if(act==='add-idea'){
    var b = BANK.filter(function(x){ return x.n===el.getAttribute('data-name'); })[0];
    if(!b) return;
    if(foodsOf(kid).some(function(f){ return normKey(f.n)===normKey(b.n); })){ toast('Already on the list'); return; }
    kid.foods.push(newFood(kid, b)); touch(kid); save(); ideasSheet(); render(); toast(b.n+' added'); return;
  }
  if(act==='seed'){
    var added = seedLibrary(kid, 'some');
    planWeek(kid); UI.tab = 'week';
    save(); render(); window.scrollTo(0,0); toast(added+' foods added and the week drawn'); return;
  }
  if(act==='add-own'){ addOwnSheet(); return; }
  if(act==='save-own'){
    var el2 = document.getElementById('nfName'), n = (el2.value||'').trim();
    if(!n){ el2.focus(); toast('Give it a name first'); return; }
    kid.foods.push(newFood(kid, {
      n:n,
      c:document.querySelector('#nfCat .tg[aria-pressed="true"]').getAttribute('data-v'),
      a:document.getElementById('nfAisle').value,
      t:[].slice.call(document.querySelectorAll('#nfTags .tg[aria-pressed="true"]')).map(function(x){ return x.getAttribute('data-v'); }),
      al:[].slice.call(document.querySelectorAll('#nfAl .tg[aria-pressed="true"]')).map(function(x){ return x.getAttribute('data-v'); })
    }));
    touch(kid); save(); closeSheet(); render(); toast(n+' added'); return;
  }
  if(act==='del-food'){
    var f = foodById(kid, el.getAttribute('data-id')); if(!f) return;
    var wasIn = [];
    f.deletedAt = now(); touch(f);
    if(kid.week) kid.week.days.forEach(function(d){
      ALL_CATS.forEach(function(c){ if(d.slots[c.k]===f.id){ wasIn.push({d:d, c:c.k, lock:d.lock[c.k], pick:d.kidPick && d.kidPick[c.k]}); d.slots[c.k]=null; d.lock[c.k]=false; if(d.kidPick) delete d.kidPick[c.k]; } });
    });
    touch(kid); save(); render();
    var undoKid = kid;
    toast(f.n+' removed', function(){
      f.deletedAt = null; touch(f);
      wasIn.forEach(function(w){ w.d.slots[w.c] = f.id; w.d.lock[w.c] = w.lock; if(w.pick){ w.d.kidPick = w.d.kidPick || {}; w.d.kidPick[w.c] = w.pick; } });
      touch(undoKid); save(); render(); toast('Put back');
    });
    return;
  }

  /* rules */
  if(act==='day'){
    var dnum = +el.getAttribute('data-d'), i = kid.settings.days.indexOf(dnum);
    if(i>-1){ if(kid.settings.days.length===1){ toast('Keep at least one day'); return; } kid.settings.days.splice(i,1); }
    else kid.settings.days.push(dnum);
    touch(kid.settings); touch(kid); save(); render(); return;
  }
  if(act==='noheat'){ kid.settings.noHeat = !kid.settings.noHeat; touch(kid.settings); touch(kid); rulesChanged(kid); save(); render(); return; }
  if(act==='rule'){
    var rk = el.getAttribute('data-k');
    kid.settings[rk] = !kid.settings[rk]; touch(kid.settings); touch(kid); rulesChanged(kid); save(); render(); return;
  }
  if(act==='compartment'){
    var sk = el.getAttribute('data-k'), sc = catByKey(sk);
    kid.settings.slots = kid.settings.slots || {};
    var turningOn = !kid.settings.slots[sk];
    kid.settings.slots[sk] = turningOn;
    touch(kid.settings);
    if(turningOn){
      /* never hand back an empty compartment: seed a few and fill this week */
      var addedN = eligible(kid, sk).length ? 0
        : seedCategory(kid, sk, (BREADTH.some.n[sk] || 3), false);
      if(kid.week){ kid.week.days.forEach(function(d){ if(!(sk in d.slots)) d.slots[sk] = null; if(!(sk in d.lock)) d.lock[sk] = false; });
        fillCategory(kid, kid.week, sc); touch(kid.week); }
      toast(addedN ? addedN+' '+sc.plural.toLowerCase()+' added to the list' : sc.label+' compartment on');
    } else {
      if(kid.week) kid.week.days.forEach(function(d){ d.slots[sk] = null; d.lock[sk] = false; if(d.kidPick) delete d.kidPick[sk]; });
      toast(sc.label+' compartment off');
    }
    touch(kid); save(); render(); return;
  }
  if(act==='allergen'){
    var ak = el.getAttribute('data-k'), j = kid.settings.avoidAllergens.indexOf(ak);
    if(j>-1) kid.settings.avoidAllergens.splice(j,1); else kid.settings.avoidAllergens.push(ak);
    touch(kid.settings); touch(kid); rulesChanged(kid); save(); render(); return;
  }

  /* transfer + reset */
  if(act==='copy-data'){ copy(exportText(), 'Copied \u2014 paste it into the app on the other phone'); return; }
  if(act==='save-file'){
    if(!Downloads) return;
    Downloads.save({filename:'lunch-sorted-'+iso(today())+'.json', data:exportText()})
      .then(function(){ toast('Backup saved'); },
            function(err){ toast(err && err.code==='declined' ? 'Backup cancelled' : 'Could not save the file'); });
    return;
  }
  if(act==='import-open'){ importSheet(); return; }
  if(act==='import-do'){
    if(!UI.pendingImport){
      var acct0 = parseImport(document.getElementById('impText').value);
      if(!acct0){ toast('That is not Lunch Sorted data'); return; }
      UI.pendingImport = acct0;
      var names = acct0.kids.filter(function(k){ return !k.deletedAt; }).map(function(k){ return k.name; });
      el.textContent = 'Tap again to replace with ' + (names.join(' and ') || 'an empty household');
      return;
    }
    var acct = UI.pendingImport; UI.pendingImport = null;
    S = acct;
    if(!kids().length){ var k8 = newKid('Lunchbox',0); S.kids.push(k8); }
    if(!activeKid()) S.activeKidId = kids()[0].id;
    DEVICE.memberId = (members()[0]||{}).id || null;
    save(); closeSheet(); UI.tab='pack'; render();
    toast('Loaded '+kids().length+' lunchbox'+(kids().length===1?'':'es')); return;
  }
  if(act==='clear-week'){
    if(UI.armed!=='week'){ UI.armed='week'; render(); toast('That clears every lunchbox\u2019s plan for the week'); return; }
    kids().forEach(function(k){ archiveWeek(k); k.week = null; k.packed = {}; touch(k); });
    UI.armed=''; save(); render(); toast('Plans cleared'); return;
  }
  if(act==='clear-all'){
    if(UI.armed!=='all'){ UI.armed='all'; render(); toast('That erases every lunchbox on this phone'); return; }
    Store.forget();
    S = newAccount(); DEVICE.memberId = S.members[0].id; UI.armed=''; UI.tab='setup';
    save(); render(); toast('Everything erased'); return;
  }
  if(act==='disarm'){ UI.armed=''; render(); return; }
  if(act==='notice-dismiss'){ UI.notice=''; render(); return; }
  if(act==='undo'){ if(UI.undo){ var fn = UI.undo; UI.undo = null; fn(); } return; }
});

document.addEventListener('change', function(ev){
  if(!S) return;
  if(ev.target.id==='kidName' || ev.target.id==='avoidText'){
    if(ev.target.id==='avoidText'){ rulesChanged(activeKid()); save(); }
    render();
  }
});
document.addEventListener('input', function(ev){
  if(!S) return;
  var kid = activeKid();
  if(ev.target.id==='kidName'){
    kid.name = ev.target.value.slice(0,40); touch(kid); save();
    var w = document.getElementById('who');
    if(w) w.innerHTML = '<button class="kidbtn" data-act="kidsheet"><span class="dot" style="background:'+hueVar(kid)
      + '"></span>'+esc(kid.name || 'Lunchbox')+'<span class="caret">&#9662;</span></button>';
  }
  if(ev.target.id==='obName'){ UI.ob.name = ev.target.value; }
  if(ev.target.id==='avoidText'){ kid.settings.avoidText = ev.target.value.slice(0,500); touch(kid.settings); touch(kid); save(); }
  if(ev.target.id==='memberName'){
    var me = deviceMember(); if(!me) return;
    me.name = ev.target.value.slice(0,60); touch(me); save();
  }
});

function copy(text, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); },
      function(){ toast('Copy blocked by the browser'); });
  } else toast('Copy blocked by the browser');
}

/* -------------------------------------------------- optional capability */
var Downloads = null;
if(window.claude && typeof window.claude.use === 'function'){
  try{
    window.claude.use('downloads').then(function(d){
      Downloads = d || null;
      if(Downloads && UI.tab==='setup') render();
    }, function(){});
  }catch(e){}
}

/* ------------------------------------------------------------------ boot */
Store.load().then(function(r){
  var doc = null, rejected = false;
  try{
    if(r.doc) doc = normalizeAccount(isAccount(r.doc) ? r.doc : migrate(r.doc));
    if(!doc && !r.raw && isLegacy(r.legacy)) doc = normalizeAccount(migrate(Object.assign({}, r.legacy, {schema:1})));
  }catch(e){ doc = null; }
  if(!doc && (r.raw || r.unreadable)){
    /* something was saved here and we could not make sense of it: keep it, start fresh, say so */
    rejected = true;
    UI.notice = Store.backup(r.raw)
      ? 'Your saved lunches could not be read, so this is a fresh start. A copy was kept on this phone.'
      : 'Your saved lunches could not be read, so this is a fresh start.';
  }
  if(!doc) doc = newAccount();
  S = doc;
  DEVICE.memberId = (r.device && memberById(r.device)) ? r.device : members()[0].id;
  /* anyone who already has a list has effectively finished onboarding */
  if(!S.onboardedAt && kids().some(function(k){ return foodsOf(k).length; })) S.onboardedAt = now();
  try{ render(); }
  catch(e){
    /* the last line of defence: a document that renders badly must not become
       permanent, and must not be overwritten unless a copy was really kept */
    var kept = rejected || Store.backup(r.raw);
    S = newAccount(); DEVICE.memberId = S.members[0].id;
    UI.notice = 'Your saved lunches could not be shown, so this is a fresh start.' + (kept ? ' A copy was kept on this phone.' : '');
    if(!kept) rejected = true;
    render();
  }
  if(!rejected && (r.renamed || JSON.stringify(S) !== r.raw)) save();   /* an unchanged document is not rewritten on every launch */
});
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/app/sw.js').catch(function(){ /* offline support is a bonus, not a requirement */ });
  });
}
</script>
