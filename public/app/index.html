<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunch Sorted</title>
<meta name="description" content="Plan a week of packed school lunches in about a minute. Cold-lunch ideas matched into balanced boxes, with the shopping list built for you.">
<meta name="theme-color" content="#E9EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lunch Sorted">
<style>
:root{color-scheme:light dark}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#E9EEE6; --surface:#FBFCF9; --surface-2:#F1F5EE; --sunk:#DFE7DB;
  --ink:#16241E; --ink-2:#4A5C53; --ink-3:#6E7F75;
  --line:#CFDACB; --line-strong:#1E3329;
  --c-main:#2E5A48; --c-side:#8A5309; --c-fruit:#A2304C; --c-sweet:#57448A; --c-snack:#6B7A1F; --c-drink:#2B6B85;
  --scrim:rgba(8,16,13,.5); --shadow-1:0 1px 2px rgba(0,0,0,.25); --shadow-lift:0 4px 0 rgba(0,0,0,.06);
  --accent:#2E5A48; --accent-fg:#FBFCF9; --accent-soft:#DCE8DF;
  --warn:#8A5A06; --warn-soft:#F6E9CE;
  --toast-bg:#1E3329; --toast-fg:#F4F8F3;
  --r-lg:20px; --r-md:12px; --r-sm:8px;
  --f-display:"Familjen Grotesk","Trebuchet MS",sans-serif;
  --f-body:"Karla","Helvetica Neue",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1815; --surface:#17251F; --surface-2:#1E2F28; --sunk:#111C18;
    --ink:#E6EEE7; --ink-2:#A6BAAE; --ink-3:#7A8E84;
    --line:#2B3E36; --line-strong:#4E7263;
    --c-main:#79C8A2; --c-side:#E0A253; --c-fruit:#EA8299; --c-sweet:#A793DC; --c-snack:#C3CF6E; --c-drink:#7FC3DE;
    --scrim:rgba(0,0,0,.62); --shadow-1:0 0 0 1px rgba(255,255,255,.14); --shadow-lift:0 4px 0 rgba(255,255,255,.08);
    --accent:#79C8A2; --accent-fg:#0E1815; --accent-soft:#1F332A;
    --warn:#E0A253; --warn-soft:#2C2415;
    --toast-bg:#E6EEE7; --toast-fg:#0E1815;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1815; --surface:#17251F; --surface-2:#1E2F28; --sunk:#111C18;
  --ink:#E6EEE7; --ink-2:#A6BAAE; --ink-3:#7A8E84;
  --line:#2B3E36; --line-strong:#4E7263;
  --c-main:#79C8A2; --c-side:#E0A253; --c-fruit:#EA8299; --c-sweet:#A793DC; --c-snack:#C3CF6E; --c-drink:#7FC3DE;
  --scrim:rgba(0,0,0,.62); --shadow-1:0 0 0 1px rgba(255,255,255,.14); --shadow-lift:0 4px 0 rgba(255,255,255,.08);
  --accent:#79C8A2; --accent-fg:#0E1815; --accent-soft:#1F332A;
  --warn:#E0A253; --warn-soft:#2C2415;
  --toast-bg:#E6EEE7; --toast-fg:#0E1815;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:600px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-0.01em;white-space:nowrap}
.brand span{color:var(--c-side)}
.kid{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
h2.view-title{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;margin:0;text-wrap:balance}
.view-sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-3)}
.hint a{color:var(--accent)}

/* ---- the tin ---- */
.tin{border:2px solid var(--line-strong);border-radius:var(--r-lg);background:var(--line-strong);
  display:grid;grid-template-columns:1fr 1fr;gap:2px;overflow:hidden}
.cmp{background:var(--surface);border:0;padding:12px 12px 13px;min-height:104px;display:flex;flex-direction:column;
  gap:7px;text-align:left;align-items:stretch;transition:background .12s ease}
.cmp[data-act]:active{background:var(--surface-2)}
.cmp .lab{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;gap:6px}
.cmp .nm{font-family:var(--f-display);font-size:15.5px;font-weight:600;line-height:1.22;letter-spacing:-0.01em;color:var(--ink)}
.cmp .tr{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:6px}
.cmp .tr i{font-style:normal;font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;line-height:1;
  padding:4px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.cmp .tr i.care{background:transparent;color:var(--ink-3);padding-left:0}
.cmp.empty .nm{color:var(--ink-3);font-weight:500}
.c-main .lab{color:var(--c-main)} .c-side .lab{color:var(--c-side)}
.c-fruit .lab{color:var(--c-fruit)} .c-sweet .lab{color:var(--c-sweet)}
.c-snack .lab{color:var(--c-snack)} .c-drink .lab{color:var(--c-drink)}
.cmp.minor{min-height:76px}
.tin .cmp.minor:nth-child(5):last-child{grid-column:1/-1}
.tick{width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;flex:none}
.tick svg{width:9px;height:9px;opacity:0}
.tin.packed{border-color:var(--line);background:var(--line)}
.tin.packed .cmp>*{opacity:.55}
.packbox{gap:8px;font-weight:600}
.packbox[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.packbox[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.packbox[aria-pressed="true"] .tick svg{opacity:1}
.lock{opacity:.85}
.swap{color:var(--ink-3);opacity:.9}
.cmp:active .swap{opacity:1}

.daycard{display:flex;flex-direction:column;gap:9px}
.daycard.past{opacity:.55}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:2px}
.dayname{font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:-0.01em}
.dayname em{font-family:var(--f-mono);font-style:normal;font-size:11px;font-weight:500;color:var(--ink-3);
  letter-spacing:.08em;margin-left:7px;text-transform:uppercase}
.note{font-size:13.5px;color:var(--ink-2);padding:0 2px;line-height:1.45}
.note b{font-weight:600;color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:5px}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.good{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.picked{background:var(--accent-soft);color:var(--accent);border-color:transparent;margin-left:6px;vertical-align:middle}
.chip{white-space:nowrap}
.chip.lock svg{stroke-width:2.2}
.banner.wrap{flex-wrap:wrap}
.banner .btn{white-space:nowrap}

.btn{border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-md);
  padding:0 16px;min-height:44px;font-family:var(--f-display);font-weight:600;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
a.btn{text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--ink-2);font-weight:500}
.btn.wide{width:100%}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px;border-radius:var(--r-sm)}
.btn.danger{border-color:var(--line);color:var(--c-fruit);background:transparent}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card h3{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0 0 3px}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3);letter-spacing:.05em}

.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;padding-left:2px}
.sect-head h3{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.item{display:flex;align-items:center;gap:11px;padding:11px 13px;min-height:52px;border-top:1px solid var(--line);
  width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .nm{display:block;font-size:14.5px;line-height:1.3}
.item .meta{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.05em}
.item.done .nm{text-decoration:line-through;color:var(--ink-3)}
.box{width:22px;height:22px;flex:none;border:1.5px solid var(--line-strong);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:transparent}
.item.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.box svg{width:12px;height:12px}
.x{flex:none;width:44px;height:44px;margin-right:-8px;border-radius:var(--r-sm);border:0;background:none;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center}
.qty{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=email],input[type=time],select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);
  padding:11px 12px;min-height:44px;width:100%;font-size:15px}
textarea{min-height:70px;resize:vertical}
input[type=text]:focus,input[type=email]:focus,input[type=time]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.btn:disabled{opacity:.55;cursor:default}
.item .nm,.item .meta,.kv span{overflow-wrap:anywhere}
.toggles{display:flex;flex-wrap:wrap;gap:7px}
.tg{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:0 13px;min-height:44px;
  font-size:13.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 -6px}
.dow .tg{min-width:0;min-height:44px;padding:0;justify-content:center;font-family:var(--f-mono);font-size:13px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch .t{font-size:14.5px}
.switch .d{font-size:12.5px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.sw{flex:none;width:50px;height:30px;border-radius:999px;border:1.5px solid var(--line);background:var(--sunk);position:relative;transition:background .15s}
.sw::before{content:"";position:absolute;inset:-8px -12px}   /* a 44px hit area around a 30px pill */
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);
  box-shadow:var(--shadow-1);transition:transform .15s ease}
.sw[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}

.empty{border:2px dashed var(--line);border-radius:var(--r-lg);padding:26px 20px;text-align:center;display:flex;
  flex-direction:column;gap:12px;align-items:center;background:var(--surface)}
.empty p{margin:0;color:var(--ink-2);font-size:14px;max-width:38ch}
.banner.good{background:var(--accent-soft);color:var(--accent)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-md);padding:11px 13px;font-size:13.5px;
  display:flex;gap:10px;align-items:center;justify-content:space-between}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--ground);background:color-mix(in srgb,var(--ground) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{flex:1;border:0;background:none;min-height:52px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--ink-3);border-radius:var(--r-md)}
nav.tabs button span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
nav.tabs button[aria-current="true"]{color:var(--accent)}
nav.tabs svg{width:21px;height:21px}

.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none;transition:opacity .18s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--ground);border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);max-height:86vh;display:flex;flex-direction:column;visibility:hidden;
  transform:translateY(102%);transition:transform .22s cubic-bezier(.32,.72,0,1),visibility 0s .22s}
.sheet.open{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.32,.72,0,1),visibility 0s}
.sheet header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line)}
.sheet header h3{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0}
.sheet .body{overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:8px auto 0}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:var(--toast-bg);color:var(--toast-fg);padding:10px 16px;border-radius:16px;font-size:13.5px;z-index:40;max-width:min(92vw,420px);text-align:center;
  opacity:0;pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{min-height:44px;margin:-10px -8px -10px 8px;padding:0 8px;background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px}
@media (min-width:520px){
  .cmp{min-height:112px}
  h2.view-title{font-size:30px}
}

/* --- first run --- */
.ob{min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:22px;
  max-width:600px;margin:0 auto;padding:34px 20px calc(34px + env(safe-area-inset-bottom))}
.ob h1{font-family:var(--f-display);font-size:clamp(30px,8.5vw,40px);font-weight:700;letter-spacing:-0.025em;
  line-height:1.08;margin:0;text-wrap:balance}
.ob .lede{font-size:16.5px;color:var(--ink-2);margin:8px 0 0;max-width:38ch}
.ob .q{display:flex;flex-direction:column;gap:9px}
.ob .q > span,.ob .q > label{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.ob .go{margin-top:4px}
.ob .skip{background:none;border:0;color:var(--ink-3);font-size:13.5px;text-decoration:underline;
  text-underline-offset:3px;min-height:44px}
.ob .skip.top{align-self:flex-start;padding:0;margin-top:-6px}
.oblogo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:64px;height:64px;border-radius:14px;
  border:2px solid var(--line-strong);background:var(--line-strong);overflow:hidden;margin-bottom:4px}
.oblogo i:nth-child(1){background:var(--c-main)} .oblogo i:nth-child(2){background:var(--c-side)}
.oblogo i:nth-child(3){background:var(--c-fruit)} .oblogo i:nth-child(4){background:var(--c-sweet)}

/* --- kid's pick: which of the week's boxes is next --- */
.kidmode{position:fixed;inset:0;z-index:60;background:var(--ground);display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.kidmode .top .exit{margin-left:auto}
.more summary{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;min-height:44px;display:flex;align-items:center}
.kidmode .top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 6px}
.kidmode .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;
  padding:8px 20px calc(28px + env(safe-area-inset-bottom));max-width:600px;width:100%;margin:0 auto}
.kidmode .catlab{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.kidmode h1{font-family:var(--f-display);font-size:clamp(28px,8vw,38px);font-weight:700;letter-spacing:-0.025em;
  line-height:1.08;margin:0;text-wrap:balance}
.kidmode .hint{font-size:16px;color:var(--ink-2);margin:0}
.dots{display:flex;gap:7px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line-strong);opacity:.35;display:block}
.dots i.on{background:var(--accent);opacity:1} .dots i.did{background:var(--accent);opacity:.45}
.picks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.pick{background:var(--surface);border:2.5px solid var(--line-strong);border-radius:24px;min-height:210px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 12px;
  font:inherit;color:var(--ink);transition:transform .12s ease,background .12s ease}
.pick:active{transform:scale(.96)}
.pick .ic{font-size:84px;line-height:1;filter:drop-shadow(var(--shadow-lift))}
.pic{display:block;object-fit:cover;background:var(--surface-2)}
.pick .pic{width:104px;height:104px;border-radius:18px;filter:drop-shadow(var(--shadow-lift))}
.pickbox .pic{width:44px;height:44px;border-radius:10px}
.kiddone .pic{width:44px;height:44px;border-radius:10px}
.pic.big{width:104px;height:104px;border-radius:18px;margin:0 auto}
.thumb{width:44px;height:44px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface-2);padding:0;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font:inherit}
.thumb .ic{font-size:22px;line-height:1}
.thumb .pic{width:100%;height:100%}

.pickbox:active{transform:scale(.96)}

.pickbox .ic{font-size:38px;line-height:1}
.pickbox .nm{font-family:var(--f-display);font-size:12px;font-weight:600;line-height:1.15;text-align:center;text-wrap:balance;overflow-wrap:break-word;hyphens:auto}
.kiddone{display:flex;flex-direction:column;gap:18px;align-items:stretch}
.kiddone .big{font-size:64px;line-height:1;text-align:center}
.kiddone h1{text-align:center}
.kiddone .tin .cmp{min-height:112px}
.kiddone .tin .ic{font-size:40px;line-height:44px;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){.pick:active{transform:none}}

/* --- "did they eat it?" review --- */
.review h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600}
.rrow{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rrow:last-of-type{border-bottom:0;padding-bottom:4px}
.ric{font-size:22px;line-height:1}
.rnm{font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.25}
.seg{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;border:1.5px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);min-height:44px;font-size:13px;font-weight:500;color:var(--ink-2);border-left:1.5px solid var(--line-strong)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.switch .seg{grid-column:auto;grid-template-columns:1fr 1fr;flex:0 0 auto;width:190px}
.review .btn.wide{margin-top:12px}

/* --- multi-profile chrome --- */
.topbar .who{display:flex;align-items:center;gap:8px}
.kidbtn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);max-width:min(46vw,190px);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
  border-radius:999px;padding:0 12px;min-height:44px;font-size:13.5px;font-weight:600;color:var(--ink)}
.kidbtn .dot{width:8px;height:8px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;padding:0}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.kidbtn .caret{font-size:10px;color:var(--ink-3)}
.kidline{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:6px;margin:0 0 6px;padding-left:2px}
.kidgroup{display:flex;flex-direction:column;gap:9px}
.radio{width:20px;height:20px;flex:none;border:1.5px solid var(--line-strong);border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.item.on .radio{border-color:var(--accent)}
.item.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.codebox{font-family:var(--f-mono);font-size:11px;line-height:1.45;min-height:110px;word-break:break-all}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

<script>
/* Merge rules for one household edited on two phones. Pure: two account
   documents in, one out; nothing else in the app knows how to merge, and the
   test suite runs this block on its own. Per record the newer updatedAt wins,
   a deletion beats an older edit, and per-event rows (packed ticks, eat
   answers, pantry ticks) merge by their own "at" stamps, so nobody's tick is
   lost and an un-tick (a row marked off) travels too. Lists come out in a
   fixed order so both phones compute the same document. A day that has gone
   keeps the plan that existed on it. The local copy wins every tie. */
window.LSMerge = (function(){
  "use strict";
  function stamp(r){ return (r && (r.updatedAt || r.at)) || ''; }
  function newer(a, b){ return stamp(b) > stamp(a) ? b : a; }
  function rowStamp(row){                              /* a review row's own stamp is its latest answer */
    if(!row) return '';
    if(row.skipped) return row.at || '';
    var m = ''; Object.keys(row).forEach(function(k){ var e = row[k]; if(e && e.at && e.at > m) m = e.at; }); return m;
  }
  function byId(list){ var m = Object.create(null); (Array.isArray(list) ? list : []).forEach(function(r){ if(r && r.id) m[r.id] = r; }); return m; }
  function sortIds(out){ return out.sort(function(x, y){ return (x.createdAt || '') < (y.createdAt || '') ? -1 : (x.createdAt || '') > (y.createdAt || '') ? 1 : x.id < y.id ? -1 : x.id > y.id ? 1 : 0; }); }
  function unionById(la, lb, mergeOne){
    var b = byId(lb), out = [], seen = Object.create(null);
    (Array.isArray(la) ? la : []).forEach(function(r){ if(!r || !r.id || seen[r.id]) return; seen[r.id] = 1; out.push(b[r.id] ? mergeOne(r, b[r.id]) : r); });
    (Array.isArray(lb) ? lb : []).forEach(function(r){ if(!r || !r.id || seen[r.id]) return; seen[r.id] = 1; out.push(r); });
    return sortIds(out);
  }
  function mergeRows(ra, rb){                          /* {date: {cat: {at,...}}} or {date:{skipped,at}} */
    var out = Object.create(null), keys = Object.create(null);
    Object.keys(ra || {}).forEach(function(k){ keys[k] = 1; }); Object.keys(rb || {}).forEach(function(k){ keys[k] = 1; });
    Object.keys(keys).sort().forEach(function(d){
      var x = (ra || {})[d], y = (rb || {})[d];
      if(!x || !y){ out[d] = x || y; return; }
      if(x.skipped || y.skipped){ out[d] = rowStamp(y) > rowStamp(x) ? y : x; return; }
      var row = Object.create(null), cats = Object.create(null);
      Object.keys(x).forEach(function(c){ cats[c] = 1; }); Object.keys(y).forEach(function(c){ cats[c] = 1; });
      Object.keys(cats).sort().forEach(function(c){ row[c] = (x[c] && y[c]) ? newer(x[c], y[c]) : (x[c] || y[c]); });
      out[d] = row;
    });
    return out;
  }
  function mergeMap(ma, mb){                           /* {key: {at,...}} */
    var out = Object.create(null), keys = Object.create(null);
    Object.keys(ma || {}).forEach(function(k){ keys[k] = 1; }); Object.keys(mb || {}).forEach(function(k){ keys[k] = 1; });
    Object.keys(keys).sort().forEach(function(k){ var x = (ma || {})[k], y = (mb || {})[k]; out[k] = (x && y) ? newer(x, y) : (x || y); });
    return out;
  }
  function mergePast(pa, pb){
    var seen = Object.create(null), out = [];
    (pa || []).concat(pb || []).forEach(function(d){ if(d && d.d && !seen[d.d]){ seen[d.d] = 1; out.push(d); } });
    return out.sort(function(x, y){ return x.d < y.d ? -1 : x.d > y.d ? 1 : 0; }).slice(-40);
  }
  /* the newer plan wins, day by day, except that a day already gone keeps the plan
     that existed on it (the older week), so what was packed stays as it was */
  function mergeWeek(wa, wb, today){
    if(!wa || !wb) return wa || wb;
    var lead = newer(wa, wb), lag = lead === wa ? wb : wa;
    var older = (wa.createdAt || '') <= (wb.createdAt || '') ? wa : wb;
    var days = Object.create(null);
    (lag.days || []).forEach(function(d){ if(d && d.d) days[d.d] = d; });
    (lead.days || []).forEach(function(d){ if(d && d.d) days[d.d] = d; });
    (older.days || []).forEach(function(d){ if(d && d.d && today && d.d < today && days[d.d]) days[d.d] = d; });
    return {id:lead.id, kidId:lead.kidId, start:lead.start, createdAt:older.createdAt || lead.createdAt, updatedAt:lead.updatedAt,
      days:Object.keys(days).sort().map(function(k){ return days[k]; })};
  }
  function mergeKid(a, b, today){
    var head = newer(a, b);
    var settings = newer(a.settings || {}, b.settings || {});
    return {
      id:a.id, name:head.name, hue:head.hue, createdAt:(a.createdAt || '') < (b.createdAt || '') ? a.createdAt : b.createdAt,
      updatedAt:stamp(a) > stamp(b) ? a.updatedAt : b.updatedAt,
      deletedAt:(a.deletedAt || b.deletedAt) ? (head === a ? a.deletedAt : b.deletedAt) : null,
      settings:settings, foods:unionById(a.foods, b.foods, newer), week:mergeWeek(a.week, b.week, today),
      packed:mergeRows(a.packed, b.packed), eaten:mergeRows(a.eaten, b.eaten), past:mergePast(a.past, b.past)
    };
  }
  function merge(a, b, today){
    if(!a) return b; if(!b) return a;
    var head = newer(a, b);
    return {
      schema:a.schema || b.schema || 2, id:a.id, name:head.name,
      createdAt:(a.createdAt || '') < (b.createdAt || '') ? a.createdAt : b.createdAt,
      updatedAt:stamp(a) > stamp(b) ? a.updatedAt : b.updatedAt,
      onboardedAt:a.onboardedAt || b.onboardedAt || null,
      tz:b.tz || a.tz || null,                               /* the copy already on the server (b) set it first; a joining phone (a) never moves it */
      members:unionById(a.members, b.members, newer),
      kids:unionById(a.kids, b.kids, function(x, y){ return mergeKid(x, y, today); }),
      activeKidId:a.activeKidId || b.activeKidId,
      pantry:mergeMap(a.pantry, b.pantry)
    };
  }
  /* what two phones must agree on: everything but which lunchbox is open on screen */
  function same(a, b){
    var x = Object.assign({}, a, {activeKidId:null, updatedAt:null}), y = Object.assign({}, b, {activeKidId:null, updatedAt:null});
    return JSON.stringify(x) === JSON.stringify(y);
  }
  return {merge:merge, newer:newer, mergeRows:mergeRows, mergeWeek:mergeWeek, same:same};
})();
</script>

/* ================================================================ storage
   The ONLY place that touches persistence. Both calls are async so the
   UI already tolerates a round trip; a server version replaces the two
   bodies with fetch() and nothing else in the app changes.
   ---------------------------------------------------------------- */
var Store = {
  KEY:'lunchsorted',             /* the account document */
  PRIOR_KEYS:['fiveboxes','lunchbox-tin'],   /* the same document under the app's earlier names, newest first */
  DEVICE_KEY:'lunchsorted-device', /* which member is on THIS device — never exported */
  PRIOR_DEVICE_KEY:'fiveboxes-device',
  LEGACY_KEY:'lunchbox-tin-v1',  /* single-profile format, migrated on first run */
  ok:true,
  load:function(){
    return new Promise(function(res){
      var out = {doc:null, legacy:null, device:null, raw:null, unreadable:false, renamed:false};
      try{
        var raw = localStorage.getItem(Store.KEY);
        if(!raw){                                       /* found under an old name: write it under the new one */
          for(var i=0; i<Store.PRIOR_KEYS.length && !raw; i++) raw = localStorage.getItem(Store.PRIOR_KEYS[i]);
          out.renamed = !!raw;
        }
        out.raw = raw;
        if(raw){ try{ out.doc = JSON.parse(raw); }catch(e){ out.unreadable = true; } }
        var old = localStorage.getItem(Store.LEGACY_KEY);
        if(old){ try{ out.legacy = JSON.parse(old); }catch(e){ out.legacy = null; } }
        out.device = localStorage.getItem(Store.DEVICE_KEY) || localStorage.getItem(Store.PRIOR_DEVICE_KEY);
      }catch(e){ Store.ok = false; }
      res(out);
    });
  },
  save:function(doc, deviceMemberId){
    return new Promise(function(res){
      try{
        localStorage.setItem(Store.KEY, JSON.stringify(doc));
        if(deviceMemberId) localStorage.setItem(Store.DEVICE_KEY, deviceMemberId);
        Store.PRIOR_KEYS.forEach(function(k){ localStorage.removeItem(k); });   /* one copy on disk, under one name */
        localStorage.removeItem(Store.PRIOR_DEVICE_KEY);
      }catch(e){ Store.ok = false; }
      res(true);
    });
  },
  /* Never overwrite something we could not read: park the raw text under a
     dated key so it can be recovered by hand or pasted back in. */
  BACKUP_PREFIX:'lunchsorted-backup-',
  backupKeys:function(){
    try{ return Object.keys(localStorage).filter(function(k){ return k.indexOf(Store.BACKUP_PREFIX) === 0 || k.indexOf('fiveboxes-backup-') === 0; }).sort(); }catch(e){ return []; }
  },
  backup:function(raw){
    if(!raw) return false;
    try{
      var keys = Store.backupKeys();
      if(keys.some(function(k){ return localStorage.getItem(k) === raw; })) return true;   /* already kept */
      while(keys.length >= 2) localStorage.removeItem(keys.shift());                          /* never more than two */
      localStorage.setItem(Store.BACKUP_PREFIX+Date.now(), raw); return true;
    }catch(e){ return false; }
  },
  forget:function(){
    try{ [Store.KEY, Store.LEGACY_KEY, Store.DEVICE_KEY, Store.PRIOR_DEVICE_KEY, 'lunchsorted-join', 'lunchsorted-billing', 'lunchsorted-after', 'lunchsorted-trial-seen', SEEN_KEY].concat(Store.PRIOR_KEYS, Store.backupKeys())
      .forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
  }

  if(!catByKey(f.c)) return null;
  var n = safeStr(f.n, 80, '').trim(); if(!n) return null;
  return {id:safeId(f.id,'food'), kidId:kid.id, n:n, c:f.c,
    t:(Array.isArray(f.t) ? f.t : []).filter(function(x){ return TAGS.indexOf(x) > -1; }),
    a: AISLES.indexOf(f.a) > -1 ? f.a : 'other',
    al:(Array.isArray(f.al) ? f.al : []).filter(function(x){ return ALLERGENS.some(function(y){ return y.k === x; }); }),
    buy:normBuy(f.buy, n),
    img:(typeof f.img === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(f.img) && f.img.length <= PHOTO_MAX) ? f.img : null,
    createdAt:safeStamp(f.createdAt), updatedAt:safeStamp(f.updatedAt), deletedAt: f.deletedAt ? safeStamp(f.deletedAt) : null};
}
/* what to buy for a food: its own list if it has one ([] means the food itself), else the bank's
   list for a food of that name, so households seeded before lists existed get them too */
function normBuy(v, name){
  if(Array.isArray(v)) return v.map(function(x){ return safeStr(x, 40, '').trim(); }).filter(Boolean).slice(0, 8);
  var b = bankByName(name); return b && b.buy ? b.buy.slice() : null;
}
function normStamped(v){
  v = plainObj(v);
  var out = {at:safeStamp(v.at), by:safeIdOrNull(v.by)};
  if(v.off) out.off = true;                            /* an un-tick is a row, so it can travel to the other phone */
  return out;
}
function ticked(row, k){ return !!(row && row[k] && !row[k].off); }
function normDay(d){
  d = plainObj(d);
  var date = safeDate(d.d); if(!date) return null;
  var slots = {}, lock = {}, kidPick = {};
  var sl = plainObj(d.slots), lk = plainObj(d.lock), kp = plainObj(d.kidPick);
  ALL_CATS.forEach(function(c){
    if(own(sl, c.k)) slots[c.k] = safeIdOrNull(sl[c.k]);
    if(own(lk, c.k)) lock[c.k] = !!lk[c.k];
    if(own(kp, c.k) && kp[c.k]){ var e = normStamped(kp[c.k]); e.picker = 'kid'; kidPick[c.k] = e; }

}
function normDateRows(v, perRow, cap){
  var src = plainObj(v), out = {};
  Object.keys(src).filter(safeDate).sort().slice(-cap).forEach(function(d){
    var row = perRow(plainObj(src[d]));

}
function normKid(k, i){
  k = plainObj(k);
  var kid = newKid(safeStr(k.name, 40, '').trim() || 'Lunchbox', Math.abs(Math.floor(+k.hue || i || 0)) % KID_HUES.length);
  kid.id = safeId(k.id, 'kid');
  kid.createdAt = safeStamp(k.createdAt); kid.updatedAt = safeStamp(k.updatedAt);
  kid.deletedAt = k.deletedAt ? safeStamp(k.deletedAt) : null;
  var st = plainObj(k.settings);
  var days = (Array.isArray(st.days) ? st.days : []).map(Number).filter(function(x){ return x >= 0 && x <= 6 && x === Math.floor(x); });
  kid.settings.days = days.length ? days.filter(function(x, j){ return days.indexOf(x) === j; }) : [1,2,3,4,5];
  kid.settings.noHeat = st.noHeat !== false;
  ['noIce','shortWindow','noChoc'].forEach(function(r){ kid.settings[r] = !!st[r]; });
  kid.settings.avoidAllergens = (Array.isArray(st.avoidAllergens) ? st.avoidAllergens : []).filter(function(a){ return ALLERGENS.some(function(y){ return y.k === a; }); });
  kid.settings.avoidText = safeStr(st.avoidText, 500, '');
  var so = plainObj(st.slots); kid.settings.slots = {snack:!!so.snack, drink:!!so.drink};
  kid.settings.kidPick = !!st.kidPick; kid.settings.kidReminder = st.kidReminder !== false;
  kid.settings.kidPickMode = st.kidPickMode === 'boxes' ? 'boxes' : 'parts';
  kid.settings.kidReminderAt = /^([01]\d|2[0-3]):[0-5]\d$/.test(String(st.kidReminderAt || '')) ? st.kidReminderAt : '18:00';
  kid.settings.updatedAt = safeStamp(st.updatedAt);
  kid.foods = (Array.isArray(k.foods) ? k.foods : []).slice(0, 500).map(function(f){ return normFood(kid, f); }).filter(Boolean);
  var w = plainObj(k.week);
  var wdays = (Array.isArray(w.days) ? w.days : []).map(normDay).filter(Boolean);
  kid.week = (safeDate(w.start) && wdays.length)
    ? {id:safeId(w.id,'week'), kidId:kid.id, start:safeDate(w.start), createdAt:safeStamp(w.createdAt, w.updatedAt), updatedAt:safeStamp(w.updatedAt), days:wdays}
    : null;
  kid.past = (Array.isArray(k.past) ? k.past : []).map(normDay).filter(Boolean).slice(-40);
  kid.packed = normDateRows(k.packed, function(row){
    var out = {}; ALL_CATS.forEach(function(c){ if(row[c.k]) out[c.k] = normStamped(row[c.k]); });
    return Object.keys(out).length ? out : null;

    if(row.skipped){ var sk = normStamped(row); sk.skipped = true; return sk; }
    var out = {};
    ALL_CATS.forEach(function(c){
      var e = plainObj(row[c.k]);
      if(e.foodId && ['ate','some','left'].indexOf(e.r) > -1){ var st2 = normStamped(e); st2.foodId = safeIdOrNull(e.foodId); st2.r = e.r; if(st2.foodId) out[c.k] = st2; }
    });
    return Object.keys(out).length ? out : null;

}
function normalizeAccount(doc){

    activeKidId:null, pantry:nullMap(), onboardedAt: doc.onboardedAt ? safeStamp(doc.onboardedAt) : null, tz:validTz(doc.tz)};

  var live = acct.kids.filter(function(k){ return !k.deletedAt; });

var saveTimer = null;
function save(){
  if(!S) return;
  EAT_IDX = nullMap();
  if(!S.tz) S.tz = phoneTz();                                /* a household from before the zone was kept learns it from the next change */

var PHOTO_PX = 160, PHOTO_MAX = 16000;

  if(food && food.img) return '<img class="pic '+(cls||'')+'" src="'+food.img+'" alt="">';
  return '<span class="ic '+(cls||'')+'">'+iconFor(food)+'</span>';

function shrinkPhoto(file){
  var decode = window.createImageBitmap
    ? createImageBitmap(file).then(function(bm){ return {im:bm, w:bm.width, h:bm.height}; })
    : new Promise(function(resolve, reject){                 /* older WebKit: through a blob URL, which the policy allows for images */
        var url = URL.createObjectURL(file), im = new Image();
        im.onload = function(){ URL.revokeObjectURL(url); resolve({im:im, w:im.naturalWidth, h:im.naturalHeight}); };
        im.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('unreadable')); };
        im.src = url;
      });
  return decode.then(function(src){
    var side = Math.min(src.w, src.h); if(!side) throw new Error('empty');
    var c = document.createElement('canvas'); c.width = c.height = PHOTO_PX;
    var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, PHOTO_PX, PHOTO_PX);   /* a JPEG has no alpha: white under a transparent source, in every theme */
    g.drawImage(src.im, (src.w - side) / 2, (src.h - side) / 2, side, side, 0, 0, PHOTO_PX, PHOTO_PX);   /* the middle square */
    if(src.im.close) src.im.close();
    var q = 0.66, out = c.toDataURL('image/jpeg', q);
    while(out.length > PHOTO_MAX && q > 0.3){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
    if(out.length > PHOTO_MAX) throw new Error('big');
    return out;
  });
}
function iconFor(food){

  return CAT_ICON[food.c] || '🍱';

/* --------------------------------------------------------- school rules */
var AVOID_CACHE = {text:null, words:[]};
function avoidWords(s){
  var t = s.avoidText || '';
  if(AVOID_CACHE.text !== t){
    AVOID_CACHE.text = t;
    AVOID_CACHE.words = t.split(',').map(function(w){ return w.trim().toLowerCase(); }).filter(function(w){ return w.length>1; });
  }
  return AVOID_CACHE.words;
}
function violation(kid, food){
  var s = kid.settings;
  if(s.noHeat && has(food,'heat')) return 'needs heating';
  if(s.noIce && has(food,'ice')) return 'needs an ice pack';
  if(s.shortWindow && has(food,'messy')) return 'fiddly for a short lunch';
  if(s.noChoc && CHOC_RE.test(food.n)) return 'chocolate or candy';
  var bad = (food.al||[]).filter(function(a){ return s.avoidAllergens.indexOf(a)>-1; });
  if(bad.length) return 'has '+bad.map(function(k){ return (ALLERGENS.filter(function(y){ return y.k === k; })[0] || {label:k}).label.toLowerCase(); }).join(' and ');
  var words = avoidWords(s);
  for(var i=0;i<words.length;i++) if(food.n.toLowerCase().indexOf(words[i])>-1) return 'on your avoid list';
  return null;
}
function eligible(kid, cat){
  return foodsOf(kid).filter(function(f){ return f.c===cat && !violation(kid,f); });
}

/* ------------------------------------------------ pairing (deterministic) */
function pairScore(main, item, cat){
  if(!main || !item) return {s:0, why:[]};
  var s = 0, why = [];
  if(cat === 'drink'){
    if(has(main,'sweet') && has(item,'sweet')) s -= 2;            /* sweet main + juice is a sugar box */
    if(has(main,'salty') && has(item,'light')){ s += 1; why.push({w:1,k:'drink',n:item.n}); }
    return {s:s, why:why};
  }
  if(has(main,'soft') && has(item,'crunchy')){ s += 3; why.push({w:3,k:'crunch',n:item.n}); }
  if(has(main,'crunchy') && has(item,'soft')) s += 1;
  if(!has(main,'protein') && has(item,'protein')){ s += 3; why.push({w:3,k:'protein',n:item.n}); }
  if(has(main,'hearty') && has(item,'light')){ s += 2; why.push({w:2,k:'light',n:item.n}); }
  if(has(main,'hearty') && has(item,'hearty')) s -= 3;
  if(has(main,'messy') && has(item,'messy')) s -= 3;
  if(has(main,'savory') && has(item,'tangy')){ s += 2; why.push({w:2,k:'tangy',n:item.n}); }
  if(has(main,'salty') && has(item,'juicy')){ s += 2; why.push({w:2,k:'juicy',n:item.n}); }
  if(has(main,'sweet') && has(item,'sweet')) s -= 2;
  if(cat==='sweet'){
    if(has(main,'sweet')) s -= 2;
    if(has(item,'light') && has(main,'hearty')){ s += 1; why.push({w:1,k:'finish',n:item.n}); }
    if(has(item,'hearty') && has(main,'hearty')) s -= 2;
  }
  if(cat==='fruit' && has(item,'juicy') && !has(main,'messy')){ s += 1; why.push({w:1,k:'fresh',n:item.n}); }
  return {s:s, why:why};
}
function dayFlags(kid, day){
  var items = catsFor(kid).map(function(c){ return foodById(kid, day.slots[c.k]); }).filter(Boolean);
  var f = [];
  if(items.some(function(i){ return has(i,'ice'); })) f.push({t:'Ice pack', cls:''});
  if(items.some(function(i){ return has(i,'messy'); })) f.push({t:'Sealed container', cls:''});
  if(items.length && !items.some(function(i){ return has(i,'protein'); })) f.push({t:'No protein', cls:'warn'});
  if(day.kidPick && Object.keys(day.kidPick).length) f.push({t:kidLabel(kid) ? kidLabel(kid)+' picked' : 'Picked', cls:'picked'});
  return f;
}

/* ------------------------------------------------------- first-run seeding
   The onboarding answers pick how wide a starting list to build. A stranger
   should never face an empty app: three taps have to produce a planned week. */
var BREADTH = {
  variety:{n:{main:14,side:14,fruit:10,sweet:10,snack:8,drink:3}, easyOnly:false},
  some:   {n:{main:8, side:9, fruit:7, sweet:7, snack:5,drink:2}, easyOnly:false},
  picky:  {n:{main:5, side:5, fruit:4, sweet:4, snack:3,drink:2}, easyOnly:true}
};
function seedCategory(kid, catKey, n, easyOnly){
  var pool = BANK.filter(function(b){ return b.c===catKey && !violation(kid,b) && (!easyOnly || b.e); });
  if(easyOnly && pool.length < n)                    /* too strict to fill a week — widen */
    pool = BANK.filter(function(b){ return b.c===catKey && !violation(kid,b); });
  var ordered = shuffled(pool.filter(function(b){ return b.s; }))
    .concat(shuffled(pool.filter(function(b){ return !b.s; })));
  var added = 0;
  ordered.slice(0, n).forEach(function(b){
    if(foodsOf(kid).some(function(f){ return normKey(f.n)===normKey(b.n); })) return;
    kid.foods.push(newFood(kid, b)); added++;
  });
  if(added) touch(kid);
  return added;
}
function seedLibrary(kid, breadth){
  var cfg = BREADTH[breadth] || BREADTH.some, added = 0;
  catsFor(kid).forEach(function(c){ added += seedCategory(kid, c.k, cfg.n[c.k], cfg.easyOnly); });
  touch(kid);
  return added;
}

/* ------------------------------------------------------ week generation */
function shuffled(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* ---------------------------------------------------------- eat history
   The retention mechanic. After a pack day the parent records, per compartment,
   whether it was eaten, partly eaten, or came home. Outcomes are stored against
   the FOOD, not the slot, so they survive re-plans. The draw then leans toward
   foods that get eaten and rests anything that came home twice running — for
   three weeks, after which it quietly returns. No model, no server: a weighted
   shuffle over a six-outcome recency window. */
var EAT_IDX = nullMap();                              /* kid.id -> foodId -> outcomes, newest first; reset on save */
function eatHistory(kid, foodId){
  var idx = EAT_IDX[kid.id];
  if(!idx){
    idx = EAT_IDX[kid.id] = nullMap();
    var eaten = kid.eaten || {};

          if(r.forKids.indexOf(k.name)<0) r.forKids.push(k.name);
          if(pt.dish && r.dishes.indexOf(pt.dish)<0) r.dishes.push(pt.dish);   /* the dishes it is for; a dish that is just this one thing says nothing new */
        });
      });
    });
  });
  var order = {}; AISLES.forEach(function(a,i){ order[a]=i; });
  return Object.keys(rows).map(function(k){
    var r = rows[k]; r.have = !!(own(S.pantry, k) && S.pantry[k].have); return r;
  }).sort(function(a,b){
    return (order[a.aisle]-order[b.aisle]) || a.name.localeCompare(b.name);
  });
}
function weekIsStale(kid){
  if(!kid.week || !kid.week.days.length) return false;
  var last = kid.week.days.map(function(d){ return d.d; }).sort().pop();
  return last < iso(today());                          /* every pack day of that plan has gone by */
}
function anyStale(){ return kids().some(weekIsStale); }

/* what a food brings to the box, in the words the pairing uses; two at most, the ones that matter to a pairing first */
var TRAITS = ['crunchy','soft','protein','tangy','sweet','salty','juicy','hearty','light'];

/* a box is packed when everything with a food in it is ticked; one tick on the Pack screen sets them all */
function boxPacked(kid, day){
  var row = kid.packed[day.d] || {}, any = false;

}
function tinHTML(kid, day, mode){

             : (dayLabel(day.d).diff < 0 || isHelper() ? '' : '<span class="swap">'+svg('swap',12)+'</span>'));  /* the tap cue: this box can be swapped */
    var tag = mode==='pack' ? 'div' : 'button';                 /* on the Pack screen a compartment is not a button: only Week changes a box */
    h += '<'+tag+' class="cmp c-'+c.k+(f?'':' empty')+(c.minor?' minor':'')+'"'
      +  (mode==='pack' ? '' : ' data-act="slot" data-kid="'+esc(kid.id)+'" data-day="'+esc(day.d)+'" data-cat="'+c.k+'"')+'>'

  });

}
function packButton(kid, day){

function whenLabel(stamp){
  var d = safeDate(String(stamp || '').slice(0,10)); if(!d) return '';

  return diff === 0 ? 'Today' : diff === -1 ? 'Yesterday' : (MON[parseISO(d).getMonth()]+' '+parseISO(d).getDate());
}
function dayLabel(dstr){

/* the camera or the roll, then the thumbnail onto the food */
function pickPhoto(foodId){
  if(JSON.stringify(S).length + PHOTO_MAX > 1900000){ toast('No room for more photos \u2014 remove a few first'); return; }
  var inp = document.getElementById('photoIn');
  if(!inp){ inp = document.createElement('input'); inp.type = 'file'; inp.id = 'photoIn'; inp.accept = 'image/*'; inp.hidden = true; document.body.appendChild(inp); }   /* no capture attribute: the camera or the roll, the phone asks */
  inp.value = ''; inp.setAttribute('data-food', foodId);
  inp.onchange = function(){
    var file = inp.files && inp.files[0]; if(!file) return;
    toast('Adding the photo\u2026');
    shrinkPhoto(file).then(function(dataUrl){
      inp.value = '';                                        /* the full-size original is not kept a moment longer */
      var f = foodById(activeKid(), inp.getAttribute('data-food'));
      if(!f){ toast('That food is gone'); return; }
      f.img = dataUrl; touch(f); save(); render(); toast('Photo added');
    }).catch(function(){ inp.value = ''; toast('Could not use that photo'); });
  };
  inp.click();
}
/* a photo another phone stored that will not decode falls back to the emoji rather than a blank tile */
document.addEventListener('error', function(e){
  var t = e.target; if(!t || !t.classList || !t.classList.contains('pic')) return;
  var host = t.closest('[data-id]'), f = host && S ? foodById(activeKid(), host.getAttribute('data-id')) : null;
  var span = document.createElement('span'); span.className = 'ic'; span.textContent = f ? iconFor(f) : '🍱';
  t.replaceWith(span);
}, true);

function parseImport(text){
  var doc = null;
  try{ doc = JSON.parse(text); }catch(e){ return null; }
  if(!doc || typeof doc !== 'object') return null;
  var body = ((doc.app === 'lunchsorted' || doc.app === 'fiveboxes' || doc.app === 'lunchbox-tin') && doc.account) ? doc.account : doc;
  try{
    if(isAccount(body)) return normalizeAccount(body);
    if(isLegacy(body)) return normalizeAccount(migrate(Object.assign({}, body, {schema:1})));
  }catch(e){ return null; }
  return null;
}

/* ---------------------------------------------------------------- events */
var HELPER_OK = ['tab','help','pack-all','go-foods','go-week','go-kid-foods','kidsheet','pick-kid','notice-dismiss','undo','disarm',
  'signout','leave','signin-request','signin-code','join-accept','join-dismiss','copy-list','send-list','kid-exit'];
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act],[data-nf]');
  if(!el || !S) return;

  var nf = el.getAttribute('data-nf');
  if(nf){
    if(nf==='cat'){
      el.parentNode.querySelectorAll('.tg').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
      el.setAttribute('aria-pressed','true');
    } else el.setAttribute('aria-pressed', el.getAttribute('aria-pressed')==='true' ? 'false' : 'true');
    return;
  }
  var act = el.getAttribute('data-act');
  var kid = activeKid();
  /* a helper sees the plan and ticks the list on this phone; changing the plan is for a parent */
  if(isHelper() && HELPER_OK.indexOf(act) < 0){ toast('Only a parent can change the plan'); return; }
  if(act!=='clear-all' && act!=='del-kid' && act!=='clear-week' && act!=='delete-account' && act!=='member-remove' && act!=='disarm' && UI.armed) UI.armed = '';

  /* did they eat it? */
  if((act==='eat-set' || act==='eat-all') && gated()){ upgradeSheet('review'); return; }
  if(act==='eat-set' || act==='eat-all' || act==='eat-skip'){
    var ek = kidById(el.getAttribute('data-kid')), ed = ek && findDay(ek, el.getAttribute('data-day'));
    if(!ek || !ed) return;
    ek.eaten = ek.eaten || {};
    var row = ek.eaten[ed.d] = (ek.eaten[ed.d] && !ek.eaten[ed.d].skipped) ? ek.eaten[ed.d] : {};
    var me = (deviceMember() || {}).id || null;
    if(act==='eat-skip'){ ek.eaten[ed.d] = {skipped:true, at:now(), by:me}; }
    else if(act==='eat-all'){
      ALL_CATS.forEach(function(c){ if(foodById(ek, ed.slots[c.k])) row[c.k] = {foodId:ed.slots[c.k], r:'ate', at:now(), by:me}; });
    } else {
      var ec = el.getAttribute('data-cat');
      row[ec] = {foodId:ed.slots[ec], r:el.getAttribute('data-r'), at:now(), by:me};
    }
    touch(ek); save();
    if(reviewComplete(ek, ed)) delete UI.reviewEdit[ek.id];
    render();
    if(act!=='eat-skip' && reviewComplete(ek, ed)) toast('Noted — the next draw learns from it');
    return;
  }
  if(act==='eat-change'){
    var ck = kidById(el.getAttribute('data-kid')); if(!ck) return;
    UI.reviewEdit[ck.id] = el.getAttribute('data-day'); render(); return;
  }

  /* kid's pick */
  if(act==='kid-start'){ if(gated()){ upgradeSheet('kidpick'); return; } startKidPick(el.getAttribute('data-kid')); window.scrollTo(0,0); return; }
  if(act==='kid-pick'){ if(UI.kid && UI.kid.mode === 'parts') kidChoosePart(el.getAttribute('data-d'), el.getAttribute('data-id')); else kidChooseBox(el.getAttribute('data-d')); return; }
  if(act==='kidpick-on'){
    if(!kid.settings.kidPick && gated()){ upgradeSheet('kidpick'); return; }
    kid.settings.kidPick = !kid.settings.kidPick; touch(kid.settings); touch(kid); save(); render(); kidReminderSync(true); return;
  }
  if(act==='kid-reminder'){ kid.settings.kidReminder = kid.settings.kidReminder === false; touch(kid.settings); touch(kid); save(); render(); kidReminderSync(true); return; }
  if(act==='kidpick-mode'){ kid.settings.kidPickMode = el.getAttribute('data-v') === 'boxes' ? 'boxes' : 'parts'; touch(kid.settings); touch(kid); save(); render(); return; }
  if(act==='kid-exit'){ UI.kid = null; render(); toast('Handed back'); return; }

  /* first run */
  /* the chips flip in place: a re-render would throw away the name field's focus and keyboard */
  if(act==='ob-heat'){ UI.ob.heat = el.getAttribute('data-v')==='hot'; obPress(el, true); return; }
  if(act==='ob-avoid'){
    var av = el.getAttribute('data-v'), ai = UI.ob.avoid.indexOf(av);
    if(ai>-1) UI.ob.avoid.splice(ai,1); else UI.ob.avoid.push(av);
    obPress(el, false); return;
  }
  if(act==='ob-breadth'){ UI.ob.breadth = el.getAttribute('data-v'); obPress(el, true); return; }
  if(act==='ob-go'){
    var obn = document.getElementById('obName'); if(obn && obn.value.trim()) kid.name = obn.value.trim().slice(0,40);
    kid.settings.noHeat = !UI.ob.heat;
    kid.settings.avoidAllergens = UI.ob.avoid.slice();
    touch(kid.settings);
    seedLibrary(kid, UI.ob.breadth);
    planWeek(kid);
    S.onboardedAt = now(); UI.tab = 'week';
    UI.obEmail = navigator.onLine && !signedIn();
    if(Account.elsewhere){ Account.elsewhere = false; Sync.push(true); }
    save(); render(); window.scrollTo(0,0);
    if(!UI.obEmail) toast('Your week is ready');
    return;
  }
  if(act==='ob-later'){ UI.obEmail = false; render(); window.scrollTo(0,0); if(S.onboardedAt) toast(Account.linkSent ? 'Tap the link when it arrives' : 'Your week is ready'); return; }
  if(act==='ob-signin'){ if(!navigator.onLine){ toast('You are offline \u2014 try that when you have signal'); return; } UI.obEmail = true; render(); window.scrollTo(0,0); return; }
  if(act==='ob-resend'){ Account.linkSent = ''; Account.devLink = ''; Account.devCode = ''; render(); return; }
  if(act==='ob-skip'){
    var obn2 = document.getElementById('obName'); if(obn2 && obn2.value.trim()) kid.name = obn2.value.trim().slice(0,40);
    kid.settings.noHeat = !UI.ob.heat;
    kid.settings.avoidAllergens = UI.ob.avoid.slice();
    touch(kid.settings);
    S.onboardedAt = now(); UI.tab = 'foods';
    if(Account.elsewhere){ Account.elsewhere = false; Sync.push(true); }
    save(); render(); window.scrollTo(0,0); return;
  }

  /* navigation */
  if(act==='tab'){ if(UI.tab !== 'setup') UI.lastTab = UI.box ? 'lunchbox settings' : UI.tab; UI.tab = el.getAttribute('data-tab'); UI.box = false; render(); window.scrollTo(0,0); return; }
  if(act==='box-settings'){ if(!UI.box) UI.boxScroll = window.scrollY; UI.box = !UI.box; render(); window.scrollTo(0, UI.box ? 0 : (UI.boxScroll || 0)); return; }
  if(act==='box-done'){ UI.box = false; render(); window.scrollTo(0, UI.boxScroll || 0); return; }
  if(act==='go-foods'){ UI.tab='foods'; UI.box = false; render(); window.scrollTo(0,0); return; }
  if(act==='go-kid-foods'){ S.activeKidId = el.getAttribute('data-id'); UI.tab='foods'; UI.box = false; save(); render(); window.scrollTo(0,0); return; }
  if(act==='go-week'){ UI.tab='week'; UI.box = false; render(); window.scrollTo(0,0); return; }
  if(act==='kidsheet'){ kidSheet(); return; }

  /* lunchbox profiles */
  if(act==='pick-kid'){
    S.activeKidId = el.getAttribute('data-id'); save();
    if(el.getAttribute('data-close')) closeSheet();
    render(); return;
  }
  if(act==='add-kid'){ addKidSheet(); return; }
  if(act==='save-kid'){
    var nk = document.getElementById('nkName');
    var name = (nk.value||'').trim().slice(0,40);
    if(!name){ nk.focus(); toast('Give the lunchbox a name'); return; }
    var k = newKid(name, S.kids.length % KID_HUES.length);
    S.kids.push(k); S.activeKidId = k.id; UI.tab='foods'; UI.box = false;   /* a new lunchbox starts on its foods */
    save(); closeSheet(); render(); toast(name+' added'); return;
  }
  if(act==='del-kid'){
    var id = el.getAttribute('data-id'), k2 = kidById(id);
    if(!k2 || kids().length<2) return;

  /* planning */
  if(act==='plan-kid'){

    var short2 = planAll(); render();

  if(act==='shuffle-day'){
    var k3 = kidById(el.getAttribute('data-kid')) || kid;

  if(act==='slot'){ slotSheet(el.getAttribute('data-kid'), el.getAttribute('data-day'), el.getAttribute('data-cat')); return; }
  if(act==='sheet-shuffle'){
    var k4 = kidById(el.getAttribute('data-kid')), cat = el.getAttribute('data-cat');
    var day4 = k4.week.days.filter(function(x){ return x.d===el.getAttribute('data-day'); })[0];
    var wasKept = !!(day4.lock[cat] || (day4.kidPick && day4.kidPick[cat]));

  if(act==='sheet-lock'){
    var k5 = kidById(el.getAttribute('data-kid')), cat5 = el.getAttribute('data-cat');

  if(act==='pick'){
    var k6 = kidById(el.getAttribute('data-kid'));

    var cat6 = el.getAttribute('data-cat');
    if(day6.slots[cat6] !== el.getAttribute('data-id') && day6.kidPick) delete day6.kidPick[cat6];
    day6.slots[cat6] = el.getAttribute('data-id');
    touch(k6.week); touch(k6); save(); closeSheet(); render(); return;
  }

  /* packing */
  if(act==='pack-all'){
    var k7 = kidById(el.getAttribute('data-kid')), dt = el.getAttribute('data-day');
    if(!k7 || !k7.week) return;
    var day7 = k7.week.days.filter(function(x){ return x.d===dt; })[0]; if(!day7) return;

    var row = k7.packed[dt] = k7.packed[dt] || {};

      if(!foodById(k7, day7.slots[c.k])) return;
      if(was) row[c.k] = {at:at, by:by, off:true};                       /* an un-tick is a row too, so the other phone sees it */
      else if(!ticked(row, c.k)) row[c.k] = {at:at, by:by};              /* a compartment already ticked keeps who and when */

        kid7.packed[dt] = prev; touch(kid7); save(); render();

      t:[].slice.call(document.querySelectorAll('#nfTags .tg[aria-pressed="true"]')).map(function(x){ return x.getAttribute('data-v'); }),

  if(act==='food-photo'){
    var pf = foodById(kid, el.getAttribute('data-id')); if(!pf) return;

  if(act==='del-food'){
    var f = foodById(kid, el.getAttribute('data-id')); if(!f) return;

      .then(function(){ toast('Backup saved'); },
            function(err){ toast(err && err.code==='declined' ? 'Backup cancelled' : 'Could not save the file'); });

    if(!kids().length){ var k8 = newKid('Lunchbox',0); S.kids.push(k8); }
    if(!activeKid()) S.activeKidId = kids()[0].id;

  }
  if(act==='clear-week'){
    if(UI.armed!=='week'){ UI.armed='week'; render(); toast('That clears every lunchbox\u2019s plan for the week'); return; }
    kids().forEach(function(k){ archiveWeek(k); k.week = null; k.packed = {}; touch(k); });
    UI.armed=''; save(); render(); toast('Plans cleared'); return;
  }
  if(act==='clear-all'){
    if(UI.armed!=='all'){ UI.armed='all'; render(); toast('That erases every lunchbox on this phone'); return; }
    Store.forget();
    S = newAccount(); DEVICE.memberId = S.members[0].id; UI.armed=''; UI.tab='setup';
    save(); render(); toast('Everything erased'); return;
  }
  if(act==='disarm'){ UI.armed=''; render(); return; }

  /* account: every one of these talks to the server, so offline they say so and stop */
  var ACCOUNT_ACTS = ['signin-request','signin-code','signout','invite','invite-helper','member-remove','leave','join-accept','delete-account','buy','portal'];
  if(ACCOUNT_ACTS.indexOf(act) > -1 && !navigator.onLine){ toast('You are offline \u2014 try that when you have signal'); return; }
  var offline = function(){ toast('Could not reach the server'); };
  if(act==='signin-request'){
    var inp = document.getElementById('signinEmail'), em = (inp.value || '').trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(em)){ inp.focus(); toast('That does not look like an email address'); return; }
    Account.sending = true; UI.obDraft = em; render();
    if(UI.obEmail) rememberAfter('week');                    /* the link, tapped, lands on the week it promised */
    api('POST', '/api/auth/request', {email:em}).then(function(r){
      Account.sending = false;
      if(r.status !== 200){ render(); toast(r.error || 'Could not send the link'); return; }
      Account.linkSent = em; Account.devLink = r.devLink || ''; Account.devCode = r.devCode || ''; UI.obDraft = ''; render(); toast('Check your email');
      if(!UI.obEmail){ var code = document.getElementById('signinCode'); if(code) code.focus(); }
    }).catch(function(){ Account.sending = false; render(); offline(); });
    return;
  }
  if(act==='signin-code'){

      Account.user = r.user; Account.linkSent = ''; Account.devLink = ''; Account.devCode = ''; Account.first = true; UI.obEmail = false;

    }).catch(offline);

  }
  if(act==='signout'){

    flush.then(function(){ return api('POST', '/api/auth/logout'); }).then(function(){
      Account.user = null; Account.me = null; Account.members = []; Account.invite = ''; Account.linkSent = ''; Account.status = 'idle'; Account.first = false; Account.elsewhere = false; Account.entitlement = null; Account.household = null;
      Store.forget(); S = newAccount(); DEVICE.memberId = S.members[0].id; UI.tab = 'pack'; UI.obEmail = false;
      save(); render(); window.scrollTo(0,0); toast('Signed out \u2014 this phone is clear. Sign in again to get the lunches back.');
    }).catch(offline);
    return;
  }
  if(act==='upgrade'){ upgradeSheet(el.getAttribute('data-why') || ''); return; }
  if(act==='go-signin'){ rememberAfter(el.getAttribute('data-why')); UI.tab = 'setup'; UI.box = false; render(); setTimeout(function(){ var el = document.getElementById('signinEmail'); if(el) el.focus(); }, 120); return; }
  if(act==='buy' || act==='portal'){
    if(Account.buying) return;
    Account.buying = true; var was = el.textContent; el.disabled = true; el.textContent = 'Opening Stripe\u2026';
    var undoBtn = function(){ Account.buying = false; el.disabled = false; el.textContent = was; };

    var client = native() ? 'ios' : undefined;
    var call = act==='buy' ? api('POST', '/api/billing/checkout', {plan: el.getAttribute('data-plan') || 'year', client: client}) : api('POST', '/api/billing/portal', {client: client});
    call.then(function(r){
      if(r.status !== 200 || !r.url){ undoBtn(); toast(r.error || (act==='buy' ? 'Could not open the checkout' : 'Could not open billing')); return; }

      if(browser){                                           /* the iPhone app: Stripe opens in Safari, and back.html hands the parent back to the app */
        undoBtn(); closeSheet();
        browser.open({url: r.url}).catch(function(){ location.href = r.url; });
        return;
      }
      location.href = r.url;                                 /* Stripe's page; it sends you back to /app/ */
    }).catch(function(){ undoBtn(); offline(); });
    return;
  }
  if(act==='invite' || act==='invite-helper'){
    if(gated()){ upgradeSheet('share'); return; }
    api('POST', '/api/household/invite', {role: act==='invite-helper' ? 'helper' : 'adult'}).then(function(r){
      if(r.status === 402){ upgradeSheet('share'); return; }
      if(r.status !== 200){ toast(r.error || 'Could not make an invite'); return; }
      Account.invite = r.url; Account.inviteRole = r.role; render();
    }).catch(offline);
    return;
  }
  if(act==='invite-copy'){ copy(Account.invite, 'Link copied \u2014 send it to them'); return; }
  if(act==='invite-share'){
    navigator.share({title:'Lunch Sorted', text:'Join our lunches on Lunch Sorted', url:Account.invite}).then(function(){ toast('Sent \u2014 ask them to open it on their phone'); }, function(){});
    return;
  }
  if(act==='member-remove'){
    var rmId = el.getAttribute('data-id'), rmName = (Account.members.filter(function(m){ return String(m.userId) === rmId; })[0] || {});
    if(UI.armed !== 'rm:'+rmId){ UI.armed = 'rm:'+rmId; render(); toast('That signs '+(rmName.userId ? memberLabel(rmName) : 'them')+' out of the household'); return; }

  }
  if(act==='leave'){

    }).catch(offline);
    return;
  }
  if(act==='join-accept'){
    api('POST', '/api/household/join', {code: Account.join.code, memberId: DEVICE.memberId}).then(function(r){
      if(r.status !== 200){ UI.notice = r.error || 'Could not join'; render(); return; }
      Account.join = null; try{ localStorage.removeItem('lunchsorted-join'); }catch(e){}
      applyState(r);
      var theirs = r.doc ? normalizeAccount(r.doc) : null;
      if(theirs){
        /* bring along only what this phone actually has: lunchboxes with food in them, and the person on it */

          kids:S.kids.filter(function(k){ return !k.deletedAt && (foodsOf(k).length || k.week); }),

        });
        S = normalizeAccount(window.LSMerge.merge(mine, theirs, iso(today()))); S.activeKidId = (kids()[0] || {}).id;
        if(theirs.createdAt) S.createdAt = theirs.createdAt;      /* their household's birthday, not this phone's: joining never shortens their three weeks */
        Store.save(S, DEVICE.memberId);

      return Sync.push();
    }).catch(offline);
    return;
  }
  if(act==='join-dismiss'){ Account.join = null; try{ localStorage.removeItem('lunchsorted-join'); }catch(e){} render(); return; }
  if(act==='delete-account'){
    if(UI.armed!=='delete-account'){ UI.armed='delete-account'; render(); toast('That deletes the household everywhere'); return; }
    api('POST', '/api/auth/delete', {confirm:'DELETE'}).then(function(r){
      if(r.status !== 200){ toast(r.error || 'Could not delete'); return; }
      Account.user = null; Account.me = null; Account.members = []; Account.invite = ''; UI.armed = ''; Account.first = false; Account.household = null;
      Store.forget(); S = newAccount(); DEVICE.memberId = S.members[0].id; UI.tab = 'pack';

    return;
  }
  if(act==='notice-dismiss'){ UI.notice=''; markSeen(); render(); return; }
  if(act==='elsewhere-ok'){ Account.elsewhere = false; render(); return; }
  if(act==='sync-now'){ if(!navigator.onLine){ toast('You are offline'); return; } Account.tries = 0; Sync.pull().then(render); return; }
  if(act==='review-later'){ UI.reviewLater[el.getAttribute('data-kid')] = el.getAttribute('data-day'); render(); return; }
  if(act==='trial-dismiss'){ try{ localStorage.setItem(TRIAL_SEEN_KEY, el.getAttribute('data-stage') || 'soon'); }catch(e){} render(); return; }
  if(act==='undo'){ if(UI.undo){ var fn = UI.undo; UI.undo = null; fn(); } return; }
});

document.addEventListener('change', function(ev){
  if(!S) return;
  if(ev.target.id==='kidReminderAt'){
    var kid = activeKid(); if(!kid) return;
    var at = String(ev.target.value || '');
    if(/^([01]\d|2[0-3]):[0-5]\d$/.test(at)){ kid.settings.kidReminderAt = at; touch(kid.settings); touch(kid); save(); kidReminderSync(true); }
    return;
  }
  if(ev.target.id==='kidName' || ev.target.id==='avoidText'){
    if(ev.target.id==='avoidText'){ rulesChanged(activeKid()); save(); }
    render();
  }
});
document.addEventListener('keydown', function(ev){
  if(ev.key !== 'Enter') return;
  var id = ev.target && ev.target.id;
  if(id === 'signinEmail'){ ev.preventDefault(); var b = document.querySelector('[data-act="signin-request"]'); if(b) b.click(); }
  if(id === 'signinCode'){ ev.preventDefault(); var c = document.querySelector('[data-act="signin-code"]'); if(c) c.click(); }
});
document.addEventListener('input', function(ev){

    kid.name = ev.target.value.slice(0,40); touch(kid); save();
    var w = document.getElementById('who');
    if(w) w.innerHTML = '<button class="kidbtn" data-act="kidsheet"><span class="dot" style="background:'+hueVar(kid)
      + '"></span>'+esc(kid.name || 'Lunchbox')+'<span class="caret">&#9662;</span></button>';
  }
  if(ev.target.id==='obName'){ UI.ob.name = ev.target.value; }
  if(ev.target.id==='signinEmail'){ UI.obDraft = ev.target.value; }
  if(ev.target.id==='avoidText'){ kid.settings.avoidText = ev.target.value.slice(0,500); touch(kid.settings); touch(kid); save(); }
  if(ev.target.id==='memberName'){
    var me = deviceMember(); if(!me) return;
    me.name = ev.target.value.slice(0,60); touch(me); save();
  }
});

/* the list as plain text, one line each, grouped by aisle, for Notes, Reminders or a text message */
function listText(bare){
  var rows = shoppingList().filter(function(r){ return !r.have; }), out = [], last = null;
  rows.forEach(function(r){
    if(r.aisle !== last){ out.push((out.length ? '\n' : '')+AISLE_SHORT[r.aisle]); last = r.aisle; }
    out.push('- '+r.name+(r.qty>1 ? ' x'+r.qty : ''));
  });
  return rows.length ? (bare ? '' : 'Lunch shopping list\n\n')+out.join('\n') : '';
}
/* the phone's share sheet: the app's plugin inside the iPhone app, the browser's on the web */
function canShare(){ return !!(nativePlugin('Share') || navigator.share); }
function shareText(title, text){
  var sh = nativePlugin('Share');
  var p = sh ? sh.share({title:title, text:text, dialogTitle:title}) : (navigator.share ? navigator.share({title:title, text:text}) : null);
  if(!p){ copy(text, 'List copied'); return; }
  p.catch(function(e){ if(!/abort|cancel/i.test(String(e && (e.name || e.message)))) copy(text, 'List copied'); });
}
function copy(text, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); },
      function(){ toast(native() ? 'Copy blocked' : 'Copy blocked by the browser'); });
  } else toast(native() ? 'Copy blocked' : 'Copy blocked by the browser');
}

/* -------------------------------------------------- optional capability */
var Downloads = null;
if(window.claude && typeof window.claude.use === 'function'){
  try{
    window.claude.use('downloads').then(function(d){
      Downloads = d || null;
      if(Downloads && UI.tab==='setup') render();
    }, function(){});
  }catch(e){}
}

/* ------------------------------------------------------------------ boot */
Store.load().then(function(r){
  var doc = null, rejected = false;
  try{
    if(r.doc) doc = normalizeAccount(isAccount(r.doc) ? r.doc : migrate(r.doc));
    if(!doc && !r.raw && isLegacy(r.legacy)) doc = normalizeAccount(migrate(Object.assign({}, r.legacy, {schema:1})));
  }catch(e){ doc = null; }
  if(!doc && (r.raw || r.unreadable)){
    /* something was saved here and we could not make sense of it: keep it, start fresh, say so */
    rejected = true;
    UI.notice = Store.backup(r.raw)
      ? 'Your saved lunches could not be read, so this is a fresh start. A copy was kept on this phone.'
      : 'Your saved lunches could not be read, so this is a fresh start.';
  }
  if(!doc) doc = newAccount();
  S = doc;
  DEVICE.memberId = (r.device && memberById(r.device)) ? r.device : members()[0].id;
  /* anyone who already has a list has effectively finished onboarding */
  if(!S.onboardedAt && kids().some(function(k){ return foodsOf(k).length; })) S.onboardedAt = now();
  whatsNew();
  try{ render(); }
  catch(e){
    /* the last line of defence: a document that renders badly must not become
       permanent, and must not be overwritten unless a copy was really kept */
    var kept = rejected || Store.backup(r.raw);
    S = newAccount(); DEVICE.memberId = S.members[0].id;
    UI.notice = 'Your saved lunches could not be shown, so this is a fresh start.' + (kept ? ' A copy was kept on this phone.' : '');
    if(!kept) rejected = true;
    render();
  }
  if(!rejected && (r.renamed || JSON.stringify(S) !== r.raw)) save();   /* an unchanged document is not rewritten on every launch */

  /* signed in? then the household on the server is part of the picture */
  var qs = new URLSearchParams(location.search);
  if(qs.get('signed-in')){
    var after = ''; try{ after = localStorage.getItem(AFTER_KEY) || ''; }catch(e){}
    if(after === 'week'){ UI.tab = 'week'; } else { UI.tab = 'setup'; Account.first = true; }
    toast('Signed in');
  }
  var joinCode = qs.get('join') || (function(){ try{ return localStorage.getItem('lunchsorted-join') || ''; }catch(e){ return ''; } })();
  if(joinCode){ try{ localStorage.setItem('lunchsorted-join', joinCode); }catch(e){} UI.tab = 'setup'; }
  var back = qs.get('paid'), portalBack = qs.get('portal'), wantUpgrade = qs.get('upgrade') === '1';
  if(wantUpgrade){ UI.tab = 'setup'; Account.first = true; if(S.onboardedAt) toast('Sign in on this phone to keep the Household plan'); }
  if(back === '1'){ UI.tab = 'setup'; Account.first = true; Account.settling = true; toast('Thank you \u2014 switching on the Household plan\u2026'); }
  else if(back === '0'){ UI.tab = 'setup'; Account.first = true; rememberAfter(''); toast('No charge was made'); }
  else if(portalBack){ UI.tab = 'setup'; Account.first = true; }
  if(qs.get('signed-in') || qs.get('join') || back !== null || portalBack || wantUpgrade) history.replaceState(null, '', location.pathname);
  /* what the plans cost and whether anything is gated at all; cached, and answered from the phone offline */
  loadBilling().then(function(){ if(!signedIn()) render(); kidReminderSync(); });
  var afterMe = function(){
    if(!joinCode) return;
    api('GET', '/api/household/invite?code='+encodeURIComponent(joinCode)).then(function(r){
      if(r.status === 200){
        Account.join = {code:joinCode, name:r.name, role:r.role, from:r.from};
        if(!S.onboardedAt){ S.onboardedAt = now(); save(); }   /* an invited phone starts at the sign-in card, not the questions */
      } else { try{ localStorage.removeItem('lunchsorted-join'); }catch(e){} if(r.status === 410) UI.notice = r.error; }
      render();
    }).catch(function(){});
  };
  if(navigator.onLine && !rejected){
    /* one request answers "who am I" and "what does the household hold" together */
    Sync.pull().then(function(){ if(signedIn() || joinCode) render(); afterMe(); if(qs.get('signed-in')) resumeAfter(); if(wantUpgrade && signedIn() && S.onboardedAt && !paid()) upgradeSheet('keep'); }).catch(function(){});
    /* back from Stripe: the webhook usually lands within a second or two of the redirect, so look a few times */
    if(back === '1') settle();
  }
  function settle(){
    if(settle.on) return;                                    /* the hand-back can arrive more than once; one poll is enough */
    settle.on = true;
    var looks = 0, look = function(){
      if(paid()){ settle.on = false; Account.settling = false; render(); toast('Welcome to the Household plan'); resumeAfter(); return; }
      if(++looks > 8){ settle.on = false; Account.settling = false; render(); toast('Paid \u2014 it can take a minute to show up here'); return; }
      setTimeout(function(){ Sync.pull().then(look).catch(look); }, looks < 3 ? 1500 : 3000);
    };
    setTimeout(look, 1200);
  }
  /* the iPhone app: a sign-in link or back.html opening the app lands here, with the url */
  var app = nativePlugin('App');
  if(app && app.addListener){
    app.addListener('appUrlOpen', function(ev){
      var u = String(ev && ev.url || '');
      var browser = nativePlugin('Browser'); if(browser) browser.close().catch(function(){});
      var m = /^lunchsorted:\/\/back\/?(?:\?(.*))?$/.exec(u);
      if(m){
        var q = new URLSearchParams(m[1] || '');
        UI.tab = 'setup'; Account.first = true;
        if(q.get('paid') === '1'){ Account.settling = true; render(); toast('Thank you \u2014 switching on the Household plan\u2026'); settle(); }
        else if(q.get('paid') === '0'){ rememberAfter(''); render(); toast('No charge was made'); }
        else { render(); Sync.pull(); }
        return;
      }
      if(/^https:\/\/([a-z0-9-]+\.)?lunchsorted\.app\//.test(u)) location.href = u;   /* a universal link, such as the sign-in link in the email */
    });
  }
  /* Safari closed on the Done button instead of the hand-off: look once anyway, so a payment made that way still shows */
  var nb = nativePlugin('Browser');
  if(nb && nb.addListener){
    nb.addListener('browserFinished', function(){
      if(!signedIn() || settle.on) return;
      var wasPaid = paid();
      Sync.pull().then(function(){ if(!wasPaid && paid()){ render(); toast('Welcome to the Household plan'); resumeAfter(); } else render(); }).catch(function(){});
    });
  }
  window.addEventListener('online', function(){ if(signedIn()) Sync.resume(); else render(); });
  window.addEventListener('pageshow', function(e){ if(e.persisted && Account.buying){ Account.buying = false; closeSheet(); render(); } });
  window.addEventListener('offline', function(){ renderSyncLine(); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) Sync.resume(); });
});
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/app/sw.js').catch(function(){ /* offline support is a bonus, not a requirement */ });
  });
}
</script>
