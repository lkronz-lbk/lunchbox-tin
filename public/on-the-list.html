<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On the list — Lunch Sorted</title>
<meta name="robots" content="index">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<meta name="theme-color" content="#E9EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1815" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&family=Karla:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{color-scheme:light dark;--ground:#E9EEE6;--ink:#16241E;--ink-2:#46584F;--ink-3:#78897F;--line:#CFDACB;--accent:#2E5A48}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0E1815;--ink:#E6EEE7;--ink-2:#A6BAAE;--ink-3:#7A8E84;--line:#2B3E36;--accent:#79C8A2}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Karla","Helvetica Neue",sans-serif;font-size:16px;line-height:1.65}
.wrap{max-width:660px;margin:0 auto;padding:48px 22px 80px}
h1{font-family:"Familjen Grotesk",sans-serif;font-size:34px;font-weight:700;letter-spacing:-0.025em;margin:0 0 8px}
h2{font-family:"Familjen Grotesk",sans-serif;font-size:20px;font-weight:600;margin:36px 0 6px}
p,li{color:var(--ink-2);max-width:62ch} p{margin:0 0 14px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
a{color:var(--accent)}
.back{display:inline-block;margin-top:34px;font-size:14px}
strong{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">Lunch Sorted beta</p>
<h1>You&rsquo;re on the list.</h1>
<p>When the next round of testing opens, or the app launches, you hear first.</p>
<a class="back" href="/">&larr; Back to Lunch Sorted</a>
</div>
</body>
</html>
