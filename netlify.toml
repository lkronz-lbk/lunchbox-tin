[build]
  publish = "public"
  # the only build step: apply any new database migration before the deploy
  # goes live (skips quietly on a deploy that has no database URL)
  command = "node scripts/migrate.mjs"
  # the test-only dependencies are never installed on Netlify
  [build.environment]
    NPM_FLAGS = "--omit=dev"
    NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The app shell and the worker must never be served stale, or a deploy
# can take days to reach an installed home-screen app.
[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  # Served without an extension, so Netlify needs telling what it is. Only the
  # sign-in link is claimed: claiming /app/* would pull every join and Stripe
  # return out of Safari on a phone with the app installed.
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  # Not content-hashed: a reshoot has to be able to reach a returning visitor,
  # so this revalidates rather than promising the file will never change.
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), browsing-topics=()"

# Content-Security-Policy is generated: `npm run csp` rewrites the values below
# from the sha256 of each inline script in public/app/index.html. The smoke
# suite serves the app under this exact header and fails if the hash is stale.
# One rule per path (not /*), because a second CSP on the same response would
# be enforced as an intersection and block the app's own scripts.
[[headers]]
  for = "/app/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-he6aXNwJHBAtLN4SzsTGMvHWNyquhnMZrW2CHNWOIpg=' 'sha256-cwNUHM2e2B2dKEOY75GwR9pAZ2FL7kOXN/q6Oy8jBX4=' 'sha256-SbpgugZI68LG1iUVdCgkblUJ5WuJUNx93jC5POs5UBQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/privacy.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/terms.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/help.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/feedback.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/thanks.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/on-the-list.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/back.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-ErKJMhi+cXx9nArf22tyckCjEFsTa2OT1R3fwnluS1Y='; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    Cache-Control = "public, max-age=0, must-revalidate"

# /app and /app/ both open the planner
# short links for posts; the tags let GA4 tell the sources apart
[[redirects]]
  from = "/ig"
  to = "/?utm_source=instagram&utm_medium=reel&utm_campaign=lunch_haters"
  status = 302

[[redirects]]
  from = "/tester"
  to = "/beta?utm_source=share&utm_medium=link&utm_campaign=beta"
  status = 302

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# the numbers page is a function; the short address is the one to remember
[[redirects]]
  from = "/admin"
  to = "/api/admin"
  status = 200

# ---------------------------------------------------------------------------
# Deploy contexts.
#
#   production     main            → the live site
#   branch-deploy  dev             → dev--<site>.netlify.app, the staging copy
#   deploy-preview  any open PR    → a throwaway URL per pull request
#
# Netlify serves branch deploys and previews with X-Robots-Tag: noindex, so a
# staging copy of the marketing page can't compete with the real one in search.
#
# SITE_ENV below reaches the BUILD only (the migration). Netlify does not pass
# toml variables to functions at run time, so SITE_ENV must also be set in the
# Netlify UI, scoped per context (production / staging / preview); failing that
# the code falls back to Netlify's own CONTEXT variable (netlify/lib/db.js).
# Production reads NETLIFY_DATABASE_URL; every other context reads
# STAGING_DATABASE_URL and refuses to run without it, so a branch deploy or a
# preview can never touch production data or migrate it.
# ---------------------------------------------------------------------------

[context.production.environment]
  SITE_ENV = "production"

[context.branch-deploy.environment]
  SITE_ENV = "staging"

[context.deploy-preview.environment]
  SITE_ENV = "preview"
