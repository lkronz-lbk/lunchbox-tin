[build]
  publish = "public"
  # the only build step: apply any new database migration before the deploy
  # goes live (skips quietly on a deploy that has no database URL)
  command = "node scripts/migrate.mjs"
  # the test-only dependencies are never installed on Netlify
  [build.environment]
    NPM_FLAGS = "--omit=dev"
    NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The app shell and the worker must never be served stale, or a deploy
# can take days to reach an installed home-screen app.
[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), browsing-topics=()"

# Content-Security-Policy is generated: `npm run csp` rewrites the values below
# from the sha256 of each inline script in public/app/index.html. The smoke
# suite serves the app under this exact header and fails if the hash is stale.
# One rule per path (not /*), because a second CSP on the same response would
# be enforced as an intersection and block the app's own scripts.
[[headers]]
  for = "/app/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-ijdlN91twPyf1BeTz+lk/jvNeJrDMT5U2pp7i0FMRkE=' 'sha256-xmPvQSM02+m6Y7Viedo6rs+3PE0ZwRY48UkIYHDtMl8=' 'sha256-SbpgugZI68LG1iUVdCgkblUJ5WuJUNx93jC5POs5UBQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/privacy.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

# /app and /app/ both open the planner
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# ---------------------------------------------------------------------------
# Deploy contexts.
#
#   production     main            → the live site
#   branch-deploy  dev             → dev--<site>.netlify.app, the staging copy
#   deploy-preview  any open PR    → a throwaway URL per pull request
#
# Netlify serves branch deploys and previews with X-Robots-Tag: noindex, so a
# staging copy of the marketing page can't compete with the real one in search.
#
# There is no build step yet, so these variables do nothing today. They exist
# because this is the seam that matters later: when phase two adds a database
# and phase three adds Stripe, the test keys and the staging database URL are
# set per context here, and production credentials never reach a preview.
# ---------------------------------------------------------------------------

[context.production.environment]
  SITE_ENV = "production"

[context.branch-deploy.environment]
  SITE_ENV = "staging"

[context.deploy-preview.environment]
  SITE_ENV = "preview"
