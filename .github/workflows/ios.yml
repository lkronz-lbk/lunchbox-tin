name: iOS

# Builds the iPhone shell on Apple's runner so the Xcode project is proven to
# compile on every change to it, with no Mac in the loop. Unsigned: a
# simulator build. Signing and TestFlight upload come when the App Store
# Connect key and the certificate exist as repository secrets (see ios/README.md).
on:
  push:
    branches: [main, dev]
    paths: ['ios/**', 'capacitor.config.json', 'ios-www/**', 'package.json', 'package-lock.json', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'capacitor.config.json', 'ios-www/**', 'package.json', 'package-lock.json', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Simulator build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync the Capacitor project
        run: npx cap sync ios

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E 'error:|warning: .*App/|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' build.log

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
