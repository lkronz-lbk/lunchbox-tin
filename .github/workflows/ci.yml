name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# one run per commit: a push and its pull request share a group by head sha,
# and a burst of pushes cancels the superseded runs
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    # ships Chromium and its system libraries, so nothing is downloaded per run
    container: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Check the CSP hashes before anything slow
        run: node scripts/csp.mjs --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run smoke tests
        run: npm test
